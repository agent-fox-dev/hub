# OpenAPI 3.1 description of the af-hub REST API.
#
# Derived from the hub source tree and from apikit (github.com/txsvc/apikit,
# resolved through the `replace` directive in go.mod), cross-checked against
# docs/api.md and docs/permissions.md. Endpoints served by apikit rather than
# by hub code are marked `x-provider: apikit`. Where the prose docs disagree
# with the handlers, the handlers win; the divergences are recorded in
# docs/errata/openapi_description.md.
openapi: 3.1.0

info:
  title: agent-fox hub REST API
  version: "0.19.0"
  summary: Headless harness for spec-driven, multi-agent software development.
  description: |
    The `hub` binary is the API server for agent-fox. It owns user identity,
    OAuth, workspaces, git hosting, the merge queue, carry-patch workflows,
    secrets, variables, agent sessions, and audit storage.

    ## Base paths

    | Prefix | Contents |
    |--------|----------|
    | `/api/v1` | Everything under the API mount point: workspaces, patches, rebuilds, merges, secrets, variables, sandbox profiles, sessions, audit, and the apikit identity and administration endpoints |
    | `/git` | Built-in git smart HTTP server (`/git/<org>/<slug>.git`) |
    | *(root)* | `/healthz`, `/readyz`, `/version`, and `/metrics` |

    The `/api/v1` prefix comes from `server.mount_point` in `config.toml` and
    defaults to `/api/v1`. Everything apikit mounts -- `/user`, `/users`,
    `/orgs`, `/auth` -- goes on that same group, so those paths are
    `/api/v1/user`, `/api/v1/users`, and so on. `docs/api.md` and
    `docs/permissions.md` both write them without the prefix; see
    `docs/errata/openapi_description.md`.

    ## Authentication

    Every `/api/v1` endpoint requires a bearer credential, except the two
    OAuth routes (`GET /api/v1/auth/providers` and
    `POST /api/v1/auth/callback`), which are registered before the auth
    middleware is attached to the group. Three credential types exist:

    - **Admin token** (`af_admin_<64-hex>`) -- implicit full access, bypasses
      permission and ownership checks. Cannot create workspaces (no user
      identity to own them).
    - **API key** (`af_<key_id>_<secret>`) -- implicit full access to the
      owning user's resources. Created only through the OAuth login flow.
    - **Personal access token / PAT** (`af_pat_<token_id>_<secret>`) --
      explicit scope-based access, restricted to the scopes granted at
      creation. Never treated as admin, even for admin-role users.

    Scope checks constrain PATs only. Each operation records the scopes it
    accepts in the non-standard `x-required-scopes` field; an empty list
    means no PAT scope check is performed.

    The git smart HTTP endpoints use HTTP Basic authentication instead: the
    username is ignored and the password must be any valid hub credential.

    ## Workspace-bound tokens

    A PAT can be bound to one workspace `S` (hub's table
    `token_workspace_bindings`). For such a token, every route whose path
    template contains `workspaces/:slug` answers `404 workspace not found` for
    a slug other than `S`, before any scope check. `GET /api/v1/workspaces`,
    the session routes, `GET /api/v1/audit`, `GET /api/v1/events` and
    `GET /api/v1/sandbox-profiles` are allowed and see only `S`. Every other
    route answers `403` with `error_type: token_bound`: the message is
    `this token is bound to workspace <S>` on hub's routes and
    `this token is bound to a workspace` on the routes apikit mounts. The git
    server answers a pkt-line `404 repository not found` for every repository
    but `S`'s. API keys, admin tokens and unbound PATs are not affected.
    Bound tokens are minted with `POST /api/v1/workspaces/{slug}/tokens` and
    retired when their workspace is deleted. A mint records
    `hub.token.bind`; every request refused because of a binding is recorded
    as `hub.token.bound_refused`, at most once per token per minute, with
    `suppressed` counting the refusals held back since the token's previous
    event.

    ## Anti-enumeration policy

    Workspace CRUD endpoints (list, get, update, archive, reactivate, delete)
    return `404` -- not `403` -- when a PAT lacks the required scope or the
    caller may not see the workspace (not its owner, not a member of its org,
    not an admin token), so that workspace slugs cannot be enumerated. A member
    of the workspace's org knows it exists: a member's write is `403` with
    `error_type: forbidden`. The git server likewise answers a pkt-line `404` to a caller who may not read the workspace, and a pkt-line `403` to a member's push.
    Workspace *creation* returns `403`, because there is no existing resource
    to enumerate. Other endpoint families return `403` for a missing scope.

    ## Workspace access

    Every REST route that names a workspace decides the caller's access in
    one place (`wsaccess`; the session, cost and audit routes keep their own
    refusal answers, see below): an admin token is `admin`, the workspace's owner
    `owner`, a user with an `org_members` row for the workspace's org
    `member`, anyone else has none (`404 workspace not found`). Each route
    needs a level. *Read* (the workspace, patch, rebuild, rebuild-preview,
    patch-status, rerere and merge reads, the lease list and get, the forge
    reads and deliveries, the variable list and `vars/resolved`) admits
    members. *Write* (every change: workspace update, archive, reactivate,
    delete, sync and reclone, branch push, patch, rebuild, rerere-forget,
    merge, rebase, lease, forge and webhook writes, variable writes) answers a member `403`
    `org members have read-only access to this workspace` with
    `error_type: forbidden`. *Private* (workspace secrets, bound tokens)
    answers a member the stranger's `404`. The access check runs after the
    PAT scope check and before status checks. The session, cost and audit
    routes use the same rule with their own refusals: a member reads the
    per-run audit records and transcripts (`404 workspace not found` for
    anyone else), the sessions, usage and cost of an active workspace (`403
    workspace access denied` for anyone else), and the workspace's events in
    the unified audit query and the SSE stream; opening a session answers a
    member `403 forbidden`, and completing sessions, usage reports and
    ingestion stay with the owner. The git server (not described here) lets a member clone and fetch and refuses a member's push with a pkt-line `403`. `GET /api/v1/workspaces` lists the caller's own
    workspaces and those of the caller's orgs, and every workspace object
    carries `access` and `org_slug`.

    ## Workspace lock

    Operations that modify or read a workspace clone (the branch push among
    them) are serialised per workspace. Handlers that cannot take the lock
    immediately answer `409` with `error_type: workspace_busy`.

    A carry-patch rebuild applies patches in its own detached worktree and
    holds the lock only for its fetch phase (upstream fetch and base
    resolution) and its final phase (integration-ref update, patch
    bookkeeping, optional push to `origin`). Sync, rollback, rerere forget,
    batch rebase and the branch push are rejected only while a rebuild is in
    one of those two phases. Archive and reclone delete the directory the worktree lives in, so
    they answer `409 workspace_busy` for the whole rebuild.

    ## Error envelope

    All errors use the apikit envelope: `{"error": {"code": N, "message":
    "..."}}`. Some handlers add a machine-readable `error_type` field.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: agent-fox hub
    url: https://github.com/agent-fox-dev/hub

servers:
  - url: http://localhost:8080
    description: Local development server (default `server.port` = 8080)
  - url: "{external_url}"
    description: Deployment configured through `server.external_url` in config.toml
    variables:
      external_url:
        default: http://localhost:8080

externalDocs:
  description: Hand-written API reference
  url: https://github.com/agent-fox-dev/hub/blob/main/docs/api.md

tags:
  - name: Health
    description: Liveness and readiness probes. Unauthenticated.
  - name: Metrics
    description: Prometheus exposition endpoint. Unauthenticated.
  - name: Workspaces
    description: Workspace lifecycle -- create, list, update, archive, sync, reclone, delete.
  - name: Patches
    description: Ordered patch-branch list for carry-patch workspaces.
  - name: Rerere
    description: Recorded git rerere conflict resolutions.
  - name: Rebuilds
    description: Integration-branch rebuild jobs for carry-patch workspaces.
  - name: Merges
    description: Rebase-then-fast-forward merge queue and batch rebase.
  - name: Secrets
    description: Write-only secret storage scoped to a user, org, or workspace.
  - name: Variables
    description: Readable variable storage scoped to a user, org, or workspace.
  - name: Sandboxes
    description: >-
      The deployment's sandbox profiles (read-only, defined in config.toml) and
      sandbox leases. A lease holder creates its one sandbox through the hub's
      sandbox gateway, a gRPC service on its own listener at the lease's
      `gateway_url`, with the lease's token.
  - name: Forge
    description: >-
      A workspace's repository, issues and pull requests on its forge (GitHub or
      GitLab), read and written through the hub with the credential the hub holds
      for the workspace and never the caller's. The reads need `forge:read`; the
      writes need `forge:write` and an active workspace, and each one that reaches
      the forge is recorded as a `hub.forge.*` audit event. The forge's webhook
      deliveries are received on a public endpoint, `POST /hooks/forge/{slug}`,
      checked against the workspace's webhook secret, recorded once and relayed
      as `hub.forge.*` audit events; three routes set and remove the secret and
      list the deliveries.
  - name: Sessions
    description: Agent session lifecycle, token usage, and cost aggregation.
  - name: Audit Ingestion
    description: Per-run telemetry ingestion and query (DuckDB backed).
  - name: Audit Query
    description: Unified audit query, transcripts, and the SSE event stream.
  - name: Git
    description: Built-in git smart HTTP server.
  - name: Identity
    description: >-
      OAuth login, the caller's own profile, API keys, and personal access
      tokens. Provided by apikit and mounted under the API prefix.
  - name: Administration
    description: >-
      Cross-tenant user and organization administration. Provided by apikit;
      requires an admin token or an admin-role API key.

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------------
  # Health and metrics
  # ---------------------------------------------------------------------------

  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Reports that the process is up. Mounted outside the API auth group.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
              example: { status: ok }

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Runs the registered health checker, which pings the primary SQLite
        database. Mounted outside the API auth group.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The server is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ready
              example: { status: ready }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Scrapes all `afhub_*` metrics from the custom Prometheus registry in
        the text exposition format. Mounted outside the API auth middleware,
        so no `Authorization` header is required.

        Exposed series: `afhub_http_requests_total`,
        `afhub_http_request_duration_seconds`, `afhub_agent_sessions_active`,
        `afhub_agent_tokens_total`, `afhub_audit_events_total`,
        `afhub_audit_table_rows`, `afhub_retention_errors_total`,
        `afhub_retention_last_run_timestamp_seconds`, `afhub_sse_connections`,
        `afhub_jobqueue_depth`, `afhub_sandboxes_active` (gauge by
        `workspace`: leases in state `active`), `afhub_sandbox_creates_total`
        (counter by `result`, `created` or `failed`) and
        `afhub_sandbox_lease_seconds` (histogram: seconds from issue to
        destruction of a lease that became `destroyed`).

        The `path` label carries the Echo route template (for example
        `/api/v1/sessions/:id`) rather than the resolved URI, to bound
        cardinality.
      security: []
      x-required-scopes: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Workspaces
  # ---------------------------------------------------------------------------

  /api/v1/workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace and enqueues an asynchronous clone job. The
        response is returned immediately with `clone_status` set to
        `pending`; poll `GET /api/v1/workspaces/{slug}` to observe the
        transition to `cloning` and then `ready` or `failed`.

        When `org_id` is omitted or empty the server assigns the caller's
        personal organization; if the caller has none, the request fails with
        `400`.

        Git credentials supplied in the body are validated with `ls-remote`,
        stored as workspace secrets, and zeroed out of the request struct
        immediately after binding so they never reach logs.

        Admin tokens are rejected with `403`: a workspace requires a real
        user as owner.
      x-required-scopes: ["workspaces:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
            examples:
              standard:
                summary: Standard workspace
                value:
                  slug: my-project
                  git_url: https://github.com/user/repo.git
                  branch: main
                  display_name: My Project
                  description: A description of the workspace
              carryPatch:
                summary: Carry-patch workspace with a private upstream
                value:
                  slug: vendor-fork
                  git_url: https://github.com/acme/vendor-fork.git
                  workspace_mode: carry_patch
                  upstream_url: https://github.com/upstream/repo.git
                  integration_branch: deploy
                  git_pat: ghp_xxxxxxxxxxxx
      responses:
        "201":
          description: Workspace created; the clone job is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: |
            Missing `slug` or `git_url`; `display_name` over 128 characters;
            `description` over 1024 characters; invalid `sync_mode` or
            `workspace_mode`; `upstream_url` missing for a carry-patch
            workspace or supplied for a standard one; git credentials that are
            empty, mutually exclusive, incompletely paired, used with a
            non-HTTPS `git_url`, or that fail the `ls-remote` check; or the
            caller has no personal organization while `org_id` was omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            An admin token attempted to create a workspace, or the PAT lacks
            the `workspaces:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A workspace with this slug already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces
      description: |
        Non-admin callers see only workspaces they own. Admin tokens see every
        workspace on the server.
      x-required-scopes: ["workspaces:read", "workspaces:write"]
      parameters:
        - name: include_archived
          in: query
          required: false
          description: >-
            Include archived workspaces in the listing. Only the exact string
            `true` enables this.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The accessible workspaces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The PAT lacks read access (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace
      x-required-scopes: ["workspaces:read", "workspaces:write"]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update mutable workspace properties
      description: |
        Partial update: only the fields present in the body are modified.
        At least one field must be supplied.

        `slug`, `git_url`, `branch`, `owner_id`, `workspace_mode`,
        `upstream_url`, and `integration_branch` are immutable -- including any
        of them in the body is rejected with `400`. `updated_at` is advanced on
        every successful update.
      x-required-scopes: ["workspaces:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: >-
            Empty body; workspace is archived (reactivate first);
            `display_name` over 128 characters; `description` over 1024
            characters; an immutable field was included; or `sync_mode` is
            invalid or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The workspace owner is not a member of the organization in `org_id`. A member of the workspace's organization also gets 403, `org members have read-only access to this workspace` with `error_type: forbidden`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Permanently delete an archived workspace
      description: |
        Only archived workspaces can be deleted. In the same transaction, every live token
        bound to the workspace is revoked and its binding removed; the
        `hub.workspace.delete` event lists the revoked ids in
        `revoked_tokens`. A failure of any step deletes nothing (500
        `failed to delete workspace`).
      x-required-scopes: ["workspaces:write"]
      responses:
        "204":
          description: Workspace deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MemberReadOnly"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "409":
          description: The workspace is not archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/tokens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Workspaces]
      operationId: mintBoundToken
      summary: Mint a personal access token bound to the workspace
      description: |
        Hub serves apikit's own `POST /api/v1/user/tokens` in-process with the
        caller's body and `Authorization` header, then binds the new token to
        the workspace. apikit checks `tokens:manage`, the scopes a PAT may grant
        and `expires`; any answer of apikit other than 201 is passed through
        unchanged. Checks before apikit, in order: 401; a bound PAT 403
        `token_bound` (500 when the binding lookup fails); an admin token 403;
        404 for a workspace that is missing or not owned; 400 `workspace is not
        active`. After apikit's 201 a failure revokes the token before the
        answer: 404 when the workspace was deleted meanwhile, otherwise 500
        `failed to bind the token to the workspace`. The 201 is the only
        response that carries the token, with `Cache-Control: no-store`, and
        emits `hub.token.bind`.
      x-required-scopes: ["tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                expires:
                  type: integer
                  enum: [0, 30, 60, 90]
                  description: Days until expiry; 0 never expires.
      responses:
        "201":
          description: The bound token. The only response that carries it.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundTokenCreated"
        "400":
          description: The workspace is not active, or apikit refused the body (passed through).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            A bound PAT (`error_type: token_bound`), an admin token, or apikit's
            refusal (a missing `tokens:manage`, or scopes the PAT does not hold).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "500":
          description: The binding lookup failed, or the token could not be bound and was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Workspaces]
      operationId: listBoundTokens
      summary: List the tokens bound to the workspace
      description: |
        Every token bound to the workspace, revoked and expired ones
        included, ordered by the token's `created_at` and then `token_id`, as
        a bare array (`[]` when none). Works on archived workspaces. Open to
        the owner and to admin tokens. Never carries a token or its hash.
        Checks, in order: 401; a bound PAT 403 `token_bound`; a PAT with
        neither `tokens:read` nor `tokens:manage` 403; 404 for a workspace that
        is missing or neither owned nor read by an admin token.
      x-required-scopes: ["tokens:read", "tokens:manage"]
      responses:
        "200":
          description: The workspace's bound tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoundToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 'A bound PAT (`error_type: token_bound`), or a PAT without `tokens:read` or `tokens:manage`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/archive:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Workspaces]
      operationId: archiveWorkspace
      summary: Archive a workspace
      description: |
        Archived workspaces are read-only; all state is preserved and the
        workspace can be reactivated later. Any active agent sessions for the
        workspace are force-closed and an audit event is emitted.
      x-required-scopes: ["workspaces:write"]
      responses:
        "200":
          description: The archived workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: The workspace is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MemberReadOnly"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "409":
          description: >-
            A clone is in progress (archiving is rejected until it settles), or
            another operation holds the workspace lock (`error_type:
            workspace_busy`). A running carry-patch rebuild makes archive answer
            `workspace_busy` for the whole rebuild.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/reactivate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Workspaces]
      operationId: reactivateWorkspace
      summary: Reactivate an archived workspace
      description: |
        Restores `status` to `active`, resets `clone_status` to `pending`, and
        enqueues a reclone job.
      x-required-scopes: ["workspaces:write"]
      responses:
        "200":
          description: The reactivated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MemberReadOnly"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrForbidden"
        "409":
          description: The workspace is not archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/sync:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Workspaces]
      operationId: syncWorkspace
      summary: Sync a workspace with its upstream
      description: |
        Fetches from the remote and fast-forwards the local integration branch
        when possible. Ownership is **not** enforced: any authenticated caller
        holding the scope may sync any workspace.

        Preconditions: `status` is `active`, `clone_status` is `ready`,
        `sync_mode` is not `disabled`, and `sync_status` is not `syncing`.

        `sync_status` follows a strict state machine
        (`idle -> syncing -> idle|error`, `error -> syncing -> idle`); a
        deferred cleanup guarantees it never remains stuck at `syncing`.

        ### Response shape

        The response is always the updated workspace object. For a
        `carry_patch` workspace the request is delegated to the carry-patch
        sync extension -- which fetches the `upstream` remote, detects patches
        merged upstream, flags upstream force-pushes, and may enqueue a
        rebuild -- and its four fields are merged into the workspace JSON as
        additional top-level keys, per 16-REQ-5.1. The workspace row is
        re-read after the extension runs, so `upstream_head_sha` and
        `last_sync_at` reflect its writes.

        A `standard` workspace takes the standard sync path and carries none
        of the carry-patch fields (16-REQ-5.E4).

        Merge detection for carry-patch workspaces is governed by the
        `squash_merge_detection` workspace setting (`ancestry_only`,
        `content_based`, or `both`, the default). A rebuild is enqueued when
        the upstream ref advanced unless `auto_rebuild_after_sync` is
        `"false"`; a duplicate enqueue is ignored silently and leaves
        `rebuild_triggered` false.
      x-required-scopes: ["workspaces:write"]
      parameters:
        - name: reset_to_upstream
          in: query
          required: false
          description: >-
            Force-reset the local integration branch to the upstream HEAD,
            ignoring ancestry. Used to recover from a diverged (force-pushed)
            upstream. Standard workspaces only.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            Sync completed. The body is the updated workspace; a carry-patch
            workspace additionally carries `patches_merged`,
            `rebuild_triggered`, `force_push_detected`, and -- when a rebuild
            was enqueued -- `rebuild_job_id`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Workspace"
                  - $ref: "#/components/schemas/CarryPatchSyncResponse"
              examples:
                standard:
                  summary: Standard workspace, fast-forwarded
                  value:
                    slug: my-project
                    status: active
                    clone_status: ready
                    sync_status: idle
                    workspace_mode: standard
                    head_sha: fedcba9876543210fedcba9876543210fedcba98
                    upstream_head_sha: fedcba9876543210fedcba9876543210fedcba98
                    last_sync_at: "2026-09-01T12:00:00Z"
                carryPatch:
                  summary: Carry-patch workspace, rebuild enqueued
                  value:
                    slug: vendor-fork
                    status: active
                    clone_status: ready
                    sync_status: idle
                    workspace_mode: carry_patch
                    upstream_url: https://github.com/upstream/repo.git
                    integration_branch: deploy
                    upstream_head_sha: abc123def456abc123def456abc123def456abcd
                    last_sync_at: "2026-09-01T12:00:00Z"
                    patches_merged: ["feature/already-merged"]
                    rebuild_triggered: true
                    rebuild_job_id: d3b07384-d113-4ec5-8a4e-a12345678901
                    force_push_detected: false
        "400":
          description: The workspace is not active, the clone is not ready, or sync is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The PAT lacks the `workspaces:write` scope. A member of the workspace's organization also gets 403, `org members have read-only access to this workspace` with `error_type: forbidden`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          description: >-
            A sync is already in progress, or the upstream history has diverged
            (force-push detected) on a standard workspace, or another operation
            holds the workspace lock (`error_type: workspace_busy`). A rebuild
            holds the lock only during its fetch phase and final phase, not
            while it applies patches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          description: >-
            Upstream fetch failed (network, authentication, or repository
            error), or credential resolution failed. In origin mode, also
            returned when the origin fetch fails (`error_type:
            origin_fetch_failed`) or origin credentials cannot be resolved
            (`failed to resolve origin credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The request context was cancelled mid-sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/reclone:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Workspaces]
      operationId: recloneWorkspace
      summary: Nuclear recovery -- delete and re-clone the local repository
      description: |
        Runs the archive flow (attempting to push local commits upstream first;
        a failed push is logged and does not abort), deletes
        `<WORKSPACE_ROOT>/<slug>/`, resets `clone_status` to `pending`, clears
        `sync_error` and `upstream_head_sha`, and enqueues a clone job. The
        workspace `status` stays `active` throughout.

        Ownership is not enforced.
      x-required-scopes: ["workspaces:write"]
      responses:
        "200":
          description: Reclone accepted; the clone job is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The PAT lacks the `workspaces:write` scope. A member of the workspace's organization also gets 403, `org members have read-only access to this workspace` with `error_type: forbidden`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          description: >-
            A clone is already in progress (`clone_status` is `pending` or
            `cloning`), or another operation holds the workspace lock, or a
            carry-patch rebuild is running (`error_type: workspace_busy`;
            reclone is rejected for the whole rebuild).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to delete the workspace directory, or the database update failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/branches/{name}/push:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: name
        in: path
        required: true
        description: >-
          The branch name as one path segment, each `/` escaped as `%2F`
          (`fix%2F42-nil-map` names `fix/42-nil-map`). Hub decodes the segment
          as sent exactly once, so `a%2525b` names `a%25b`. A path with an
          unescaped `/` in the name matches no route.
        schema:
          type: string
    post:
      tags: [Workspaces]
      operationId: pushWorkspaceBranch
      summary: Push one branch of the trunk to the workspace's origin
      description: |
        Pushes `refs/heads/<name>` of the workspace's trunk to
        `refs/heads/<name>` on `origin` at `git_url`, with the workspace's
        stored git credential (`GIT_PAT`, otherwise `GIT_USERNAME` and
        `GIT_PASSWORD`, otherwise none), fast-forward only unless `force` is
        given. Write access, as for every workspace write: the owner or an
        admin token; a member of the workspace's org gets `403 forbidden`,
        anyone else `404`. A PAT bound to another workspace gets `404` before
        its scope is looked at.

        Before the workspace lock is taken: the scope, access, body and name
        checks, `status` `active` and `clone_status` `ready`, and the branches
        this route does not push (on `carry_patch` the integration branch,
        `400 integration_branch`, and a registered patch, `400 patch_branch`;
        with `force`, the `branch` column, `400 protected_branch`). The lock is
        taken without waiting (`409 workspace_busy`). Under it: with `force`
        and no `branch` column, the trunk's `HEAD` branch is `400
        protected_branch`; a missing branch is `404 branch_not_found`; then the
        push, with a two-minute deadline from its start.

        The push runs to its end when the caller goes away, and the lock is
        held until it ends. If a push to hub's git server moved the checked-out
        branch meanwhile, hub hard-resets the trunk's worktree to the new
        `HEAD` before releasing the lock.

        The message of every answer with one of the route's own error types
        (`branch_not_found`, `integration_branch`, `patch_branch`,
        `protected_branch`, `non_fast_forward`, `forge_*`) begins with the
        error type and `: `. No answer carries the credential or the userinfo
        of `git_url`. Every push attempt (the `200`s, `409 non_fast_forward`,
        `404 forge_not_found`, `422`, the `502`s and `504`) records one
        `hub.branch.push` audit event with `branch`, `sha`, `force`, `ok`,
        `remote`, `remote_url`, and `result` or `error_type`; refusals and
        `500`s record nothing.
      x-required-scopes: ["workspaces:write"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: An empty body, `{}` and unknown fields push without force.
              properties:
                force:
                  type: boolean
                  default: false
                  description: >-
                    Overwrite origin's branch when it has commits the trunk's
                    branch lacks. Refused on the workspace's own branch.
      responses:
        "200":
          description: >-
            The push ended. `result` is `up_to_date` when origin already had
            the commit and nothing was sent (also with `force`), `forced` when
            `force` was given and origin accepted an update, and `pushed`
            otherwise.
          content:
            application/json:
              schema:
                type: object
                required: [branch, sha, remote, remote_url, result]
                properties:
                  branch: { type: string, example: fix/42-nil-map }
                  sha:
                    type: string
                    description: The trunk's tip of the branch that was offered to origin.
                  remote: { type: string, enum: [origin] }
                  remote_url:
                    type: string
                    description: >-
                      `git_url` with any userinfo removed; an scp-style address
                      (`git@host:path`) comes back unchanged.
                  result: { type: string, enum: [pushed, up_to_date, forced] }
        "400":
          description: >-
            The body is not a JSON object or `force` is not a boolean; the
            workspace is not active or its clone is not ready;
            `integration_branch`, `patch_branch` or `protected_branch`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The PAT lacks `workspaces:write` (`PAT requires workspaces:write
            scope to push branches`, no `error_type`), or the caller is a
            member of the workspace's org (`error_type: forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `workspace not found`; `branch_not_found` (a name that breaks git's
            branch-name rules, naming the rule, or a branch the trunk lacks);
            `forge_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `workspace_busy`; `non_fast_forward`: origin's branch has commits
            the trunk's lacks. The message names origin's commit when hub could
            list origin's refs and ends with a hint to push with force, or to
            sync the workspace on its own branch; when `force` was given and
            origin still refused, it says origin refuses non-fast-forward
            updates of the branch also with force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`forge_rejected`: origin refused the ref; the message carries its reason, scrubbed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            A database or secrets store failure, a trunk that cannot be opened
            or has no `origin`, or an unreadable `HEAD` for a forced push
            without a `branch` column.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "`forge_unauthenticated`, `forge_forbidden`, `forge_unreachable` or `forge_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: "`forge_timeout`: the push did not end within two minutes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Patches
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/patches:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Patches]
      operationId: addPatches
      summary: Add one or more patches
      description: |
        Accepts either a single patch object or a JSON array of them. A batch
        is validated and inserted inside one transaction: if any entry fails,
        nothing is inserted.

        When `position` is omitted the patch is appended at `max(position) + 1`.
        When it is supplied, existing patches at that position and beyond are
        shifted down by one. Positions greater than `max + 1` are clamped to an
        append.

        Unless `skip_branch_check` is `true`, the server resolves the branch
        in this order: (1) `local` — `refs/heads/<name>` exists in the trunk;
        (2) `origin_tracking` — `refs/remotes/origin/<name>` exists and a
        local branch is created at that commit; (3) `origin_fetch` — only
        when `patch_branch_source` is `origin`, the branch is fetched from
        the fork and the local branch is created. Tags, bare SHAs and
        remote-qualified names are not accepted. `patch_branch_source` is read
        once per request, so every element of a batch resolves in the same
        mode.

        A batch validates the syntax of every element first (name,
        integration branch, position) and starts resolving branches only
        after all elements pass.

        Ownership is not enforced.
      x-required-scopes: ["patches:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AddPatchRequest"
                - type: array
                  items:
                    $ref: "#/components/schemas/AddPatchRequest"
            examples:
              single:
                summary: Single patch
                value:
                  branch_name: feature/auth-headers
                  position: 2
                  upstream_pr_url: https://github.com/upstream/repo/pull/42
                  description: Add authentication headers to API
              batch:
                summary: Batch insert
                value:
                  - { branch_name: feature/a, position: 1 }
                  - { branch_name: feature/b }
                  - { branch_name: feature/c, upstream_pr_url: "https://github.com/upstream/repo/pull/99" }
      responses:
        "200":
          description: >-
            `if_not_exists` was true and the branch is already registered; the
            existing patch is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patch"
        "201":
          description: The created patch, or the array of created patches for a batch request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Patch"
                  - type: array
                    items:
                      $ref: "#/components/schemas/Patch"
        "400":
          description: >-
            `branch_name` is absent or empty; `branch_name` equals the
            workspace `integration_branch`; the workspace is missing, inactive,
            or in `standard` mode; `position` is below 1; or the branch does
            not exist in the repository or on origin and `skip_branch_check`
            is false. In a batch the message is prefixed `patch[i]: `.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "409":
          description: >-
            The branch is already registered for this workspace (and
            `if_not_exists` is false), or the batch contains a duplicate
            `branch_name`, or another operation holds the workspace lock
            (`error_type: workspace_busy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          description: >-
            Origin fetch failed (`error_type: origin_fetch_failed`). Returned
            when `patch_branch_source` is `origin` and the fetch from the fork
            fails due to a network or authentication error, or when origin
            credentials cannot be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Patches]
      operationId: listPatches
      summary: List patches
      description: |
        Returns every non-deleted patch ordered by ascending position.
        Soft-deleted patches (status `deleted`) are excluded. Standard
        (non-carry-patch) workspaces return an empty array rather than an
        error. Ownership is not enforced.
      x-required-scopes: ["patches:read", "patches:write"]
      responses:
        "200":
          description: The patch list in position order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/patches/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/PatchId"
    get:
      tags: [Patches]
      operationId: getPatch
      summary: Get a single patch
      description: |
        Returns the patch record. When `refs/hub/replaced/<branch>` resolves
        to a commit, the response also carries `replaced_sha` (the full
        40-character SHA). The field is omitted when the ref does not exist,
        the trunk is not on disk, no recovery hook is registered, or the
        lookup fails. A soft-deleted patch is returned with its `deleted`
        status.
      x-required-scopes: ["patches:read", "patches:write"]
      responses:
        "200":
          description: The patch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Patch"
                  - type: object
                    properties:
                      replaced_sha:
                        type: string
                        description: >
                          Full 40-character SHA of the backup ref
                          `refs/hub/replaced/<branch>`. Omitted when the ref
                          does not exist.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/PatchNotFound"
    patch:
      tags: [Patches]
      operationId: updatePatch
      summary: Update a patch
      description: |
        Only the supplied fields change. `branch_name` is immutable and is
        silently ignored if present. Changing `position` reshuffles the other
        patches so positions stay a contiguous 1-based sequence.
      x-required-scopes: ["patches:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatchRequest"
      responses:
        "200":
          description: The updated patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patch"
        "400":
          description: >-
            `status` is not one of the valid values, or `position` is below 1 or
            above the total patch count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/PatchNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Patches]
      operationId: removePatch
      summary: Remove a patch
      description: |
        Deletes the patch row and compacts the remaining positions to a
        contiguous 1-based sequence. Both steps run in a single transaction.
      x-required-scopes: ["patches:write"]
      responses:
        "204":
          description: Patch removed and positions compacted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/PatchNotFound"
        "500":
          description: The delete-and-compact transaction failed; no partial state was persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/patches/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/PatchId"
    post:
      tags: [Patches]
      operationId: restorePatch
      summary: Restore a soft-deleted patch
      description: |
        Moves the patch from `deleted` back to `active`, clears `deleted_at`,
        and appends it at `max(position) + 1`.
      x-required-scopes: ["patches:write"]
      responses:
        "200":
          description: The restored patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patch"
        "400":
          description: >-
            The workspace is missing, inactive, or not in `carry_patch` mode, or
            the patch is not in `deleted` status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/PatchNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/patches/{id}/reset-to-origin:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/PatchId"
    post:
      tags: [Patches]
      operationId: resetPatchToOrigin
      summary: Reset a patch branch to the fork's current tip
      description: |
        Fetches the branch from the fork, compares the tips, and moves the
        local branch to the fork's tip regardless of `patch_divergence_policy`.
        If the move discards commits, the old tip is saved under
        `refs/hub/replaced/<branch>`. A fast-forward does not touch an existing
        backup.
      x-required-scopes: ["patches:write"]
      responses:
        "200":
          description: |
            The patch object as GET renders it, plus `rebuild_triggered` and
            optionally `rebuild_job_id`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Patch"
                  - type: object
                    properties:
                      replaced_sha:
                        type: string
                        description: >
                          Full 40-character SHA of the backup ref. Present
                          only when a backup exists after the reset.
                      rebuild_triggered:
                        type: boolean
                        description: Whether a rebuild job was enqueued.
                      rebuild_job_id:
                        type: string
                        description: >
                          ID of the enqueued rebuild job. Omitted when no
                          rebuild was enqueued.
        "400":
          description: >-
            Workspace is not active; workspace is not in `carry_patch` mode;
            patch branch is the integration branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/MemberReadOnly"
        "404":
          description: >-
            Workspace not found or the caller may not see it; patch not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Workspace clone is not ready; patch status cannot be reset;
            branch does not exist on origin (`error_type: missing_on_origin`);
            patch branch changed during reset (`error_type: ref_changed`);
            another operation holds the workspace lock
            (`error_type: workspace_busy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Patch reset is not configured; failed to update patch branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >-
            Origin fetch failed (`error_type: origin_fetch_failed`); failed
            to resolve origin credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/patches/reorder:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Patches]
      operationId: reorderPatches
      summary: Reorder the whole patch list
      description: |
        `patch_ids` must list exactly the workspace's patch IDs -- no missing,
        extra, or duplicated entries. New positions are assigned from the array
        index (first element becomes position 1). The whole reorder runs in one
        transaction.
      x-required-scopes: ["patches:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPatchesRequest"
      responses:
        "200":
          description: All patches in their new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"
        "400":
          description: >-
            `patch_ids` is empty while patches exist, omits an existing patch,
            contains duplicates, references a patch from another workspace, or
            the bulk position update failed. Every reorder error surfaces as
            `400`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"

  # ---------------------------------------------------------------------------
  # Rerere
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/rerere:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Rerere]
      operationId: listRerereResolutions
      summary: List recorded rerere resolutions
      description: |
        Reads `.git/rr-cache/` in the workspace clone. A missing or empty
        cache yields `{"resolutions": []}`; malformed cache subdirectories
        (missing preimage or postimage) are skipped silently.

        Ownership is not enforced.
      x-required-scopes: ["workspaces:read"]
      responses:
        "200":
          description: The recorded resolutions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerereListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rerere/{pathspec}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - name: pathspec
        in: path
        required: true
        description: >-
          File path whose recorded resolution should be forgotten. This is an
          Echo wildcard parameter, so it may contain slashes (for example
          `src/config.go`); do not percent-encode them.
        schema:
          type: string
        example: src/config.go
    delete:
      tags: [Rerere]
      operationId: forgetRerereResolution
      summary: Forget a recorded rerere resolution
      description: |
        Runs `git rerere forget <pathspec>` in the workspace clone. Requires
        the `workspaces:write` scope. Ownership is not enforced.
      x-required-scopes: ["workspaces:write"]
      responses:
        "204":
          description: The resolution was forgotten.
        "400":
          description: The pathspec is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: The workspace does not exist, or no resolution is recorded for the pathspec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Another operation holds the workspace lock (`error_type:
            workspace_busy`). A rebuild holds it only during its fetch phase
            and final phase, not while it applies patches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Rebuilds
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/rebuild:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Rebuilds]
      operationId: submitRebuild
      summary: Submit a rebuild job
      description: |
        Enqueues a job that reconstructs the integration branch from the
        upstream HEAD plus every applicable patch, in position order.

        Preconditions: the workspace is in `carry_patch` mode, `status` is
        `active`, `clone_status` is `ready`, at least one patch is `active` or
        `conflict`, and no rebuild job for this workspace is queued or running.

        With no body, `strategy` falls back to the `rebuild_strategy` workspace
        variable (`rebase` if unset) and `fail_mode` to `rebuild_fail_mode`.
        If neither the body nor a variable supplies `fail_mode`, it is left
        empty at enqueue time and the executor applies `fail_fast` at runtime.

        The executor: fetches upstream, creates a detached git worktree at the
        upstream HEAD (the workspace's trunk checkout is never changed),
        enables rerere, resolves each patch branch to a tip SHA
        (`patch_results[].source_sha`), then for each patch in order skips `merged_upstream`,
        `disabled`, `deleted`, and missing-branch patches and otherwise applies
        it (`rebase` cherry-picks each unique commit; `merge` uses
        `git merge --no-ff`). Conflicts are replayed through rerere; anything
        still unresolved either aborts the rebuild (`fail_fast`) or marks the
        patch `conflict` and continues (`continue`). Finally the integration
        ref is force-updated, `merged_upstream` patches are soft-deleted, and
        the remaining positions are compacted. If a patch tip or the upstream
        base moved during the run, one follow-up rebuild is enqueued
        (`submitted_by: system:stale-snapshot`).

        A rebuild is also enqueued automatically when a push lands on a
        registered patch branch, unless `auto_rebuild_after_push` is `false`.

        Ownership is not enforced.
      x-required-scopes: ["rebuilds:write"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRebuildRequest"
      responses:
        "202":
          description: The rebuild job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildJobEnqueued"
        "400":
          description: >-
            The workspace is not in `carry_patch` mode
            (`error_type: workspace_mode_mismatch`), is not active, the clone is
            not ready, no patch is `active` or `conflict`
            (`error_type: no_active_patches`), or `strategy` / `fail_mode` is
            invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          description: "A rebuild job is already queued or running (`error_type: concurrent_rebuild`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: 409
                  message: a rebuild job is already queued or running for this workspace
                  error_type: concurrent_rebuild
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rebuilds:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Rebuilds]
      operationId: listRebuilds
      summary: List rebuild jobs
      description: |
        Ordered by creation time, newest first. Workspace existence is not
        validated -- an unknown slug returns `200` with an empty `jobs` array.
        Ownership is not enforced.
      x-required-scopes: ["rebuilds:read"]
      responses:
        "200":
          description: The rebuild jobs for this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rebuilds/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Rebuilds]
      operationId: getRebuild
      summary: Get a rebuild job
      description: |
        For running jobs `patch_results` exposes intermediate progress as each
        patch completes, so clients can poll this endpoint instead of waiting
        for the whole rebuild.
      x-required-scopes: ["rebuilds:read"]
      responses:
        "200":
          description: The rebuild job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
    delete:
      tags: [Rebuilds]
      operationId: cancelRebuild
      summary: Cancel a queued rebuild job
      x-required-scopes: ["rebuilds:write"]
      responses:
        "200":
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelledAck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: The job is not in `queued` status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rebuilds/{id}/requeue:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Rebuilds]
      operationId: requeueRebuild
      summary: Requeue a dead-lettered rebuild job
      x-required-scopes: ["rebuilds:write"]
      responses:
        "200":
          description: The requeued rebuild job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: >-
            The job is not in `dead_letter` status, or an active rebuild job
            already exists for this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rebuilds/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Rebuilds]
      operationId: rollbackRebuild
      summary: Roll the integration branch back to a pre-rebuild state
      description: >-
        Resets the integration branch to the `previous_integration_head_sha`
        recorded in the rebuild result. Backs `afc rebuild rollback`.
        Ownership is not enforced.
      x-required-scopes: ["rebuilds:write"]
      responses:
        "200":
          description: The integration branch was reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: >-
            No previous integration head is available to roll back to (first
            rebuild, or the job carries no result), or another operation holds
            the workspace lock (`error_type: workspace_busy`). A rebuild holds
            it only during its fetch phase and final phase, not while it
            applies patches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to initialise the git runner, or failed to reset the branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/rebuild-preview:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Rebuilds]
      operationId: previewRebuild
      summary: Predict rebuild conflicts without mutating anything
      description: |
        Runs `git merge-tree --write-tree` for each patch in position order.
        No refs, branches, or patch statuses are modified.

        Patches with status `disabled` or `merged_upstream` are skipped. The
        preview is cumulative: each patch predicted to succeed contributes to
        the base used for the next one, and a predicted conflict does not stop
        the remaining patches from being tested against the last successful
        base.

        Ownership is not enforced.
      x-required-scopes: ["rebuilds:read"]
      responses:
        "200":
          description: Per-patch conflict predictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildPreviewResponse"
        "400":
          description: The workspace is not in `carry_patch` mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "500":
          description: >-
            Failed to resolve the upstream HEAD, list patches, or initialise the
            git runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/workspaces/{slug}/patch-status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Rebuilds]
      operationId: getPatchStatus
      summary: Carry-patch health dashboard
      description: |
        Aggregates workspace metadata, the most recent rebuild result,
        per-patch status, and summary counts including the total number of
        recorded rerere resolutions.

        Invariant: `summary.total_patches == len(patches)` and
        `summary.active + summary.merged_upstream + summary.conflict +
        summary.disabled == summary.total_patches`.

        If the rr-cache is unreadable, `summary.total_rerere_resolutions` is
        reported as `0` rather than failing the request. Soft-deleted patches
        are excluded.

        Requires the `workspaces:read` scope. Ownership is not enforced.
      x-required-scopes: ["workspaces:read"]
      responses:
        "200":
          description: The carry-patch status dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchStatusResponse"
        "400":
          description: The workspace is not in `carry_patch` mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Merges
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/merges:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Merges]
      operationId: submitMerge
      summary: Submit a merge job
      description: |
        Queues a rebase-then-fast-forward integration of `source_ref` into
        `target_branch`. Jobs are serialised per target through the durable
        job queue's group key, so at most one merge per target runs at a time.

        Ownership is not enforced.
      x-required-scopes: ["merges:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMergeRequest"
      responses:
        "202":
          description: The merge job was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeJob"
        "400":
          description: >-
            `target_branch` or `source_ref` is missing, the JSON is malformed,
            the workspace is not active, the clone is not ready, or the source
            or target branch does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          description: >-
            A merge job for this source and target is already queued or running
            (`error_type: duplicate_merge`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Merges]
      operationId: listMerges
      summary: List merge jobs
      description: |
        Workspace existence is not validated -- an unknown slug returns `200`
        with an empty array. Ownership is not enforced.
      x-required-scopes: ["merges:read"]
      responses:
        "200":
          description: The merge jobs scoped to this workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MergeJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/merges/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Merges]
      operationId: getMerge
      summary: Get a merge job
      x-required-scopes: ["merges:read"]
      responses:
        "200":
          description: The merge job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
    delete:
      tags: [Merges]
      operationId: cancelMerge
      summary: Cancel a queued merge job
      x-required-scopes: ["merges:write"]
      responses:
        "200":
          description: The job was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelledAck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: The job is already running, completed, failed, or cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/merges/{id}/requeue:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Merges]
      operationId: requeueMerge
      summary: Requeue a dead-lettered merge job
      x-required-scopes: ["merges:write"]
      responses:
        "200":
          description: The requeued merge job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "409":
          description: >-
            The job is not in `dead_letter` status, or an active merge job
            already exists for this source and target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/rebase:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Merges]
      operationId: batchRebase
      summary: Rebase several branches onto a target ref
      description: |
        Runs synchronously and processes the branches sequentially; a conflict
        on one branch does not stop the rest. Ownership is not enforced.
      x-required-scopes: ["merges:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRebaseRequest"
      responses:
        "200":
          description: Per-branch rebase results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchRebaseResponse"
        "400":
          description: >-
            `target_ref` is missing, `branches` is empty, the workspace is not
            active, or the clone is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
        "409":
          description: >-
            Another operation holds the workspace lock (`error_type:
            workspace_busy`). A rebuild holds it only during its fetch phase
            and final phase, not while it applies patches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Batch rebase is not configured on this server, or the operation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------------

  /api/v1/user/secrets:
    post:
      tags: [Secrets]
      operationId: createUserSecrets
      summary: Create user-scoped secrets
      description: |
        Secret values are stored base64-encoded and are **never** returned by
        the API -- responses carry key names and timestamps only.

        Validation: keys are alphanumeric plus underscore, must not start with
        a digit, and are at most 255 characters; values are at most 256 KB
        (262144 bytes); a scope holds at most 100 entries; key lookup is
        case-insensitive.
      x-required-scopes: ["secrets:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntriesRequest"
      responses:
        "201":
          $ref: "#/components/responses/SecretEntryList"
        "400":
          $ref: "#/components/responses/EntryValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/DuplicateKey"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Secrets]
      operationId: listUserSecrets
      summary: List user-scoped secrets
      description: Sorted by key, case-insensitively. Values are never returned.
      x-required-scopes: ["secrets:read", "secrets:write"]
      responses:
        "200":
          $ref: "#/components/responses/SecretEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/secrets/{key}:
    parameters:
      - $ref: "#/components/parameters/EntryKey"
    patch:
      tags: [Secrets]
      operationId: updateUserSecret
      summary: Update a user-scoped secret value
      x-required-scopes: ["secrets:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateValueRequest"
      responses:
        "200":
          $ref: "#/components/responses/SecretEntry"
        "400":
          $ref: "#/components/responses/MissingValueField"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/EntryNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Secrets]
      operationId: deleteUserSecret
      summary: Delete a user-scoped secret
      x-required-scopes: ["secrets:write"]
      responses:
        "204":
          description: The secret was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/EntryNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{slug}/secrets:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    post:
      tags: [Secrets]
      operationId: createOrgSecrets
      summary: Create organization-scoped secrets
      description: Requires organization membership; admin tokens bypass the check.
      x-required-scopes: ["secrets:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntriesRequest"
      responses:
        "201":
          $ref: "#/components/responses/SecretEntryList"
        "400":
          $ref: "#/components/responses/EntryValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/OrgNotFoundOrNotMember"
        "409":
          $ref: "#/components/responses/DuplicateKey"
        "500":
