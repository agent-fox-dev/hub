        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/ForgeNotFound"
        "422":
          $ref: "#/components/responses/ForgeUnprocessable"
        "429":
          $ref: "#/components/responses/ForgeRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/ForgeBadGateway"
        "504":
          $ref: "#/components/responses/ForgeGatewayTimeout"

