              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs:
    get:
      tags: [Administration]
      operationId: listOrgs
      summary: List all organizations
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Every organization on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      operationId: createOrg
      summary: Create an organization
      description: >-
        Each user additionally receives a personal organization automatically
        on creation, through the hub's `OnAfterUserCreate` hook.
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: The created organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The body is malformed, `name` or `slug` is missing, or the slug format is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "409":
          description: The organization name or slug already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}:
