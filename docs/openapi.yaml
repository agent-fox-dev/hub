    post:
      tags: [Forge]
      operationId: createForgeIssue
      summary: Create an issue on the workspace's forge
      description: |
        Creates an issue with the given fields and returns it as issuex encodes it. `title` is required and must not be blank; `body` may be empty; `labels` and `assignees` are at most 100 names each, none blank. Fields the route does not know are ignored. On GitLab the assignees are accepted and not sent: the client library sends none, because GitLab takes user ids.

        Records `hub.forge.issue.create`, with the metadata described in `docs/api.md`.

        The checks run in this order: no credential is `401`; a PAT without
        `forge:write` (`forge:read` is not enough) is `403`, also for a slug that
        does not exist; a workspace that does not exist or is not the caller's is
        `404`; a workspace that is not `active` is `400` (`workspace is not
        active`); then the request (`target`, the number in the path, the JSON
        body) is read and checked (`400`); then the client is built (`422`, `500`);
