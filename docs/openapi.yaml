        check. Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: ["orgs:read"]
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "304":
          description: The ETag matched; the record is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not a member of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Administration]
      operationId: updateOrg
      summary: Update an organization
      description: "`name` and `url` are the mutable fields; at least one must be supplied."
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The body is malformed, no fields were supplied, or `name` was set to empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "409":
          description: The organization name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Administration]
      operationId: deleteOrg
      summary: Delete an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The organization was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/block:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Administration]
      operationId: blockOrg
      summary: Block an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The blocked organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Administration]
      operationId: unblockOrg
      summary: Unblock an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The unblocked organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Administration]
      operationId: listOrgMembers
      summary: List organization members
      description: Admin credentials bypass the membership check.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The organization's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: user_id
        in: path
        required: true
        description: The user to add or remove.
        schema:
          type: string
          format: uuid
    put:
      tags: [Administration]
      operationId: addOrgMember
      summary: Add a member to an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
