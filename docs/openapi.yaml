  # ---------------------------------------------------------------------------
  # Forge (a workspace's repository on GitHub or GitLab)
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/forge:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Forge]
      operationId: getForgeDiagnostic
      summary: Show how the hub reaches the forge of a workspace
      description: |
        Reports the forge (`github`, `gitlab` or `unknown`), the API URL, the
        repository and the kind of the credential (`pat`, `basic` or `none`) the
        hub would use for the workspace's origin and, on a `carry_patch`
        workspace with an `upstream_url`, for its upstream, without sending any
        request to the forge. A host that cannot be classified is reported as
        `unknown` with a null `api_url` and is not an error. The response
        never contains a secret value. The route does not take `target`.

        The checks run in this order: no credential is `401`; a PAT with
        neither `forge:read` nor `forge:write` is `403`; a workspace that does
        not exist or is not the caller's is `404`; an invalid `forge_api_url`
        (or `upstream_forge_api_url` for the upstream block) is `422`.
      x-required-scopes: ["forge:read", "forge:write"]
      responses:
        "200":
          description: The forge, as the hub would reach it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeDiagnostic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrNotOwned"
        "422":
          description: >-
            `forge_api_url`, or `upstream_forge_api_url` for the upstream block,
            is not an absolute `https://` URL with a host and without userinfo,
            query or fragment (`error_type: forge_api_url_invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/forge/repository:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/ForgeTarget"
    get:
      tags: [Forge]
      operationId: getForgeRepository
      summary: Read the workspace's repository on its forge
      description: |
        Calls `GetRepository` and returns the repository as issuex encodes it.

        The checks run in this order: no credential is `401`; a PAT with neither
        `forge:read` nor `forge:write` is `403`, also for a slug that does not
        exist; a workspace that does not exist or is not the caller's is `404`;
        then `target` and the other parameters (`400`); then the client is built
        (`422`, `500`) and the forge is called. API keys and admin tokens are not
        scope-checked. The route works on archived workspaces and on workspaces
        that are not cloned, takes no workspace lock and emits no audit event.
        Failures of the forge are answered by the table in `docs/api.md`
        ("Failures of the forge"); the forge's message is scrubbed of the
        workspace's token and of URL userinfo and cut to 1024 bytes.
      x-required-scopes: ["forge:read", "forge:write"]
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeRepository"
