  # ---------------------------------------------------------------------------
  # Sandboxes
  # ---------------------------------------------------------------------------

  /api/v1/sandbox-profiles:
    get:
      tags: [Sandboxes]
      operationId: listSandboxProfiles
      summary: List the deployment's sandbox profiles
      description: |
        Returns the profiles from the `[sandbox]` section of the hub's
        `config.toml`, sorted by name. The list is built from the profiles the
        hub validated at start: it makes no provider call and reads no
        database, and every authorised caller gets the same list.

        Secret values and `env` values are never returned -- only the names of
        the secrets a profile injects and the keys of its fixed environment.
        The provider, its options and the deployment's limits are not shown.

        The checks run in this order: no credential is `401`; a hub without a
        `[sandbox]` section answers every authenticated caller `404` with
        `error_type: sandboxes_disabled`; a PAT with neither scope is `403`.
        API keys and admin tokens are not scope-checked.
      x-required-scopes: ["sandboxes:read", "sandboxes:write"]
      responses:
        "200":
          description: The sandbox profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxProfileListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: The hub has no `[sandbox]` section, so sandboxes are not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: 404
                  message: sandboxes are not enabled on this hub
                  error_type: sandboxes_disabled

  /api/v1/workspaces/{slug}/sandboxes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    post:
      tags: [Sandboxes]
      operationId: issueSandboxLease
      summary: Issue a sandbox lease
      description: |
        Issues a lease: a caller's right to one sandbox in the workspace. The
        profile (the named one, or the configured default) is copied onto the
        lease. Hub confirms that every secret the profile requires exists in
        the workspace's resolution chain (workspace, then the org when the
        workspace owner belongs to it, then the owner's user scope) by key
        name, never reading a value, and enforces `[sandbox].max_sandboxes`
        (a `leased` lease past its `lease_expires_at` no longer counts).
        `lease_expires_at` in the answer is the deadline for the holder's
        `Create`: the earlier of `created_at` plus `[sandbox].lease_timeout`
        and `expires_at`.

        The response is the only one that ever carries the lease `token`;
        hub keeps its SHA-256 only. No sandbox is created here: the holder
        creates it through the sandbox gateway at `gateway_url`, with the
        token. The gateway builds the sandbox from the lease and not from what
        the holder sends, reads the secrets when it creates the sandbox, makes
        the lease `active` and emits `hub.sandbox.create`.

        Checks run in order: 401, `sandboxes_disabled`, 403 for a PAT without
        `sandboxes:write`, 404 for a workspace that is missing or not owned
        (admin tokens pass), 400 when the workspace is not active, then the
        body.
      x-required-scopes: ["sandboxes:write"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxLeaseRequest"
      responses:
        "201":
          description: The lease and its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxLeaseIssued"
        "400":
          description: >-
            Malformed body, an unknown field, an unknown profile, a bad `ttl`,
            `purpose` or `labels`, or a workspace that is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: 'Sandboxes are not enabled (`error_type: sandboxes_disabled`), or the workspace does not exist or the caller may not see it.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: '`[sandbox].max_sandboxes` live leases exist already (`error_type: sandbox_capacity`).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "A secret the profile requires exists in no searched scope (`error_type: secret_missing`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Sandboxes]
      operationId: listSandboxLeases
      summary: List the workspace's sandbox leases
      description: |
        Newest `created_at` first, at most 200, as a bare array. Only live
        leases (`leased` or `active`) are returned unless `all` is
        true; a terminal lease (`destroyed`, `expired` or `failed`) is listed for
        24 hours after it ended. Works on an archived workspace. Never carries a
        token, its hash or an environment value.
      x-required-scopes: ["sandboxes:read", "sandboxes:write"]
      parameters:
        - $ref: "#/components/parameters/SandboxLeaseAll"
      responses:
        "200":
          description: The leases, `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxLease"
        "400":
          description: '`all` cannot be parsed as a boolean.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: 'Sandboxes are not enabled (`error_type: sandboxes_disabled`), or the workspace does not exist or the caller may not see it.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/sandboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/SandboxLeaseId"
    get:
      tags: [Sandboxes]
      operationId: getSandboxLease
      summary: Get one sandbox lease
      description: >-
        Returns the lease in any state. A terminal lease can be read for 24
        hours after it ended and is then removed (`sandbox lease not found`).
        Works on an archived workspace.
      x-required-scopes: ["sandboxes:read", "sandboxes:write"]
      responses:
        "200":
          description: The lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxLease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: >-
            Sandboxes are not enabled (`error_type: sandboxes_disabled`), the
            workspace does not exist or the caller may not see it, or the lease
            id is malformed, unknown or another workspace's (`sandbox lease not
            found`, without saying which).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Sandboxes]
      operationId: endSandboxLease
      summary: End a sandbox lease
      description: |
        Ends a live lease: `destroyed` with `end_reason` `api` (`shutdown`
        while the hub is shutting down), its token revoked in the same update, so that the next call to the gateway with it
        is refused.

        A `leased` lease has no sandbox and is moved without a call to the
        provider; a `create` still in flight finds the lease ended and destroys
        its new sandbox. An `active` lease has its sandbox destroyed first,
        within 30 seconds, and only then is the lease moved; a sandbox that is
        already gone counts as destroyed. After the hub has been restarted it no
        longer holds the sandbox of a lease that was `active` before, so the lease
        is ended without destroying that sandbox, which lives until the TTL the
        provider enforces (the next start ends a lease that was `active` at a
        crash anyway, with `end_reason` `restart`). When the provider fails the
        answer is
        502 `sandbox_provider_error` with the provider's message scrubbed of
        secret values, fixed environment values and URL user information, and
        nothing has changed (the lease is still `active`, its token still works,
        no event is emitted), so the same request can be sent again.

        Answers 204 whether or not it changed anything: a lease that has ended
        already keeps its `ended_at` and `end_reason`, calls no provider and
        emits nothing, so a retry is harmless. Works on an archived workspace.
        Each change into `destroyed` emits one `hub.sandbox.destroy` event with
        the id of the sandbox (`null` when there was none), `reason: "api"` (or
        `"shutdown"`) and the calling credential as the actor.
      x-required-scopes: ["sandboxes:write"]
      responses:
        "204":
          description: The lease is ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: As for the get operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          description: >-
            The provider could not destroy the sandbox of an `active` lease, or
            did not answer within 30 seconds (`error_type:
            sandbox_provider_error`). The lease is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: 502
                  message: "podman rm failed: run -e GIT_PAT=[redacted]"
                  error_type: sandbox_provider_error

  /api/v1/sandboxes:
    get:
      tags: [Sandboxes]
      operationId: listAllSandboxLeases
      summary: List the leases of every workspace
