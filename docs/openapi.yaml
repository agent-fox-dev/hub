  # ---------------------------------------------------------------------------
  # Agent sessions
  # ---------------------------------------------------------------------------

  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Open an agent session
      description: |
        Records which credential and workspace an agent run is using.
        Idempotent on a client-provided `id`: an existing session is returned
        with `200` instead of `201`.
      x-required-scopes: ["sessions:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: A session with this `id` already exists; the existing record is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: The session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is malformed, or `workspace_slug` is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks the `sessions:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List agent sessions
      description: |
        Keyset-paginated. Non-admin callers see only sessions in workspaces
        they own; admin tokens see every workspace.
      x-required-scopes: ["sessions:read"]
      parameters:
        - name: workspace_slug
          in: query
          schema: { type: string }
          description: Filter by workspace.
        - name: run_id
          in: query
          schema: { type: string }
          description: Filter by run identifier.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
          description: Filter by session status.
        - name: credential_type
          in: query
          schema:
            type: string
            enum: [admin_token, api_key, pat]
          description: Filter by the credential type that opened the session.
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Order"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions, each including its `token_summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          description: The cursor is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or workspace access was denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session
      x-required-scopes: ["sessions:read"]
      responses:
        "200":
          description: The session, including its `token_summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or cannot access the session's workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Close a session with a terminal status
      description: |
        The caller must own the session, or hold an admin token. Idempotent:
        completing an already-terminal session returns the existing record with
        `200`.

        `terminated` is reserved for server-initiated force-closes (workspace
        archive or delete) and is rejected as a client-supplied status.
      x-required-scopes: ["sessions:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionRequest"
      responses:
        "200":
          description: The closed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is malformed, or `status` is `terminated` or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is neither the session owner nor an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The session is not active (concurrent close).
          content:
            application/json:
              schema:
