  /api/v1/workspaces/{slug}/runs/{run_id}/transcript:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Audit Query]
      operationId: getRunTranscript
      summary: Reconstruct a conversation transcript
      description: |
        Rebuilds a conversation from the stored agent traces for one node of a
        run, mapping trace event types to roles: `session.init` becomes
        `system`, `assistant.message` becomes `assistant`, `tool.use` becomes
        `tool_use`, and `tool.error` becomes `tool_error`. Unrecognised trace
        types are skipped silently.
      x-required-scopes: ["audit:read"]
      parameters:
        - name: node_id
          in: query
          required: true
          description: The node within the run whose transcript should be rebuilt.
          schema:
            type: string
      responses:
        "200":
          description: The reconstructed transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
        "400":
          description: The `node_id` query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Audit query and streaming
  # ---------------------------------------------------------------------------

  /api/v1/audit:
    get:
      tags: [Audit Query]
      operationId: queryUnifiedAudit
      summary: Unified audit event query
      description: |
        Merges `hub_audit_events` and `agent_audit_events` into one
        chronological result set with `UNION ALL`, newest first.

        Several filters are source-specific: `actor_id`, `actor_type`,
        `resource_type`, and `action` match hub events only (and therefore
        exclude agent events), while `run_id` matches agent events only.
      x-required-scopes: ["audit:read"]
      parameters:
        - name: source
          in: query
          description: Restrict to one event source.
          schema:
            type: string
            enum: [hub, agent]
        - name: workspace
          in: query
          description: Filter by workspace slug.
          schema: { type: string }
        - $ref: "#/components/parameters/FilterEventType"
        - name: event_type_prefix
          in: query
          description: >-
            Filter by event-type prefix, for example `hub.workspace` to match
            every workspace event.
          schema: { type: string }
        - $ref: "#/components/parameters/FilterSeverity"
        - name: actor_id
          in: query
          description: Filter by actor. Hub events only.
          schema: { type: string }
        - name: actor_type
          in: query
          description: Filter by actor credential type. Hub events only.
          schema: { type: string }
        - name: resource_type
          in: query
          description: Filter by affected resource type. Hub events only.
          schema: { type: string }
        - name: action
          in: query
          description: Filter by action. Hub events only.
          schema: { type: string }
        - name: run_id
          in: query
          description: Filter by agent run identifier. Agent events only.
          schema: { type: string }
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: limit
          in: query
          description: Maximum events to return; clamped to 1000.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of unified audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedAuditQueryResponse"
        "400":
          description: "The cursor is invalid, `since` or `until` is malformed, or `since >= until`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/events:
    get:
      tags: [Audit Query]
      operationId: streamAuditEvents
      summary: Stream audit events over SSE
      description: |
        Opens a `text/event-stream` connection that delivers audit events as
        they are emitted.

        Frames:

        ```
        event: heartbeat
        data: {"timestamp":"2026-09-01T12:00:00Z"}

        event: audit_event
        data: {"id":"...","event_type":"hub.workspace.create","timestamp":"...","workspace":"..."}
        ```

        An initial heartbeat confirms the connection, and further heartbeats
        follow every 30 seconds. A connection with no reads for 60 seconds is
        closed. Each client buffers up to 256 events; when the buffer is full
        the oldest event is dropped to make room.

        The concurrent connection ceiling comes from `AF_SSE_MAX_CONNECTIONS`
        (default 100); beyond it new connections receive `503`.
      x-required-scopes: ["audit:read"]
      parameters:
        - name: workspace
          in: query
          description: Only deliver events for this workspace slug.
          schema: { type: string }
        - name: run_id
          in: query
          description: Only deliver events for this agent run.
          schema: { type: string }
        - name: category
          in: query
          description: Only deliver events in this category.
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "503":
          description: The maximum number of concurrent SSE connections is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Git smart HTTP
  # ---------------------------------------------------------------------------

  /git/{org}/{slug}.git/info/refs:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    get:
      tags: [Git]
      operationId: gitInfoRefs
      summary: Git ref advertisement (smart HTTP discovery)
      description: |
        The `.git` suffix is mandatory; a request without it is answered with
        `404`.

        Authentication is HTTP Basic: the username is ignored and the password
        must be a valid hub credential. API keys and admin tokens have implicit
        git access; PATs need `git:read` (for `git-upload-pack`) or `git:write`
        (for `git-receive-pack`).

        Ownership is enforced -- a caller who does not own the workspace gets a
        pkt-line `404`, so slugs cannot be enumerated. Admin-role API keys do
        **not** bypass this; only admin tokens do.
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:read", "git:write"]
      parameters:
        - name: service
          in: query
          required: true
          description: The git service being negotiated.
          schema:
            type: string
            enum: [git-upload-pack, git-receive-pack]
      responses:
        "200":
          description: >-
            A pkt-line ref advertisement, with content type
            `application/x-<service>-advertisement`.
          content:
            application/x-git-upload-pack-advertisement:
              schema:
                type: string
                format: binary
            application/x-git-receive-pack-advertisement:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: >-
            The `service` parameter is missing or invalid, or the PAT lacks the
            required git scope. The body is a pkt-line error.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, the caller does not own the workspace, or the path lacks
            the `.git` suffix.

  /git/{org}/{slug}.git/git-upload-pack:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    post:
      tags: [Git]
      operationId: gitUploadPack
      summary: Git fetch and clone data transfer
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:read"]
      requestBody:
        required: true
        content:
          application/x-git-upload-pack-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The pkt-line upload-pack result.
          content:
            application/x-git-upload-pack-result:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: The PAT lacks the `git:read` scope.
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, or the caller does not own the workspace.

  /git/{org}/{slug}.git/git-receive-pack:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    post:
      tags: [Git]
      operationId: gitReceivePack
      summary: Git push data transfer
      description: |
        After a successful push the server updates `head_sha` in the database
        and resets the working tree to the new HEAD, then emits a
        `hub.git.push` audit event.

        If a pushed branch is a registered patch of a carry-patch workspace and
        `AUTO_REBUILD_AFTER_PUSH` is not `"false"`, a rebuild job is enqueued.
        The hook runs asynchronously and never alters the push response.
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:write"]
      requestBody:
        required: true
        content:
          application/x-git-receive-pack-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The pkt-line receive-pack result.
          content:
            application/x-git-receive-pack-result:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: The PAT lacks the `git:write` scope.
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, or the caller does not own the workspace.

  # ---------------------------------------------------------------------------
  # Identity and access (apikit)
  #
  # Mounted by apikit's Server.MountHandlers on the API group, so every one of
  # these routes lives under the configured mount point -- `/api/v1` by
  # default. Both docs/api.md and docs/permissions.md write them without that
  # prefix; see docs/errata/openapi_description.md.
  # ---------------------------------------------------------------------------

  /version:
    get:
      tags: [Health]
      operationId: getVersion
      summary: Server build information
      description: >-
        Registered at the server root alongside the health probes, outside the
        API auth group. Cached publicly.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Build metadata and the configured API mount point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/auth/providers:
    get:
      tags: [Identity]
      operationId: listOAuthProviders
      summary: List the configured OAuth providers
      description: |
        Returns each provider configured under `[[oauth.providers]]` with the
        authorize URL to send the user to. Cached publicly for five minutes.

        Public: `RegisterOAuthHandlers` runs before `api.Use(authMiddleware)`
        in `MountHandlers`, and Echo snapshots a group's middleware when a
        route is added, so both `/auth` routes are registered without the auth
        middleware.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProvider"

  /api/v1/auth/callback:
    post:
      tags: [Identity]
      operationId: oauthCallback
      summary: Exchange an OAuth authorization code for an API key
      description: |
        The only way an API key is created. In a single transaction the hub
        upserts the user record, revokes **all** of that user's existing API
        keys, and generates a new `af_<key_id>_<secret>`. The plaintext key is
        returned once; only its SHA-256 hash is persisted.

        Public, like `GET /api/v1/auth/providers` -- it has to be reachable
        before the caller holds a credential.

        Because re-login mass-revokes keys, any automation still holding an
        older key for the same user stops working after a login.

        `redirect_uri` is validated against the provider's allowlist. `expires`
        is a key lifetime in days and must be 0, 30, 60, or 90; it defaults to
        90.

        On a new user the hub's `OnAfterUserCreate` hook runs inside the same
        transaction and creates the user's personal organization.
      security: []
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: The user record and the newly issued API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The matched user is blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The user already exists under a conflicting identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      x-provider: apikit
      x-required-scopes: ["users:read"]
      responses:
        "200":
          $ref: "#/components/responses/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      description: "`full_name` is the only mutable field, and it is required."
      x-provider: apikit
      x-required-scopes: ["users:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserProfile"
        "400":
          description: The body is malformed, or `full_name` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/orgs:
    get:
      tags: [Identity]
      operationId: listCurrentUserOrgs
      summary: List the authenticated user's organization memberships
      x-provider: apikit
      x-required-scopes: ["orgs:read"]
      responses:
        "200":
          description: The organizations the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys:
    get:
      tags: [Identity]
      operationId: listCurrentUserKeys
      summary: List the authenticated user's API keys
      description: >-
        Metadata only. Secret hashes, expiry-day settings, and plaintext
        secrets are never exposed. Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: ["keys:read"]
      responses:
        "200":
          description: The caller's API key metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyMeta"
        "304":
          description: The ETag matched; the listing is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserKey
      summary: Revoke one of the authenticated user's API keys
      description: >-
        Self-revocation is allowed: the auth middleware validates the
        credential before the handler runs and does not re-validate mid-flight,
        so a key can revoke itself.
      x-provider: apikit
      x-required-scopes: ["keys:manage"]
      responses:
        "204":
          description: The key was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The key does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys/{key_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      tags: [Identity]
      operationId: refreshCurrentUserKey
      summary: Rotate an API key secret
      description: >-
        Generates a new secret while preserving `key_id`, and recomputes the
        expiry from the key's stored lifetime. **PAT authentication is
        rejected** -- this endpoint requires API key auth.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The rotated key. The plaintext value is returned only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyFull"
        "400":
          description: The key is revoked or already expired and cannot be refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            No credential was supplied, or the request authenticated with
            something other than an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The key does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens:
    get:
      tags: [Identity]
      operationId: listCurrentUserTokens
      summary: List the authenticated user's personal access tokens
      x-provider: apikit
      x-required-scopes: ["tokens:read"]
      responses:
        "200":
          description: PAT metadata, including the permissions granted to each token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Identity]
      operationId: createCurrentUserToken
      summary: Create a personal access token
      description: |
        Every requested permission is validated against the registry: a
        malformed scope or one that is not registered is rejected with `400`.

        A PAT creating another PAT may only grant permissions it already holds;
        attempting to exceed them fails with `403`. API keys are not subject to
        that restriction and may mint a PAT with any registered permission.
      x-provider: apikit
      x-required-scopes: ["tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The new token. The plaintext value is returned only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessTokenWithSecret"
        "400":
          description: >-
            The body is malformed; `name` is missing or over 255 characters;
            `permissions` is empty; a permission is malformed or unknown; or
            `expires` is not 0, 30, 60, or 90.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller lacks `tokens:manage`, or a PAT tried to grant a
            permission it does not itself hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    get:
      tags: [Identity]
      operationId: getCurrentUserToken
      summary: Get one of the authenticated user's PATs
      x-provider: apikit
      x-required-scopes: ["tokens:read"]
      responses:
        "200":
          description: The PAT metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserToken
      summary: Revoke one of the authenticated user's PATs
      x-provider: apikit
      x-required-scopes: ["tokens:manage"]
      responses:
        "200":
          description: The revoked token's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          description: The token is already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:manage` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens/{token_id}/permissions:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    put:
      tags: [Identity]
      operationId: replaceTokenPermissions
      summary: Replace a PAT's permissions
      description: >-
        An explicit empty array clears every permission and auto-revokes the
        token. An absent or null `permissions` field is rejected.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: The body is malformed, `permissions` is absent, or the token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Identity]
      operationId: addTokenPermissions
      summary: Add permissions to a PAT
      description: An empty `permissions` array is an error here, unlike on `PUT`.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: >-
            The body is malformed, `permissions` is absent or empty, or the
            token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Identity]
      operationId: removeTokenPermissions
      summary: Remove permissions from a PAT
      description: An empty `permissions` array is an error here, unlike on `PUT`.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: >-
            The body is malformed, `permissions` is absent or empty, or the
            token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Administration (apikit)
  #
  # Admin tokens and admin-role API keys only. Note the asymmetry: an
  # admin-role API key passes RequireAdmin here, but is treated as an ordinary
  # user by the workspace and git subsystems, which check for the admin token
  # credential type directly.
  # ---------------------------------------------------------------------------

  /api/v1/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: List all users
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Every user on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      operationId: createUser
      summary: Create a user
      description: >-
        The INSERT and the after-user-create hook run in one transaction, so
        the hub's personal-organization creation is atomic with the user
        record.
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The body is malformed or a required field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "409":
          description: The username or the provider identity already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Administration]
      operationId: getUser
      summary: Get any user
      description: Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "304":
          description: The ETag matched; the record is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Administration]
      operationId: updateUser
      summary: Update any user
