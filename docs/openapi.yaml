          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Administration]
      operationId: removeOrgMember
      summary: Remove a member from an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The user is no longer a member.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: The organization or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`, where the credential is an admin
        token (`af_admin_<64-hex>`), an API key (`af_<key_id>_<secret>`), or a
        personal access token (`af_pat_<token_id>_<secret>`).
    gitBasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication for the git smart HTTP endpoints. The
        username is ignored; the password must be a valid hub credential.
        `afc credential-helper get` returns the stored API key with the
        username `x-token-auth`.

  parameters:

    WorkspaceSlug:
      name: slug
      in: path
      required: true
      description: The workspace slug.
      schema:
        $ref: "#/components/schemas/Slug"

    OrgSlug:
      name: slug
      in: path
      required: true
      description: The organization slug.
      schema:
        type: string

    OrgId:
      name: id
      in: path
      required: true
      description: The organization identifier.
      schema:
        type: string

    UserId:
      name: id
      in: path
      required: true
      description: The user identifier.
      schema:
        type: string
        format: uuid

    KeyId:
      name: key_id
      in: path
      required: true
      description: The API key identifier (the `key_id` segment of the key).
      schema:
        type: string

    TokenId:
      name: token_id
      in: path
      required: true
      description: The personal access token identifier.
      schema:
        type: string

    PatchId:
      name: id
      in: path
      required: true
      description: The patch identifier.
      schema:
        type: string
        format: uuid

    JobId:
      name: id
      in: path
      required: true
      description: The job identifier.
      schema:
        type: string
        format: uuid

    SessionId:
      name: id
      in: path
      required: true
      description: The agent session identifier.
      schema:
        type: string

    EntryKey:
      name: key
      in: path
      required: true
      description: The secret or variable key. Lookup is case-insensitive.
      schema:
        $ref: "#/components/schemas/EntryKeyName"

    RunId:
      name: run_id
      in: path
      required: true
      description: The agent run identifier.
      schema:
        $ref: "#/components/schemas/RunId"

    GitOrg:
      name: org
      in: path
      required: true
      description: The organization slug that owns the workspace.
      schema:
        type: string

    GitSlug:
      name: slug
      in: path
      required: true
      description: >-
        The workspace slug. The literal `.git` suffix that follows it in the
        path is required and is not part of this value.
      schema:
        $ref: "#/components/schemas/Slug"

    Since:
      name: since
      in: query
      description: Inclusive lower bound on the record timestamp.
      schema:
        type: string
        format: date-time

    Until:
      name: until
      in: query
      description: Exclusive upper bound on the record timestamp.
      schema:
        type: string
        format: date-time

    Order:
      name: order
      in: query
      description: Sort order.
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    Cursor:
      name: cursor
      in: query
      description: Opaque base64url keyset pagination token from a previous response.
      schema:
        type: string

    AuditLimit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500

    FilterEventType:
      name: event_type
      in: query
      description: Filter by exact event type.
      schema:
        type: string

    FilterSeverity:
      name: severity
      in: query
      description: Filter by severity.
      schema:
        $ref: "#/components/schemas/Severity"

    FilterNodeId:
      name: node_id
      in: query
      description: Filter by task-graph node identifier.
      schema:
        type: string

    FilterSessionId:
      name: session_id
      in: query
      description: Filter by session identifier.
      schema:
        type: string

    FilterToolName:
      name: tool_name
      in: query
      description: Filter by tool name.
      schema:
        type: string

    FilterStatus:
      name: status
      in: query
      description: Filter by status.
      schema:
        type: string

  responses:

    Unauthorized:
      description: No credential was supplied, or the credential is invalid, revoked, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: 401
              message: authentication required

    MissingScope:
      description: The PAT lacks a permission scope required by this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InsufficientScope:
      description: >-
        The PAT lacks a permission scope required by this endpoint
        (`insufficient permission scope`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AdminRequired:
      description: The credential is not an admin token or an admin-role API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    BadRequest:
      description: The request body is missing or malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: An unexpected server-side failure, typically a database error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFound:
      description: No workspace with this slug exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFoundOrForbidden:
      description: >-
        The workspace does not exist, is not owned by the caller, or the PAT
        lacks the required scope. All three collapse to `404` under the
        anti-enumeration policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFoundOrNotOwned:
      description: The workspace does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    OrgNotFound:
      description: No organization with this identifier exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    OrgNotFoundOrNotMember:
      description: The organization does not exist, or the caller is not a member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UserNotFound:
      description: No user with this identifier exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PatchNotFound:
      description: No patch with this identifier exists for the given workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    JobNotFound:
      description: The job does not exist, or it belongs to a different workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EntryNotFound:
      description: No entry with this key exists in the scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DuplicateKey:
      description: An entry with this key already exists in the scope (case-insensitive).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MissingValueField:
      description: The request body does not contain a `value` field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EntryValidationError:
      description: >-
        `entries` is empty, a key has an invalid format or is too long, a value
        exceeds 256 KB, or the 100-entry per-scope limit would be exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidQueryParams:
      description: The cursor is invalid, or `since` or `until` is not a valid RFC 3339 timestamp.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AuditWriteForbidden:
      description: >-
        A workspace-scoped PAT does not match the URL slug
        (`error_type: workspace_mismatch`), or the caller has no write access to
        the workspace (`error_type: workspace_access_denied`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceArchived:
      description: "The workspace is archived and rejects ingestion (`error_type: workspace_archived`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SecretEntry:
      description: A secret entry. The value is never included.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecretEntry"

    SecretEntryList:
      description: Secret entries. Values are never included.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SecretEntry"

    VariableEntry:
      description: A variable entry, including its decoded value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VariableEntry"

    VariableEntryList:
      description: Variable entries, including their decoded values.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VariableEntry"

    UserProfile:
      description: The user profile.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    TokenPermissions:
      description: The token's metadata, including its permissions after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PersonalAccessToken"

    TokenNotFound:
      description: The token does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TokenPermissionForbidden:
      description: >-
        The caller lacks `tokens:write` or `tokens:manage`, or a PAT tried to
        grant a permission it does not itself hold.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    # -- Shared primitives -----------------------------------------------------

    Error:
      type: object
      description: The apikit error envelope used by every error response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: The HTTP status code, repeated in the body.
            message:
              type: string
              description: A human-readable description of the failure.
            error_type:
              type: string
              description: >-
                Machine-readable classification. Present only on the handlers
                that set it.
              enum:
                - duplicate_merge
                - workspace_mode_mismatch
                - no_active_patches
                - concurrent_rebuild
                - workspace_mismatch
                - workspace_access_denied
                - workspace_archived
                - unknown_schema_version
                - postmortem_not_found
      examples:
        - error:
            code: 400
            message: slug is required
        - error:
            code: 409
            message: a rebuild job is already queued or running for this workspace
            error_type: concurrent_rebuild

    Slug:
      type: string
      description: |
        A URL-safe identifier: 3-64 characters, starting with a lowercase
        letter, ending with a lowercase letter or digit, containing only
        lowercase letters, digits, and hyphens, with no consecutive hyphens.
      minLength: 3
      maxLength: 64
      pattern: "^[a-z](?:[a-z0-9]|-(?!-))*[a-z0-9]$"
      examples: [my-project]

    EntryKeyName:
      type: string
      description: >-
        A secret or variable key: alphanumeric characters and underscores only,
        not starting with a digit, at most 255 characters. Lookup is
        case-insensitive.
      maxLength: 255
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      examples: [MY_SECRET]

    RunId:
      type: string
      description: An agent run identifier, formatted `YYYYMMDD_HHMMSS_<6 hex chars>`.
      pattern: "^[0-9]{8}_[0-9]{6}_[0-9a-f]{6}$"
      examples: ["20260704_143022_a1b2c3"]

    Sha:
      type: string
      description: A 40-character lowercase hex git object SHA.
      pattern: "^[0-9a-f]{40}$"

    Severity:
      type: string
      enum: [info, warning, error, critical]

    JobStatus:
      type: string
      description: Durable job queue lifecycle state.
      enum: [queued, running, completed, failed, dead_letter, cancelled]

    SessionStatus:
      type: string
      description: >-
        Agent session state. `terminated` is set only by the server when a
        workspace is archived or deleted; clients cannot set it.
      enum: [active, completed, failed, timeout, terminated]

    PatchStatus:
      type: string
      enum: [active, merged_upstream, conflict, disabled, deleted]

    # -- Workspaces ------------------------------------------------------------

    Workspace:
      type: object
      description: |
        A unit of work with its own clone, branch, and agents. Every field is
        always present in the response; nullable fields are emitted as `null`
        rather than omitted.
      required:
        - slug
        - git_url
        - hub_url
        - branch
        - owner_id
        - org_id
        - status
        - display_name
        - description
        - clone_status
        - head_sha
        - clone_error
        - created_at
        - updated_at
        - sync_mode
        - sync_status
        - upstream_head_sha
        - last_sync_at
        - sync_error
        - workspace_mode
        - upstream_url
        - integration_branch
      properties:
        slug:
          allOf:
            - $ref: "#/components/schemas/Slug"
          description: Immutable, globally unique identifier.
        git_url:
          type: string
          description: HTTPS or SSH URL of the git repository. Immutable after creation.
        hub_url:
          type: [string, "null"]
          description: >-
            Clone URL on the built-in git server. Null when `server.external_url`
            is unconfigured or the workspace has no organization.
          examples: ["http://localhost:8080/git/org-slug/my-project.git"]
        branch:
          type: [string, "null"]
          description: Git ref associated with the workspace. Immutable after creation.
        owner_id:
          type: string
          format: uuid
          description: The user who owns the workspace.
        org_id:
          type: [string, "null"]
          format: uuid
          description: The organization the workspace belongs to.
        status:
          type: string
          enum: [active, archived]
        display_name:
          type: string
          description: >-
            Human-readable label. Defaults to the slug when unset; never null or
            empty.
          maxLength: 128
        description:
          type: string
          description: Free-form text. Defaults to an empty string; never null.
          maxLength: 1024
        clone_status:
          type: string
          enum: [pending, cloning, ready, failed, archived]
        head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: >-
            HEAD commit of the local clone. Set when `clone_status` is `ready`
            or `archived`.
        clone_error:
          type: [string, "null"]
          description: Failure detail when `clone_status` is `failed`.
        sync_mode:
          type: string
          enum: [pull_only, disabled]
          default: pull_only
        sync_status:
          type: string
          enum: [idle, syncing, error]
          default: idle
        upstream_head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Upstream HEAD at the last fetch. Null until the first sync.
        last_sync_at:
          type: [string, "null"]
          format: date-time
          description: Timestamp of the last successful sync.
        sync_error:
          type: [string, "null"]
          description: Failure detail from the most recent failed sync.
        workspace_mode:
          type: string
          enum: [standard, carry_patch]
          default: standard
          description: >-
            `standard` is single-remote; `carry_patch` is dual-remote with a
            patch list. Immutable after creation.
        upstream_url:
          type: [string, "null"]
          description: >-
            Upstream repository for carry-patch workspaces. Null for standard
            workspaces; immutable after creation.
        integration_branch:
          type: [string, "null"]
          description: >-
            The mechanically rebuilt branch combining the upstream base with all
            carried patches. Defaults to `deploy` for carry-patch workspaces and
            is null for standard ones; immutable after creation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWorkspaceRequest:
      type: object
      required: [slug, git_url]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        git_url:
          type: string
          description: A valid HTTPS or SSH git URL.
        branch:
          type: [string, "null"]
        org_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Must reference an organization the owner belongs to. When omitted or
            empty, the caller's personal organization is assigned.
        display_name:
          type: [string, "null"]
          maxLength: 128
          description: Defaults to the slug when omitted or empty.
        description:
          type: [string, "null"]
          maxLength: 1024
          description: Defaults to an empty string.
        sync_mode:
          type: [string, "null"]
          enum: [pull_only, disabled, null]
          default: pull_only
        workspace_mode:
          type: [string, "null"]
          enum: [standard, carry_patch, null]
          default: standard
        upstream_url:
          type: [string, "null"]
          description: >-
            Required when `workspace_mode` is `carry_patch`; rejected for
            standard workspaces.
        integration_branch:
          type: [string, "null"]
          description: >-
            Defaults to `deploy` for carry-patch workspaces; rejected for
            standard workspaces.
        git_pat:
          type: string
          format: password
          description: >-
            Personal access token for a private repository. Mutually exclusive
            with `git_username`/`git_password` and requires an HTTPS `git_url`.
        git_username:
          type: string
          description: >-
            HTTP basic auth username. Must be paired with `git_password`,
            mutually exclusive with `git_pat`, and requires an HTTPS `git_url`.
        git_password:
          type: string
          format: password
          description: HTTP basic auth password. Must be paired with `git_username`.

    UpdateWorkspaceRequest:
      type: object
      description: >-
        Partial update. Only the properties present in the body are modified;
        at least one must be supplied. Sending an immutable field is rejected.
      minProperties: 1
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 128
          description: "`null` resets the display name to the workspace slug."
        description:
          type: [string, "null"]
          maxLength: 1024
          description: "`null` clears the description to an empty string."
        org_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Must reference an organization the owner belongs to. `null` removes
            the association.
        sync_mode:
          type: string
          enum: [pull_only, disabled]
          description: "`null` is rejected with `400`."
      additionalProperties: false

    CarryPatchSyncResponse:
      type: object
      description: |
        Returned by `POST /api/v1/workspaces/{slug}/sync` when the workspace is
        in `carry_patch` mode: the full workspace object plus the four
        carry-patch fields as additional top-level keys (16-REQ-5.1).
      allOf:
        - $ref: "#/components/schemas/Workspace"
      required: [patches_merged, rebuild_triggered, force_push_detected]
      properties:
        patches_merged:
          type: array
          description: >-
            Branch names of patches detected as merged upstream, via ancestry
            check, content-based `git cherry` detection, or PR-number scanning.
          items:
            type: string
        rebuild_triggered:
          type: boolean
          description: Whether this sync enqueued a rebuild job.
        rebuild_job_id:
          type: string
          format: uuid
          description: >-
            The enqueued rebuild job. Omitted entirely when no rebuild was
            enqueued -- it is never sent as null.
        force_push_detected:
          type: boolean
          description: >-
            Whether the new upstream HEAD is not a descendant of the previously
            stored one, indicating a history rewrite. Informational only -- the
            sync still proceeds.

    # -- Patches ---------------------------------------------------------------

    Patch:
      type: object
      description: A patch branch carried on top of the upstream base.
      required:
        - id
        - workspace_slug
        - branch_name
        - position
        - status
        - upstream_pr_url
        - description
        - deleted_at
        - added_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_slug:
          type: string
        branch_name:
          type: string
          description: The git branch backing this patch. Immutable after creation.
        position:
          type: integer
          minimum: 1
          description: 1-based application order; lower positions are applied first.
        status:
          $ref: "#/components/schemas/PatchStatus"
        conflict_files:
          type: array
          description: >-
            Conflicting file paths. Omitted entirely when the patch has no
            recorded conflicts.
          items:
            type: string
        upstream_pr_url:
          type: [string, "null"]
        description:
          type: [string, "null"]
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Soft-deletion timestamp; null for live patches.
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddPatchRequest:
      type: object
      required: [branch_name]
      properties:
        branch_name:
          type: string
          description: >-
            Must be non-empty, must differ from the workspace
            `integration_branch`, and must not already be registered.
        position:
          type: integer
          minimum: 1
          description: >-
            1-based insertion position. Values above `max(position) + 1` are
            clamped to an append. Omitted means append.
        upstream_pr_url:
          type: string
        description:
          type: string
        skip_branch_check:
          type: boolean
          default: false
          description: Skip the check that the branch exists in the repository.
        if_not_exists:
          type: boolean
          default: false
          description: >-
            When the branch is already registered, return `200` with the
            existing record instead of `409`.

    UpdatePatchRequest:
      type: object
      description: >-
        Partial update. `branch_name` is immutable and is silently ignored if
        present.
      properties:
        position:
          type: integer
          minimum: 1
          description: Must not exceed the workspace's total patch count.
        status:
          $ref: "#/components/schemas/PatchStatus"
        description:
          type: string
        upstream_pr_url:
          type: string

    ReorderPatchesRequest:
      type: object
      required: [patch_ids]
      properties:
        patch_ids:
          type: array
          description: >-
            Exactly the workspace's patch IDs in the desired order -- no
            missing, extra, or duplicated entries.
          items:
            type: string
            format: uuid

    # -- Rerere ----------------------------------------------------------------

    RerereListResponse:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/RerereResolution"

    RerereResolution:
      type: object
      required: [id, path, recorded_at, resolved]
      properties:
        id:
          type: string
          description: rr-cache entry name (git's conflict hash); use it with DELETE.
        path:
          type: [string, "null"]
          description: >-
            File path of the conflict. Only known while the conflict is in
            progress (MERGE_RR), otherwise null.
        recorded_at:
          type: [string, "null"]
          format: date-time
          description: Derived from the modification time of the rr-cache entry.
        resolved:
          type: boolean
          description: True when a postimage (replayable resolution) is recorded.

    # -- Rebuilds --------------------------------------------------------------

    SubmitRebuildRequest:
      type: object
      description: >-
        Both fields are optional; each overrides the corresponding workspace
        variable for this run only.
      properties:
        strategy:
          type: string
          enum: [rebase, merge]
          description: >-
            `rebase` cherry-picks each unique commit; `merge` uses
            `git merge --no-ff`. Overrides `REBUILD_STRATEGY`.
        fail_mode:
          type: string
          enum: [fail_fast, continue]
          description: >-
            `fail_fast` aborts on the first unresolved conflict; `continue`
            marks the patch as `conflict`, resets to the pre-patch state, and
            proceeds. Overrides `REBUILD_FAIL_MODE`.

    RebuildJobEnqueued:
      type: object
      description: The durable job queue record returned when a rebuild is accepted.
      required: [id, type, key, group_key, status, payload]
      properties:
        id:
          type: string
          format: uuid
        type:
          const: rebuild
        key:
          type: string
          description: The deduplication key -- the workspace slug.
        group_key:
          type: string
          description: >-
            The serialization key, `<workspace-slug>:<integration-branch>`. At
            most one job per group runs at a time.
        status:
          $ref: "#/components/schemas/JobStatus"
        payload:
          $ref: "#/components/schemas/RebuildPayload"

    RebuildPayload:
      type: object
      properties:
        workspace_slug:
          type: string
        strategy:
          type: string
          enum: [rebase, merge]
        submitted_by:
          type: string
        integration_branch:
          type: string
        fail_mode:
          type: string
          enum: [fail_fast, continue]

    RebuildListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RebuildJob"

    RebuildJob:
      type: object
      description: |
        A rebuild of the integration branch. Fields carrying `omitempty` in the
        Go struct (`strategy`, `error`, `patch_results`,
        `integration_head_sha`, `previous_integration_head_sha`) are omitted
        when empty rather than serialised as null.
      required: [id, status, created_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        strategy:
          type: string
          enum: [rebase, merge]
        error:
          type: string
          description: Failure detail for failed jobs.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
          description: Null while the job is in a non-terminal state.
        patch_results:
          type: array
          description: >-
            Per-patch outcomes. Present for completed jobs, and for running jobs
            as intermediate progress that clients can poll.
          items:
            $ref: "#/components/schemas/RebuildPatchResult"
        integration_head_sha:
          type: string
          description: Integration branch HEAD after the rebuild.
        previous_integration_head_sha:
          type: string
          description: >-
            Integration branch HEAD before the rebuild. Empty on the first-ever
            rebuild.

    RebuildPatchResult:
      type: object
      required: [patch_id, branch_name, position, status, new_head_sha]
      properties:
        patch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [success, conflict, skipped]
        skipped_reason:
          type: string
          enum: [merged_upstream, disabled, deleted, branch_not_found]
          description: Present only when `status` is `skipped`.
        new_head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Null on conflict or skip.
        conflict_files:
          type: array
          description: Present only when `status` is `conflict`.
          items:
            type: string

    RollbackResponse:
      type: object
      required: [rolled_back_to]
      properties:
        rolled_back_to:
          $ref: "#/components/schemas/Sha"

    RebuildPreviewResponse:
      type: object
      required: [patch_results]
      properties:
        patch_results:
          type: array
          items:
            $ref: "#/components/schemas/RebuildPreviewPatchResult"

    RebuildPreviewPatchResult:
      type: object
      required: [patch_id, branch_name, position, status, conflict_files]
      properties:
        patch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [would_succeed, would_conflict]
        tree_sha:
          type: string
          description: The resulting tree SHA. Omitted when the patch would conflict.
        conflict_files:
          type: array
          description: Empty when the patch would succeed.
          items:
            type: string

    PatchStatusResponse:
      type: object
      description: |
        Health dashboard for a carry-patch stack.

        Invariants: `summary.total_patches == len(patches)` and
        `summary.active + summary.merged_upstream + summary.conflict +
        summary.disabled == summary.total_patches`.
      required:
        - workspace_slug
        - workspace_mode
        - status
        - clone_status
        - sync_status
        - sync_mode
        - head_sha
        - git_url
        - upstream_url
        - upstream_head_sha
        - integration_branch
        - integration_head_sha
        - last_sync_at
        - last_rebuild
        - patches
        - summary
      properties:
        workspace_slug:
          type: string
        workspace_mode:
          const: carry_patch
        status:
          type: string
        clone_status:
          type: string
        clone_error:
          type: string
          description: Omitted when empty.
        sync_status:
          type: string
        sync_error:
          type: string
          description: Omitted when empty.
        sync_mode:
          type: string
        head_sha:
          type: string
          description: Empty when the workspace has not been cloned yet.
        git_url:
          type: string
        upstream_url:
          type: string
        upstream_head_sha:
          type: string
        integration_branch:
          type: string
        integration_head_sha:
          type: string
          description: >-
            Derived from the latest rebuild result; empty when no rebuild has
            been attempted.
        last_sync_at:
          type: [string, "null"]
          format: date-time
        last_rebuild:
          oneOf:
            - $ref: "#/components/schemas/PatchStatusRebuild"
            - type: "null"
          description: Null when no rebuild has been attempted.
        patches:
          type: array
          description: All non-deleted patches, ordered by position.
          items:
            $ref: "#/components/schemas/PatchStatusEntry"
        summary:
          $ref: "#/components/schemas/PatchStatusSummary"

    PatchStatusRebuild:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"

    PatchStatusEntry:
      type: object
      required: [id, branch_name, position, status, last_rebuild_result]
      properties:
        id:
          type: string
        branch_name:
          type: string
        position:
          type: integer
        status:
          $ref: "#/components/schemas/PatchStatus"
        last_rebuild_result:
          type: [string, "null"]
          enum: [success, conflict, skipped, null]
          description: Null when no rebuild has been attempted.
        conflict_files:
          type: array
          description: Present only when `last_rebuild_result` is `conflict`.
          items:
            type: string

    PatchStatusSummary:
      type: object
      required:
        - total_patches
        - active
        - merged_upstream
        - conflict
        - disabled
        - total_rerere_resolutions
      properties:
        total_patches:
          type: integer
        active:
          type: integer
        merged_upstream:
          type: integer
        conflict:
          type: integer
        disabled:
          type: integer
        total_rerere_resolutions:
          type: integer
          description: Reported as 0 when the rr-cache is inaccessible.

    # -- Merges ----------------------------------------------------------------

    SubmitMergeRequest:
      type: object
      required: [target_branch, source_ref]
      properties:
        target_branch:
          type: string
          description: The branch being merged into.
        source_ref:
          type: string
          description: The branch being merged from.

    MergeJob:
      type: object
      required:
        - id
        - workspace_slug
        - target_branch
        - source_ref
        - status
        - base_sha
        - merged_sha
        - conflict_files
        - check_output
        - error
        - retry_count
        - submitted_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_slug:
          type: string
        target_branch:
          type: string
        source_ref:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        base_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Target HEAD before the merge; null until the job completes.
        merged_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Target HEAD after the merge; null until the job completes.
        conflict_files:
          type: array
          items:
            type: string
        check_output:
          type: [string, "null"]
          description: Output of the `CHECK_COMMAND` if one ran.
        error:
          type: [string, "null"]
        retry_count:
          type: integer
        submitted_by:
          type: string
          description: The authenticated identity that submitted the job.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BatchRebaseRequest:
      type: object
      required: [target_ref, branches]
      properties:
        target_ref:
          type: string
        branches:
          type: array
          minItems: 1
          items:
            type: string

    BatchRebaseResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RebaseResult"

    RebaseResult:
      type: object
      required: [branch, status]
      properties:
        branch:
          type: string
        status:
          type: string
          enum: [ok, conflict, error]
        new_head:
          allOf:
            - $ref: "#/components/schemas/Sha"
          description: Omitted on conflict or error.
        conflict_files:
          type: array
          description: Omitted on success.
          items:
            type: string

    CancelledAck:
      type: object
      properties:
        status:
          const: cancelled

    # -- Secrets and variables -------------------------------------------------

    CreateEntriesRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EntryInput"

    EntryInput:
      type: object
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/EntryKeyName"
        value:
          type: string
          description: At most 256 KB (262144 bytes) once encoded.

    UpdateValueRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    SecretEntry:
      type: object
      description: A secret. The value is never returned by the API.
      required: [key, created_at, updated_at]
      properties:
        key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    VariableEntry:
      type: object
      required: [key, value, created_at, updated_at]
      properties:
        key:
          type: string
        value:
          type: string
          description: Stored base64-encoded internally and returned decoded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResolvedVariableEntry:
      type: object
      required: [key, value, origin, created_at, updated_at]
      properties:
        key:
          type: string
        value:
          type: string
        origin:
          type: string
          enum: [user, org, workspace]
          description: Which tier supplied the winning value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceVariables:
      type: object
      description: |
        Reference for the workspace variable keys the hub interprets. This
        schema is documentation only -- it is not a request or response body.
        Set these through `POST /api/v1/workspaces/{slug}/vars`.
      properties:
        REBUILD_STRATEGY:
          type: string
          enum: [rebase, merge]
          default: rebase
          description: >-
            Strategy used to apply patches during a rebuild. Overridable
            per-rebuild via the `strategy` request field.
        REBUILD_FAIL_MODE:
          type: string
          enum: [fail_fast, continue]
          default: fail_fast
          description: >-
            Whether a rebuild aborts on the first conflict or skips the
            conflicting patch and continues. Overridable per-rebuild via the
            `fail_mode` request field.
        AUTO_REBUILD_AFTER_SYNC:
          type: string
          enum: ["true", "false"]
          default: "true"
          description: >-
            When not `"false"`, a carry-patch sync that observes upstream
            advancement enqueues a rebuild.
        AUTO_REBUILD_AFTER_PUSH:
          type: string
          enum: ["true", "false"]
          default: "true"
          description: >-
            When not `"false"`, a push to a registered patch branch enqueues a
            rebuild.
        SQUASH_MERGE_DETECTION:
          type: string
          enum: [ancestry_only, content_based, both]
          default: both
          description: >-
            Which strategies detect upstream merges during a carry-patch sync.
            `ancestry_only` uses `git merge-base --is-ancestor`;
            `content_based` uses `git cherry` plus PR-number scanning; `both`
            uses all of them and treats either signal as sufficient.
        CHECK_COMMAND:
          type: string
          description: >-
            Shell command run through `sh -c` after a merge rebase. A non-zero
            exit rolls the rebase back.

    # -- Sessions --------------------------------------------------------------

    CreateSessionRequest:
      type: object
      required: [workspace_slug]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted. Makes the call idempotent.
        workspace_slug:
          type: string
        run_id:
          type: string
          description: Groups sessions belonging to the same run.
        node_id:
          type: string
          description: Task-graph node identifier.
        archetype:
          type: string
          description: Agent archetype label.
        model:
          type: string
        metadata:
          description: Arbitrary JSON metadata.

    CompleteSessionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, failed, timeout]
          description: "`terminated` is server-only and is rejected here."
        error_message:
          type: string
        duration_ms:
          type: [integer, "null"]
          format: int64
        cache_creation_input_tokens:
          type: integer
          format: int64

    ReportUsageRequest:
      type: object
      required: [model]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted.
        model:
          type: string
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        cache_read_tokens:
          type: integer
          format: int64
          minimum: 0

    Session:
      type: object
      required: [id, workspace_slug, status, credential_id, credential_type, started_at]
      properties:
        id:
          type: string
        workspace_slug:
          type: string
        run_id:
          type: string
        node_id:
          type: string
        archetype:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        credential_id:
          type: string
          description: Identifier of the credential that opened the session.
        credential_type:
          type: string
          enum: [admin_token, api_key, pat]
        error_message:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]
          format: int64
        cache_creation_input_tokens:
          type: integer
          format: int64
        metadata: {}
        token_summary:
          $ref: "#/components/schemas/TokenSummary"

    TokenSummary:
      type: object
      required: [total_input_tokens, total_output_tokens, total_cache_read_tokens, models_used]
      properties:
        total_input_tokens:
          type: integer
          format: int64
        total_output_tokens:
          type: integer
          format: int64
        total_cache_read_tokens:
          type: integer
          format: int64
        models_used:
          type: array
          items:
            type: string

    TokenUsage:
      type: object
      required:
        - id
        - session_id
        - workspace_slug
        - model
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - reported_at
      properties:
        id:
          type: string
        session_id:
          type: string
        workspace_slug:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        reported_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required: [sessions, next_cursor, has_more]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    UsageListResponse:
      type: object
      required: [session_id, records, totals, next_cursor, has_more]
      properties:
        session_id:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/TokenUsage"
        totals:
          allOf:
            - $ref: "#/components/schemas/TokenSummary"
          description: Aggregates every record for the session, not just this page.
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    CostResponse:
      type: object
      required: [workspace, period, totals, breakdown]
      properties:
        workspace:
          type: string
        period:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
        totals:
          type: object
          required: [input_tokens, output_tokens, cache_read_tokens, sessions]
          properties:
            input_tokens:
              type: integer
              format: int64
            output_tokens:
              type: integer
              format: int64
            cache_read_tokens:
              type: integer
              format: int64
            sessions:
              type: integer
              format: int64
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/CostBreakdownEntry"

    CostBreakdownEntry:
      type: object
      description: >-
        Exactly one of `date`, `session_id`, or `model` is populated, matching
        the requested `group_by`.
      required: [input_tokens, output_tokens, cache_read_tokens, sessions]
      properties:
        date:
          type: string
          description: Present when `group_by=day`.
        session_id:
          type: string
          description: Present when `group_by=session`.
        model:
          type: string
          description: Present when `group_by=model`.
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64

    # -- Audit ingestion -------------------------------------------------------

    PostEventRequest:
      type: object
      required: [event_type]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted. Makes ingestion idempotent.
        run_id:
          type: string
          description: >-
            When present it must match the `run_id` in the URL, otherwise the
            request is rejected with `400`.
        event_type:
          type: string
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: Defaults to a per-event-type value chosen by the server.
        node_id:
          type: string
        session_id:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Defaults to the current UTC time.
        payload:
          type: object
          additionalProperties: true

    PostEventResponse:
      type: object
      required: [id, run_id, event_type, severity, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type: { type: string }
        severity: { type: string }
        created_at: { type: string, format: date-time }

    PostSessionOutcomeRequest:
      type: object
      required: [session_id, status]
      properties:
        id: { type: string }
        run_id: { type: string }
        session_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        token_usage:
          type: object
          additionalProperties: true

    PostSessionOutcomeResponse:
      type: object
      required: [id, run_id, node_id, status, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    PostToolCallRequest:
      type: object
      required: [tool_name]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true

    PostToolCallResponse:
      type: object
      required: [id, run_id, tool_name, called_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        called_at: { type: string, format: date-time }

    PostToolErrorRequest:
      type: object
      required: [tool_name, error_msg]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        error_code: { type: string }
        error_msg: { type: string }
        timestamp: { type: string, format: date-time }

    PostToolErrorResponse:
      type: object
      required: [id, run_id, tool_name, failed_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        failed_at: { type: string, format: date-time }

    PostTraceRequest:
      type: object
      required: [event_type]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type:
          type: string
          enum: [session.init, assistant.message, tool.use, tool.error, session.result]
        node_id: { type: string }
        session_id: { type: string }
        sequence: { type: integer }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true

    PostTraceResponse:
      type: object
      required: [id, run_id, event_type, timestamp]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type: { type: string }
        timestamp: { type: string, format: date-time }

    PostPostmortemRequest:
      type: object
      required: [run_status, started_at, completed_at, task_summary, cost_summary]
      properties:
        schema_version:
          type: integer
          const: 1
          description: Rejected with `422` when present and not 1.
        run_status:
          type: string
          enum: [stalled, block_limit, cost_limit, session_limit]
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        task_summary:
          type: object
          description: Must contain a `total` field.
          required: [total]
          additionalProperties: true
          properties:
            total: { type: integer }
        cost_summary:
          type: object
          description: Aggregated token and cost totals.
          additionalProperties: true
        blocked_tasks:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string }
              reason: { type: string }
            additionalProperties: true
        session_history:
          type: array
          description: Opaque JSON array, stored as-is.
          items: {}

    PostPostmortemResponse:
      type: object
      required: [run_id, run_status, created_at]
      properties:
        run_id: { type: string }
        run_status: { type: string }
        created_at: { type: string, format: date-time }

    Postmortem:
      type: object
      required:
        - run_id
        - workspace
        - schema_version
        - run_status
        - started_at
        - completed_at
        - task_summary
        - cost_summary
        - blocked_tasks
        - session_history
        - ingested_at
      properties:
        run_id: { type: string }
        workspace: { type: string }
        schema_version: { type: integer }
        run_status: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        task_summary: {}
        cost_summary: {}
        blocked_tasks: {}
        session_history: {}
        ingested_at: { type: string, format: date-time }

    BatchIngestResponse:
      type: object
      required: [accepted, duplicates, errors]
      properties:
        accepted:
          type: integer
          description: Rows written.
        duplicates:
          type: integer
          description: Rows skipped because the identifier already existed.
        errors:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: Zero-based position of the failing item in the request array.
              id: { type: string }
              message: { type: string }

    # -- Audit query -----------------------------------------------------------

    AgentAuditEvent:
      type: object
      description: An agent-submitted audit event as returned by the per-run query.
      required: [id, run_id, workspace, event_type, severity, node_id, session_id, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        event_type: { type: string }
        severity: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        payload:
          description: >-
            The stored payload, decoded from JSON. Falls back to the raw string
            when it cannot be parsed.
        ingested_at: { type: string, format: date-time }

    AgentSessionOutcome:
      type: object
      required: [id, run_id, workspace, session_id, node_id, status, timestamp, duration_ms, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        session_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer }
        token_usage: {}
        ingested_at: { type: string, format: date-time }

    AgentToolCall:
      type: object
      required: [id, run_id, workspace, tool_name, node_id, session_id, timestamp, duration_ms, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer }
        input: {}
        output: {}
        ingested_at: { type: string, format: date-time }

    AgentToolError:
      type: object
      required: [id, run_id, workspace, tool_name, node_id, session_id, error_code, error_msg, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        error_code: { type: string }
        error_msg: { type: string }
        timestamp: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }

    AgentTrace:
      type: object
      required: [id, run_id, workspace, event_type, node_id, session_id, sequence, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        event_type: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        sequence: { type: integer }
        timestamp: { type: string, format: date-time }
        data: {}
        ingested_at: { type: string, format: date-time }

    CursorPage:
      type: object
      description: Fields shared by every cursor-paginated audit response.
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque token for the next page, or null when this is the last one.
        has_more:
          type: boolean

    RunEventListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/AgentAuditEvent"

    RunOutcomeListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [outcomes]
          properties:
            outcomes:
              type: array
              items:
                $ref: "#/components/schemas/AgentSessionOutcome"

    RunToolCallListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [calls]
          properties:
            calls:
              type: array
              items:
                $ref: "#/components/schemas/AgentToolCall"

    RunToolErrorListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/AgentToolError"

    RunTraceListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [traces]
          properties:
            traces:
              type: array
              items:
                $ref: "#/components/schemas/AgentTrace"

    UnifiedAuditQueryResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              description: Merged hub and agent events, newest first.
              items:
                $ref: "#/components/schemas/UnifiedAuditEvent"

    UnifiedAuditEvent:
      type: object
      description: >-
        A hub or agent audit event. The hub-only fields (`actor_id`,
        `actor_type`, `resource_type`, `resource_id`, `action`) are null on
        agent events, and the agent-only fields (`run_id`, `node_id`,
        `session_id`, `archetype`) are null on hub events.
      required:
        - id
        - event_type
        - source
        - timestamp
        - severity
        - workspace
        - actor_id
        - actor_type
        - resource_type
        - resource_id
        - action
        - run_id
        - node_id
        - session_id
        - archetype
      properties:
        id:
          type: string
        event_type:
          type: string
          description: Dot-notation type, for example `hub.workspace.create`.
        source:
          type: string
          enum: [hub, agent]
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
        workspace:
          type: string
        actor_id:
          type: [string, "null"]
        actor_type:
          type: [string, "null"]
        resource_type:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        action:
          type: [string, "null"]
        run_id:
          type: [string, "null"]
        node_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        archetype:
          type: [string, "null"]

    TranscriptResponse:
      type: object
      required: [run_id, node_id, messages]
      properties:
        run_id:
          type: string
        node_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptMessage"

    TranscriptMessage:
      type: object
      required: [role, content, tool_name, timestamp]
      properties:
        role:
          type: string
          enum: [system, assistant, tool_use, tool_error]
        content:
          type: string
        tool_name:
          type: [string, "null"]
        timestamp:
          type: string
          format: date-time

    # -- Identity (apikit) -----------------------------------------------------

    User:
      type: object
      description: A user account.
      required:
        - id
        - username
        - email
        - full_name
        - role
        - status
        - provider
        - provider_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
          description: >-
            An `admin` role grants access to the administration endpoints when
            the credential is an API key. It confers no cross-tenant workspace
            or git access -- those check for an admin token directly.
        status:
          type: string
          description: >-
            `blocked` disables every API key the user owns at authentication
            time, without revoking them.
        provider:
          type: string
          description: The OAuth provider that authenticated this identity.
          examples: [github]
        provider_id:
          type: string
          description: The user's identifier at the OAuth provider.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, email, provider, provider_id]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        provider:
          type: string
        provider_id:
          type: string

    UpdateUserRequest:
      type: object
      description: >-
        `full_name` is the only mutable profile field. It is required: a
        missing or null value is rejected with `400`.
      required: [full_name]
      properties:
        full_name:
          type: string

    Organization:
      type: object
      required: [id, name, slug, url, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        url:
          type: string
        owner_id:
          type: [string, "null"]
          format: uuid
          description: Omitted when the organization has no owner.
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrgMember:
      type: object
      required: [org_id, user_id, username, email, role, created_at]
      properties:
        org_id:
          type: string
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Validated against the server's slug format.
        url:
          type: string
        owner_id:
          type: string
          format: uuid

    UpdateOrgRequest:
      type: object
      description: At least one field must be supplied.
      minProperties: 1
      properties:
        name:
          type: string
          description: Rejected when set to an empty string.
        url:
          type: string

    ApiKeyMeta:
      type: object
      description: >-
        API key metadata. The secret hash, the configured lifetime in days, and
        the plaintext secret are never exposed.
      required: [key_id, created_at, expires_at, revoked_at]
      properties:
        key_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null for a non-expiring key.
        revoked_at:
          type: [string, "null"]
          format: date-time

    ApiKeyMetaWithOwner:
      allOf:
        - $ref: "#/components/schemas/ApiKeyMeta"
        - type: object
          required: [user_id]
          properties:
            user_id:
              type: string
              format: uuid

    ApiKeyFull:
      type: object
      description: >-
        An API key including its plaintext value. Returned only by the OAuth
        callback and the refresh endpoint; the server persists only the
        SHA-256 hash.
      required: [key, key_id, expires_at]
      properties:
        key:
          type: string
          format: password
          description: The full `af_<key_id>_<secret>` value.
        key_id:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time

    PersonalAccessToken:
      type: object
      description: PAT metadata, never including the plaintext secret.
      required: [token_id, name, permissions, expires_at, created_at, revoked_at]
      properties:
        token_id:
          type: string
        name:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    PersonalAccessTokenWithOwner:
      allOf:
        - $ref: "#/components/schemas/PersonalAccessToken"
        - type: object
          required: [user_id]
          properties:
            user_id:
              type: string
              format: uuid

    PersonalAccessTokenWithSecret:
      type: object
      description: A newly created PAT, including its one-time plaintext value.
      required: [token_id, name, token, permissions, expires_at, created_at]
      properties:
        token_id:
          type: string
        name:
          type: string
        token:
          type: string
          format: password
          description: >-
            The full `af_pat_<token_id>_<secret>` value. Returned once at
            creation and never again.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
        permissions:
          type: array
          minItems: 1
          description: >-
            Every entry must be a registered scope. A PAT creating another PAT
            may only grant permissions it already holds.
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires:
          type: integer
          enum: [0, 30, 60, 90]
          description: Token lifetime in days. `0` means no expiry.

    PermissionsRequest:
      type: object
      description: >-
        On `PUT`, an explicit empty array clears every permission and
        auto-revokes the token. On `PATCH` and `DELETE` an empty array is an
        error. An absent or null `permissions` field is always an error.
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"

    OAuthProvider:
      type: object
      required: [name, authorize_url]
      properties:
        name:
          type: string
          examples: [github]
        authorize_url:
          type: string
          description: The URL to send the user to in order to begin the OAuth flow.

    OAuthCallbackRequest:
      type: object
      required: [provider, code]
      properties:
        provider:
          type: string
          description: The provider name, as listed by `GET /api/v1/auth/providers`.
          examples: [github]
        code:
          type: string
          description: The authorization code returned by the OAuth provider.
        redirect_uri:
          type: string
          description: Validated against the provider's redirect allowlist.
        expires:
          type: [integer, "null"]
          enum: [0, 30, 60, 90, null]
          default: 90
          description: Requested API key lifetime in days. `0` means no expiry.

    OAuthCallbackResponse:
      type: object
      required: [user, api_key]
      properties:
        user:
          type: object
          required: [id, username, email, full_name, status, role, provider, provider_id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            email: { type: string, format: email }
            full_name: { type: [string, "null"] }
            status: { type: string }
            role: { type: string }
            provider: { type: string }
            provider_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        api_key:
          $ref: "#/components/schemas/ApiKeyFull"

    VersionResponse:
      type: object
      required: [go_version, build_time, commit, mount_point]
      properties:
        go_version:
          type: string
          description: The server version stamped at build time.
        build_time:
          type: string
        commit:
          type: string
        mount_point:
          type: string
          description: The prefix the API group is mounted at.
          default: /api/v1

    PermissionScope:
      type: string
      description: |
        A `resource:action` permission scope. Both halves match `^[a-z0-9_]+$`.
        The registry holds 33 scopes: 8 built into apikit and 25 registered by
        hub modules at startup. PAT creation rejects unknown scopes with `400`.

        Implications: `workspaces:create` and `workspaces:write` imply
        `workspaces:read` for workspace list and get only -- the rerere and
        patch-status handlers test for the literal `workspaces:read` string.
        `patches:write` implies `patches:read`; `git:write` implies `git:read`;
        `secrets:manage` implies `secrets:list`, `secrets:write`, and
        `secrets:delete`; `vars:manage` implies `vars:read`, `vars:write`, and
        `vars:delete`; and `vars:write` implies `vars:read`.
        `workspaces:delete` and `workspaces:sync` imply nothing.
      pattern: "^[a-z0-9_]+:[a-z0-9_]+$"
      enum:
        - audit:read
        - audit:write
        - git:read
        - git:write
        - keys:manage
        - keys:read
        - merges:read
        - merges:write
        - orgs:read
        - orgs:write
        - patches:read
        - patches:write
        - rebuilds:read
        - rebuilds:write
        - secrets:delete
        - secrets:list
        - secrets:manage
        - secrets:write
        - sessions:read
        - sessions:write
        - tokens:manage
        - tokens:read
        - tokens:write
        - users:read
        - vars:delete
        - vars:manage
        - vars:read
        - vars:write
        - workspaces:create
        - workspaces:delete
        - workspaces:read
        - workspaces:sync
        - workspaces:write
