  # ---------------------------------------------------------------------------
  # Agent sessions
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/forge/webhook:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    put:
      tags: [Forge]
      operationId: setForgeWebhook
      summary: Set the webhook secret of the workspace's forge
      description: |
        Stores the workspace secret `FORGE_WEBHOOK_SECRET`, the key the forge signs its
        deliveries with, and answers with the URL to enter in the forge's webhook
        settings. With no body, `{}` or `{"secret": null}` the hub generates a secret
        (32 bytes from `crypto/rand`, 64 lowercase hex characters) and returns it in
        this answer and no other. A supplied secret is 16 to 255 characters from `!`
        to `~`. The hub does not register the webhook on the forge. The route does not
        take `target`.

        The checks run in this order: no credential is `401`; a PAT without
        `forge:write` is `403`; a workspace that does not exist or is not the caller's
        is `404`; a workspace that is not `active` is `400` (`workspace is not
        active`); then the body (`400`, with a message that names `secret` and the rule
        and never the value). A scope that holds 100 secrets already is `400` with the
        store's message; any other failure of the store is `500`, and neither emits an
        event. Emits `hub.forge.webhook.set` with `{"generated": bool}`.
      x-required-scopes: ["forge:write"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgeWebhookSetRequest"
      responses:
        "200":
          description: The secret is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeWebhookState"
        "400":
          description: >-
            The workspace is not active, the body is not a JSON object or `secret`
            breaks a rule, or the workspace's secrets scope is full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrNotOwned"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Forge]
      operationId: unsetForgeWebhook
      summary: Remove the webhook secret of the workspace's forge
      description: |
        Deletes `FORGE_WEBHOOK_SECRET` when there is one, so that the hub answers the
        forge's deliveries with `404` from then on, and answers `204` either way. It
        works on an archived workspace too. The rows of the delivery log stay until they
        are pruned. Emits `hub.forge.webhook.unset` with `{"existed": bool}`. The checks
        are those of the `PUT` without the status of the workspace.
      x-required-scopes: ["forge:write"]
      responses:
        "204":
          description: The secret is gone (it was there or not).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrNotOwned"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/forge/deliveries:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Forge]
      operationId: listForgeDeliveries
      summary: List the deliveries the hub received from the workspace's forge
      description: |
        The workspace's delivery log, newest first (rows of one second last recorded
        first), whatever the status of the workspace. The log keeps the reduced facts
        of each verified delivery and never the payload; rows are pruned after 7 days.
        The checks are those of `GET .../forge`. A bad `since` or `limit` is `400` with
        a message that names it.
      x-required-scopes: ["forge:read", "forge:write"]
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            An RFC 3339 timestamp; only deliveries received at that time or later.
            Offsets are normalised to UTC, and a fraction of a second starts at the next second.
          schema:
            type: string
            format: date-time
          example: "2026-10-21T00:00:00Z"
        - name: limit
          in: query
          required: false
          description: The number of rows, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: The deliveries, `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForgeDelivery"
        "400":
          $ref: "#/components/responses/ForgeBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/WorkspaceNotFoundOrNotOwned"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Open an agent session
      description: |
        Records which credential and workspace an agent run is using.
        Idempotent on a client-provided `id`: an existing session is returned
        with `200` instead of `201`. Opening a session needs write access to
        `workspace_slug` (its owner or an admin token, whatever its status);
        a replayed `id` of another workspace's session is returned only when
        the caller may read that workspace (owner, org member, admin token).
      x-required-scopes: ["sessions:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: A session with this `id` already exists; the existing record is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: The session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is malformed, or `workspace_slug` is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller lacks the `sessions:write` scope, or is a member of the
            workspace's organization (`org members have read-only access to
            this workspace`, `error_type: forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            The workspace does not exist, the caller may not see it, or a
            replayed `id` belongs to a workspace the caller may not read
            (`workspace not found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List agent sessions
      description: |
        Keyset-paginated. Non-admin callers see only sessions of active
        workspaces they own or whose organization they belong to (an empty
        list when there are none); a `workspace_slug` outside them is `403
        workspace access denied`. Admin tokens see every workspace.
      x-required-scopes: ["sessions:read"]
      parameters:
        - name: workspace_slug
          in: query
          schema: { type: string }
          description: Filter by workspace.
        - name: run_id
          in: query
          schema: { type: string }
          description: Filter by run identifier.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
          description: Filter by session status.
        - name: credential_type
          in: query
          schema:
            type: string
            enum: [admin_token, api_key, pat]
          description: Filter by the credential type that opened the session.
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Order"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions, each including its `token_summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          description: The cursor is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or `workspace_slug` names a workspace that is not active or that the caller may not read (`workspace access denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session
      x-required-scopes: ["sessions:read"]
      responses:
        "200":
          description: The session, including its `token_summary`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or, for a caller that is not an admin token, the session's workspace is not active or the caller is not its owner or a member of its organization (`workspace access denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Close a session with a terminal status
      description: |
        The caller must own the session, or hold an admin token. Idempotent:
        completing an already-terminal session returns the existing record with
        `200`.

        `terminated` is reserved for server-initiated force-closes (workspace
        archive or delete) and is rejected as a client-supplied status.
      x-required-scopes: ["sessions:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionRequest"
      responses:
        "200":
          description: The closed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The body is malformed, or `status` is `terminated` or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is neither the session owner nor an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The session is not active (concurrent close).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/sessions/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Sessions]
      operationId: reportSessionUsage
      summary: Report incremental token usage
      description: The caller must own the session, or hold an admin token.
      x-required-scopes: ["sessions:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUsageRequest"
      responses:
        "201":
          description: The recorded token-usage entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsage"
        "400":
          description: The body is malformed, or `model` is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is neither the session owner nor an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The session is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A token count is negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Sessions]
      operationId: listSessionUsage
      summary: List token-usage records for a session
      description: |
        `totals` always aggregates every record for the session, independent of
        the page being returned.
      x-required-scopes: ["sessions:read"]
      parameters:
        - $ref: "#/components/parameters/Order"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of token-usage records plus unbounded totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageListResponse"
        "400":
          description: The cursor is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or, for a caller that is not an admin token, the session's workspace is not active or the caller is not its owner or a member of its organization (`workspace access denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/cost:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      tags: [Sessions]
      operationId: getWorkspaceCost
      summary: Aggregate token usage for a workspace
      x-required-scopes: ["sessions:read"]
      parameters:
        - name: group_by
          in: query
          description: Breakdown dimension.
          schema:
            type: string
            enum: [day, session, model]
            default: day
        - name: since
          in: query
          description: Start of the window. Defaults to 24 hours ago.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End of the window. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Aggregated cost data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostResponse"
        "400":
          description: "`since` is not before `until`, or `group_by` is invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller lacks `sessions:read`, or, for a caller that is not an admin token, the workspace is not active or the caller is not its owner or a member of its organization (`workspace access denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Audit ingestion (per run)
  # ---------------------------------------------------------------------------

  /api/v1/workspaces/{slug}/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Audit Ingestion]
      operationId: ingestAuditEvent
      summary: Ingest one audit event
      description: |
        Ingestion is idempotent: rows are written with `INSERT OR IGNORE`, so a
        duplicate `id` yields `200` instead of `201`.

        Write access is checked per request: an unknown workspace, and for a
        workspace-bound PAT any workspace but its own, is `404 workspace not
        found`; an archived workspace is rejected (`409 workspace_archived`);
        a PAT or API key must own the workspace (`403 workspace_access_denied`).
        A refused request stores nothing. Admin tokens bypass all of these.
      x-required-scopes: ["audit:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEventRequest"
      responses:
        "200":
          description: A row with this `id` already existed; nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEventResponse"
        "201":
          description: The event was ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEventResponse"
        "400":
          description: >-
            `event_type` is missing, `run_id` is malformed, or the body `run_id`
            disagrees with the URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuditWriteForbidden"
        "409":
          $ref: "#/components/responses/WorkspaceArchived"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Audit Ingestion]
      operationId: queryRunAuditEvents
      summary: Query audit events for a run
      description: >-
        Cursor-paginated. The workspace's owner, a member of its organization
        and admin tokens read it, whatever the workspace's status.
      x-required-scopes: ["audit:read"]
      parameters:
        - $ref: "#/components/parameters/FilterEventType"
        - $ref: "#/components/parameters/FilterSeverity"
        - $ref: "#/components/parameters/FilterNodeId"
        - $ref: "#/components/parameters/FilterSessionId"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventListResponse"
        "400":
          $ref: "#/components/responses/InvalidQueryParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/AuditWorkspaceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/runs/{run_id}/events/batch:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Audit Ingestion]
      operationId: ingestAuditEventsBatch
      summary: Bulk-ingest up to 1000 audit events
      description: |
        The body is a JSON array of the same objects accepted by the single
        event endpoint. Per-item failures are reported in the `errors` array
        rather than failing the whole request.
      x-required-scopes: ["audit:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                $ref: "#/components/schemas/PostEventRequest"
      responses:
        "200":
          description: Per-item ingestion outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchIngestResponse"
        "400":
          description: The array is empty or the body is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AuditWriteForbidden"
        "409":
          $ref: "#/components/responses/WorkspaceArchived"
        "413":
          description: More than 1000 items were submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workspaces/{slug}/runs/{run_id}/sessions/outcomes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
