        "400":
          $ref: "#/components/responses/InvalidQueryParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          $ref: "#/components/responses/AuditWorkspaceNotFound"
        "500":
