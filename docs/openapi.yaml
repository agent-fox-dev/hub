        `totals` always aggregates every record for the session, independent of
        the page being returned.
      x-required-scopes: ["sessions:read"]
      parameters:
        - $ref: "#/components/parameters/Order"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - $ref: "#/components/parameters/Cursor"
