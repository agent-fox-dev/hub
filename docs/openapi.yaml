  # ---------------------------------------------------------------------------
  # Audit query and streaming
  # ---------------------------------------------------------------------------

  /api/v1/audit:
    get:
      tags: [Audit Query]
      operationId: queryUnifiedAudit
      summary: Unified audit event query
      description: |
        Merges `hub_audit_events` and `agent_audit_events` into one
        chronological result set with `UNION ALL`, newest first.

        Several filters are source-specific: `actor_id`, `actor_type`,
        `resource_type`, and `action` match hub events only (and therefore
        exclude agent events), while `run_id` matches agent events only.

        Non-admin callers receive only the events of workspaces they own or
        whose organization they belong to, whatever the workspace's status;
        events without a workspace are returned to admin tokens only.
      x-required-scopes: ["audit:read"]
      parameters:
        - name: source
          in: query
          description: Restrict to one event source.
          schema:
            type: string
            enum: [hub, agent]
        - name: workspace
          in: query
          description: Filter by workspace slug.
          schema: { type: string }
        - $ref: "#/components/parameters/FilterEventType"
        - name: event_type_prefix
          in: query
          description: >-
            Filter by event-type prefix, for example `hub.workspace` to match
            every workspace event.
          schema: { type: string }
        - $ref: "#/components/parameters/FilterSeverity"
        - name: actor_id
          in: query
          description: Filter by actor. Hub events only.
          schema: { type: string }
        - name: actor_type
          in: query
          description: Filter by actor credential type. Hub events only.
          schema: { type: string }
        - name: resource_type
          in: query
          description: Filter by affected resource type. Hub events only.
          schema: { type: string }
        - name: action
          in: query
          description: Filter by action. Hub events only.
          schema: { type: string }
        - name: run_id
          in: query
          description: Filter by agent run identifier. Agent events only.
          schema: { type: string }
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: limit
          in: query
          description: Maximum events to return; clamped to 1000.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of unified audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedAuditQueryResponse"
        "400":
          description: "The cursor is invalid, `since` or `until` is malformed, or `since >= until`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: "`workspace` names a workspace the caller may not read (`workspace not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/events:
    get:
      tags: [Audit Query]
      operationId: streamAuditEvents
      summary: Stream audit events over SSE
      description: |
        Opens a `text/event-stream` connection that delivers audit events as
        they are emitted.

        Frames:

        ```
        event: heartbeat
        data: {"timestamp":"2026-09-01T12:00:00Z"}

        event: audit_event
        data: {"id":"...","event_type":"hub.workspace.create","timestamp":"...","workspace":"..."}
        ```

        An initial heartbeat confirms the connection, and further heartbeats
        follow every 30 seconds. A connection with no reads for 60 seconds is
        closed. Each client buffers up to 256 events; when the buffer is full
        the oldest event is dropped to make room.

        The concurrent connection ceiling comes from `AF_SSE_MAX_CONNECTIONS`
        (default 100); beyond it new connections receive `503`.

        Non-admin callers receive only the events of workspaces they own or
        whose organization they belong to; the set is computed once when the
        stream opens and kept until it closes. Events without a workspace go
        to admin tokens only.
      x-required-scopes: ["audit:read"]
      parameters:
        - name: workspace
          in: query
          description: Only deliver events for this workspace slug.
          schema: { type: string }
        - name: run_id
          in: query
          description: Only deliver events for this agent run.
          schema: { type: string }
        - name: category
          in: query
          description: Only deliver events in this category.
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MissingScope"
        "404":
          description: "`workspace` names a workspace the caller may not read (`workspace not found`); answered as JSON before any stream header."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: The maximum number of concurrent SSE connections is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Git smart HTTP
  # ---------------------------------------------------------------------------

  /git/{org}/{slug}.git/info/refs:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    get:
      tags: [Git]
      operationId: gitInfoRefs
      summary: Git ref advertisement (smart HTTP discovery)
      description: |
        The `.git` suffix is mandatory; a request without it is answered with
        `404`.

        Authentication is HTTP Basic: the username is ignored and the password
        must be a valid hub credential. API keys and admin tokens have implicit
        git access; PATs need `git:read` (for `git-upload-pack`) or `git:write`
        (for `git-receive-pack`).

        Ownership is enforced -- a caller who does not own the workspace gets a
        pkt-line `404`, so slugs cannot be enumerated. Admin-role API keys do
        **not** bypass this; only admin tokens do.
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:read", "git:write"]
      parameters:
        - name: service
          in: query
          required: true
          description: The git service being negotiated.
          schema:
            type: string
            enum: [git-upload-pack, git-receive-pack]
      responses:
        "200":
          description: >-
            A pkt-line ref advertisement, with content type
            `application/x-<service>-advertisement`.
          content:
            application/x-git-upload-pack-advertisement:
              schema:
                type: string
                format: binary
            application/x-git-receive-pack-advertisement:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: >-
            The `service` parameter is missing or invalid, or the PAT lacks the
            required git scope. The body is a pkt-line error.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, the caller does not own the workspace, or the path lacks
            the `.git` suffix.

  /git/{org}/{slug}.git/git-upload-pack:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    post:
      tags: [Git]
      operationId: gitUploadPack
      summary: Git fetch and clone data transfer
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:read"]
      requestBody:
        required: true
        content:
          application/x-git-upload-pack-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The pkt-line upload-pack result.
          content:
            application/x-git-upload-pack-result:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: The PAT lacks the `git:read` scope.
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, or the caller does not own the workspace.

  /git/{org}/{slug}.git/git-receive-pack:
    parameters:
      - $ref: "#/components/parameters/GitOrg"
      - $ref: "#/components/parameters/GitSlug"
    post:
      tags: [Git]
      operationId: gitReceivePack
      summary: Git push data transfer
      description: |
        After a successful push the server updates `head_sha` in the database
        and resets the working tree to the new HEAD, then emits a
        `hub.git.push` audit event. Only accepted ref updates drive the audit
        event and the post-push hook.

        For carry-patch workspaces, a pre-receive hook enforces push control
        on registered patch branches. The behaviour depends on
        `patch_branch_source` and `push_patches_to_origin`:

        - **Reject** (`patch_branch_source=origin`, `push_patches_to_origin`
          not `"true"`): the update is rejected with a per-ref message naming
          the fork.
        - **Forward** (`patch_branch_source=origin`,
          `push_patches_to_origin=true`): the update is pushed to the fork
          before the hub writes its ref. A forward failure rejects the ref.
        - **Mirror** (`patch_branch_source=hub`,
          `push_patches_to_origin=true`): accepted pushes are force-pushed to
          the fork after the push, best effort.

        If a pushed branch is a registered patch of a carry-patch workspace and
        `auto_rebuild_after_push` is not `false`, a rebuild job is enqueued.
        The hook runs asynchronously and never alters the push response.
      security:
        - gitBasicAuth: []
      x-required-scopes: ["git:write"]
      requestBody:
        required: true
        content:
          application/x-git-receive-pack-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The pkt-line receive-pack result.
          content:
            application/x-git-receive-pack-result:
              schema:
                type: string
                format: binary
        "401":
          description: The credentials are missing or invalid.
        "403":
          description: The PAT lacks the `git:write` scope.
        "404":
          description: >-
            The workspace does not exist, the org does not match, the clone is
            not ready, or the caller does not own the workspace.

  # ---------------------------------------------------------------------------
  # Identity and access (apikit)
  #
  # Mounted by apikit's Server.MountHandlers on the API group, so every one of
  # these routes lives under the configured mount point -- `/api/v1` by
  # default. Both docs/api.md and docs/permissions.md write them without that
  # prefix; see docs/errata/openapi_description.md.
  # ---------------------------------------------------------------------------

  /hooks/forge/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: The workspace the forge's webhook is set up for.
        schema:
          type: string
    post:
      tags: [Forge]
      operationId: receiveForgeDelivery
      summary: Receive a delivery of the workspace's forge
      description: |
        Registered at the server root beside `/git/...`, outside the API auth group;
        the forge proves who it is with the signature of the workspace's webhook
        secret. The body size limit and the content-type check of the API group do not
        apply. Takes no workspace lock and never contacts the forge.

        The scheme comes from the headers: `X-Hub-Signature-256` is GitHub's (`sha256=`
        and the HMAC-SHA256 of the raw body, 64 lowercase hex digits); else
        `X-Gitlab-Token`, compared with the secret before the body is read, is GitLab's.
        A delivery id (`X-GitHub-Delivery`; `Idempotency-Key`, else
        `X-Gitlab-Event-UUID`) and an event name (`X-GitHub-Event`, `X-Gitlab-Event`)
        are required. A unknown slug and a workspace without the secret are the same
        `404`. A missing, malformed or wrong signature or token is `401` with one message
        whatever is wrong, and records nothing. A body over 1 MiB is `413`
        (`error_type: body_too_large`).

        A verified delivery is recorded once (a repeat is the outcome `duplicate`),
        answered `202`, and only then relayed as `hub.forge.*` audit events, which reach
        the SSE stream and the audit query. The payload is never stored. See
        `docs/api.md` ("The webhook ingress") for the mapping and the events.
      security: []
      x-required-scopes: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          description: GitHub's signature, `sha256=` and 64 lowercase hex digits.
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: false
          description: GitHub's id of the delivery.
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: false
          description: GitHub's event name.
          schema:
            type: string
        - name: X-Gitlab-Token
          in: header
          required: false
          description: GitLab's secret token.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: GitLab's id of the delivery, which stays the same across retries.
          schema:
            type: string
        - name: X-Gitlab-Event-UUID
          in: header
          required: false
          description: GitLab's id of the delivery when there is no `Idempotency-Key`.
          schema:
            type: string
        - name: X-Gitlab-Event
          in: header
          required: false
          description: GitLab's event name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The forge's payload. Only the fields the mapping reads are used.
      responses:
        "202":
          description: >-
            The delivery was verified and is answered before its events are relayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeDeliveryAnswer"
        "400":
          description: >-
            The delivery has no id or no event name, or its id is over 255 characters or
            not printable ASCII; or its payload is not a JSON object or lacks the field
            that says what it is about (recorded as `malformed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            `delivery signature missing or invalid`: no scheme header, or a signature or
            token that is missing, malformed or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No workspace has the slug, or it has no webhook secret. The body is the same
            for both.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >-
            The body is over 1 MiB (`error_type: body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /version:
    get:
      tags: [Health]
      operationId: getVersion
      summary: Server build information
      description: >-
        Registered at the server root alongside the health probes, outside the
        API auth group. Cached publicly.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Build metadata and the configured API mount point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/auth/providers:
    get:
      tags: [Identity]
      operationId: listOAuthProviders
      summary: List the configured OAuth providers
      description: |
        Returns each provider configured under `[[oauth.providers]]` with the
        authorize URL to send the user to. Cached publicly for five minutes.

        Public: `RegisterOAuthHandlers` runs before `api.Use(authMiddleware)`
        in `MountHandlers`, and Echo snapshots a group's middleware when a
        route is added, so both `/auth` routes are registered without the auth
        middleware.
      security: []
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthProvider"

  /api/v1/auth/callback:
    post:
      tags: [Identity]
      operationId: oauthCallback
      summary: Exchange an OAuth authorization code for an API key
      description: |
        The only way an API key is created. In a single transaction the hub
        upserts the user record, revokes **all** of that user's existing API
        keys, and generates a new `af_<key_id>_<secret>`. The plaintext key is
        returned once; only its SHA-256 hash is persisted.

        Public, like `GET /api/v1/auth/providers` -- it has to be reachable
        before the caller holds a credential.

        Because re-login mass-revokes keys, any automation still holding an
        older key for the same user stops working after a login.

        `redirect_uri` is validated against the provider's allowlist. `expires`
        is a key lifetime in days and must be 0, 30, 60, or 90; it defaults to
        90.

        On a new user the hub's `OnAfterUserCreate` hook runs inside the same
        transaction and creates the user's personal organization.
      security: []
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: The user record and the newly issued API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCallbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The authorization code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The matched user is blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The user already exists under a conflicting identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      x-provider: apikit
      x-required-scopes: ["users:read"]
      responses:
        "200":
          $ref: "#/components/responses/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      description: "`full_name` is the only mutable field, and it is required."
      x-provider: apikit
      x-required-scopes: ["users:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserProfile"
        "400":
          description: The body is malformed, or `full_name` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/orgs:
    get:
      tags: [Identity]
      operationId: listCurrentUserOrgs
      summary: List the authenticated user's organization memberships
      x-provider: apikit
      x-required-scopes: ["orgs:read"]
      responses:
        "200":
          description: The organizations the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys:
    get:
      tags: [Identity]
      operationId: listCurrentUserKeys
      summary: List the authenticated user's API keys
      description: >-
        Metadata only. Secret hashes, expiry-day settings, and plaintext
        secrets are never exposed. Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: ["keys:read"]
      responses:
        "200":
          description: The caller's API key metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyMeta"
        "304":
          description: The ETag matched; the listing is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserKey
      summary: Revoke one of the authenticated user's API keys
      description: >-
        Self-revocation is allowed: the auth middleware validates the
        credential before the handler runs and does not re-validate mid-flight,
        so a key can revoke itself.
      x-provider: apikit
      x-required-scopes: ["keys:manage"]
      responses:
        "204":
          description: The key was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The key does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/keys/{key_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      tags: [Identity]
      operationId: refreshCurrentUserKey
      summary: Rotate an API key secret
      description: >-
        Generates a new secret while preserving `key_id`, and recomputes the
        expiry from the key's stored lifetime. **PAT authentication is
        rejected** -- this endpoint requires API key auth.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The rotated key. The plaintext value is returned only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyFull"
        "400":
          description: The key is revoked or already expired and cannot be refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            No credential was supplied, or the request authenticated with
            something other than an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The key does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens:
    get:
      tags: [Identity]
      operationId: listCurrentUserTokens
      summary: List the authenticated user's personal access tokens
      x-provider: apikit
      x-required-scopes: ["tokens:read"]
      responses:
        "200":
          description: PAT metadata, including the permissions granted to each token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Identity]
      operationId: createCurrentUserToken
      summary: Create a personal access token
      description: |
        Every requested permission is validated against the registry: a
        malformed scope or one that is not registered is rejected with `400`.

        A PAT creating another PAT may only grant permissions it already holds;
        attempting to exceed them fails with `403`. API keys are not subject to
        that restriction and may mint a PAT with any registered permission.
      x-provider: apikit
      x-required-scopes: ["tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The new token. The plaintext value is returned only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessTokenWithSecret"
        "400":
          description: >-
            The body is malformed; `name` is missing or over 255 characters;
            `permissions` is empty; a permission is malformed or unknown; or
            `expires` is not 0, 30, 60, or 90.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller lacks `tokens:manage`, or a PAT tried to grant a
            permission it does not itself hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    get:
      tags: [Identity]
      operationId: getCurrentUserToken
      summary: Get one of the authenticated user's PATs
      x-provider: apikit
      x-required-scopes: ["tokens:read"]
      responses:
        "200":
          description: The PAT metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserToken
      summary: Revoke one of the authenticated user's PATs
      x-provider: apikit
      x-required-scopes: ["tokens:manage"]
      responses:
        "200":
          description: The revoked token's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          description: The token is already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The PAT lacks the `tokens:manage` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/tokens/{token_id}/permissions:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    put:
      tags: [Identity]
      operationId: replaceTokenPermissions
      summary: Replace a PAT's permissions
      description: >-
        An explicit empty array clears every permission and auto-revokes the
        token. An absent or null `permissions` field is rejected.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: The body is malformed, `permissions` is absent, or the token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Identity]
      operationId: addTokenPermissions
      summary: Add permissions to a PAT
      description: An empty `permissions` array is an error here, unlike on `PUT`.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: >-
            The body is malformed, `permissions` is absent or empty, or the
            token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Identity]
      operationId: removeTokenPermissions
      summary: Remove permissions from a PAT
      description: An empty `permissions` array is an error here, unlike on `PUT`.
      x-provider: apikit
      x-required-scopes: ["tokens:write", "tokens:manage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenPermissions"
        "400":
          description: >-
            The body is malformed, `permissions` is absent or empty, or the
            token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionForbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Administration (apikit)
  #
  # Admin tokens and admin-role API keys only. Note the asymmetry: an
  # admin-role API key passes RequireAdmin here, but is treated as an ordinary
  # user by the workspace and git subsystems, which check for the admin token
  # credential type directly.
  # ---------------------------------------------------------------------------

  /api/v1/users:
    get:
      tags: [Administration]
      operationId: listUsers
      summary: List all users
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Every user on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      operationId: createUser
      summary: Create a user
      description: >-
        The INSERT and the after-user-create hook run in one transaction, so
        the hub's personal-organization creation is atomic with the user
        record.
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The body is malformed or a required field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "409":
          description: The username or the provider identity already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Administration]
      operationId: getUser
      summary: Get any user
      description: Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "304":
          description: The ETag matched; the record is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Administration]
      operationId: updateUser
      summary: Update any user
      description: "`full_name` is the only mutable field, and it is required."
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The body is malformed, or `full_name` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/promote:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Administration]
      operationId: promoteUser
      summary: Promote a user to admin
      description: Idempotent -- promoting an existing admin returns the record unchanged.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The promoted user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/demote:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Administration]
      operationId: demoteUser
      summary: Demote a user from admin
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The demoted user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: The last remaining admin cannot be demoted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/block:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Administration]
      operationId: blockUser
      summary: Block a user
      description: >-
        Blocking disables every API key the user owns at authentication time
        without revoking them individually; unblocking re-enables all
        non-revoked, unexpired keys.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The blocked user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Administration]
      operationId: unblockUser
      summary: Unblock a user
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The unblocked user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Administration]
      operationId: listUserKeys
      summary: List any user's API keys
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The user's API key metadata, including the owning `user_id`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyMetaWithOwner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/KeyId"
    delete:
      tags: [Administration]
      operationId: revokeUserKey
      summary: Revoke any user's API key
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The key was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: The user or the key does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Administration]
      operationId: listUserTokens
      summary: List any user's PATs
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The user's PAT metadata, including the owning `user_id`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessTokenWithOwner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Administration]
      operationId: revokeUserToken
      summary: Revoke any user's PAT
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: The user or the token does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs:
    get:
      tags: [Administration]
      operationId: listOrgs
      summary: List all organizations
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: Every organization on the server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Administration]
      operationId: createOrg
      summary: Create an organization
      description: >-
        Each user additionally receives a personal organization automatically
        on creation, through the hub's `OnAfterUserCreate` hook.
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: The created organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The body is malformed, `name` or `slug` is missing, or the slug format is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "409":
          description: The organization name or slug already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Administration]
      operationId: getOrg
      summary: Get an organization
      description: >-
        Non-admin callers must be a member; admin credentials bypass that
        check. Supports conditional GET via ETag.
      x-provider: apikit
      x-required-scopes: ["orgs:read"]
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "304":
          description: The ETag matched; the record is unchanged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not a member of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Administration]
      operationId: updateOrg
      summary: Update an organization
      description: "`name` and `url` are the mutable fields; at least one must be supplied."
      x-provider: apikit
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The body is malformed, no fields were supplied, or `name` was set to empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "409":
          description: The organization name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Administration]
      operationId: deleteOrg
      summary: Delete an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The organization was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/block:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Administration]
      operationId: blockOrg
      summary: Block an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The blocked organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Administration]
      operationId: unblockOrg
      summary: Unblock an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The unblocked organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Administration]
      operationId: listOrgMembers
      summary: List organization members
      description: Admin credentials bypass the membership check.
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The organization's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/OrgNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orgs/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: user_id
        in: path
        required: true
        description: The user to add or remove.
        schema:
          type: string
          format: uuid
    put:
      tags: [Administration]
      operationId: addOrgMember
      summary: Add a member to an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "200":
          description: The membership record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: The organization or the user does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Administration]
      operationId: removeOrgMember
      summary: Remove a member from an organization
      x-provider: apikit
      x-required-scopes: []
      responses:
        "204":
          description: The user is no longer a member.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          description: The organization or the membership does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`, where the credential is an admin
        token (`af_admin_<64-hex>`), an API key (`af_<key_id>_<secret>`), or a
        personal access token (`af_pat_<token_id>_<secret>`).
    gitBasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication for the git smart HTTP endpoints. The
        username is ignored; the password must be a valid hub credential.
        `afc credential-helper get` returns the stored API key with the
        username `x-token-auth`.

  parameters:

    WorkspaceSlug:
      name: slug
      in: path
      required: true
      description: The workspace slug.
      schema:
        $ref: "#/components/schemas/Slug"

    SandboxLeaseId:
      name: id
      in: path
      required: true
      description: The lease ID, `sbx_` and 32 lowercase hex characters.
      schema:
        type: string
        pattern: "^sbx_[0-9a-f]{32}$"

    SandboxLeaseAll:
      name: all
      in: query
      required: false
      description: >-
        Include leases that have ended. Anything `strconv.ParseBool` accepts
        (`1`, `t`, `T`, `TRUE`, `true`, `True`, `0`, `f`, `F`, `FALSE`, `false`,
        `False`); other values, an empty one included, answer 400.
      schema:
        type: string

    ForgeTarget:
      name: target
      in: query
      required: false
      description: >-
        Which remote to read: `origin`, the default, is the workspace's
        `git_url`; `upstream` is the `upstream_url` of a `carry_patch` workspace
        that has one, else `400` with `error_type: workspace_mode_mismatch`. Any
        other value, an empty or a repeated one included, is `400` with the
        message `target must be "origin" or "upstream"`.
      schema:
        type: string
        enum: [origin, upstream]

    ForgeNumber:
      name: "n"
      in: path
      required: true
      description: >-
        The number of the issue or pull request (on GitLab the project's `iid`):
        a positive decimal integer, else `400` with the message `n must be a
        positive decimal integer`.
      schema:
        type: string
        pattern: "^[0-9]+$"

    ForgeLabelName:
      name: name
      in: path
      required: true
      description: >-
        The name of the label, percent-encoded as one path segment and decoded
        exactly once (`type%2Fbug` is `type/bug`, `af:fix` is unchanged). A blank
        name is `400`.
      schema:
        type: string

    ForgeIssueState:
      name: state
      in: query
      required: false
      description: Only issues in this state. Not passed to the forge when absent.
      schema:
        type: string
        enum: [open, closed, all]

    ForgeIssueLabels:
      name: labels
      in: query
      required: false
      description: >-
        Only issues with all of these labels, comma-separated. Empty items are
        dropped; the parameter may be repeated.
      schema:
        type: string
        example: "af:triage,bug"

    ForgeIssueAssignee:
      name: assignee
      in: query
      required: false
      description: Only issues assigned to this user (free text).
      schema:
        type: string

    ForgeIssueSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated]

    ForgeIssueDirection:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]

    ForgeIssueLimit:
      name: limit
      in: query
      required: false
      description: The number of issues, 1 to 100. Always passed to issuex.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

    OrgSlug:
      name: slug
      in: path
      required: true
      description: The organization slug.
      schema:
        type: string

    OrgId:
      name: id
      in: path
      required: true
      description: The organization identifier.
      schema:
        type: string

    UserId:
      name: id
      in: path
      required: true
      description: The user identifier.
      schema:
        type: string
        format: uuid

    KeyId:
      name: key_id
      in: path
      required: true
      description: The API key identifier (the `key_id` segment of the key).
      schema:
        type: string

    TokenId:
      name: token_id
      in: path
      required: true
      description: The personal access token identifier.
      schema:
        type: string

    PatchId:
      name: id
      in: path
      required: true
      description: The patch identifier.
      schema:
        type: string
        format: uuid

    JobId:
      name: id
      in: path
      required: true
      description: The job identifier.
      schema:
        type: string
        format: uuid

    SessionId:
      name: id
      in: path
      required: true
      description: The agent session identifier.
      schema:
        type: string

    EntryKey:
      name: key
      in: path
      required: true
      description: The secret or variable key. Lookup is case-insensitive.
      schema:
        $ref: "#/components/schemas/EntryKeyName"

    RunId:
      name: run_id
      in: path
      required: true
      description: The agent run identifier.
      schema:
        $ref: "#/components/schemas/RunId"

    GitOrg:
      name: org
      in: path
      required: true
      description: The organization slug that owns the workspace.
      schema:
        type: string

    GitSlug:
      name: slug
      in: path
      required: true
      description: >-
        The workspace slug. The literal `.git` suffix that follows it in the
        path is required and is not part of this value.
      schema:
        $ref: "#/components/schemas/Slug"

    Since:
      name: since
      in: query
      description: Inclusive lower bound on the record timestamp.
      schema:
        type: string
        format: date-time

    Until:
      name: until
      in: query
      description: Exclusive upper bound on the record timestamp.
      schema:
        type: string
        format: date-time

    Order:
      name: order
      in: query
      description: Sort order.
      schema:
        type: string
        enum: [asc, desc]
        default: desc

    Cursor:
      name: cursor
      in: query
      description: Opaque base64url keyset pagination token from a previous response.
      schema:
        type: string

    AuditLimit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500

    FilterEventType:
      name: event_type
      in: query
      description: Filter by exact event type.
      schema:
        type: string

    FilterSeverity:
      name: severity
      in: query
      description: Filter by severity.
      schema:
        $ref: "#/components/schemas/Severity"

    FilterNodeId:
      name: node_id
      in: query
      description: Filter by task-graph node identifier.
      schema:
        type: string

    FilterSessionId:
      name: session_id
      in: query
      description: Filter by session identifier.
      schema:
        type: string

    FilterToolName:
      name: tool_name
      in: query
      description: Filter by tool name.
      schema:
        type: string

    FilterStatus:
      name: status
      in: query
      description: Filter by status.
      schema:
        type: string

  responses:

    Unauthorized:
      description: No credential was supplied, or the credential is invalid, revoked, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: 401
              message: authentication required

    MissingScope:
      description: >-
        The PAT lacks a permission scope required by this endpoint (no
        `error_type`). On a workspace route that needs write access, a member of
        the workspace's organization also gets 403, with the message `org members
        have read-only access to this workspace` and `error_type: forbidden`
        (see MemberReadOnly).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InsufficientScope:
      description: >-
        The PAT lacks a permission scope required by this endpoint
        (`insufficient permission scope`, no `error_type`). On a workspace
        variable write, a member of the workspace's organization also gets 403
        with `error_type: forbidden` (see MemberReadOnly).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AdminRequired:
      description: The credential is not an admin token or an admin-role API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MemberReadOnly:
      description: >-
        The caller is a member of the workspace's organization, who may read the
        workspace but not change it. Written on every workspace route that needs
        write access, after the PAT scope check and before status checks.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: 403
              message: org members have read-only access to this workspace
              error_type: forbidden

    BadRequest:
      description: The request body is missing or malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: An unexpected server-side failure, typically a database error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFound:
      description: No workspace with this slug exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AuditWorkspaceNotFound:
      description: >-
        The workspace does not exist, or the caller is not its owner, a member
        of its organization or an admin token (`workspace not found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFoundOrForbidden:
      description: >-
        The workspace does not exist, the caller may not see it (not its owner,
        not a member of its organization, not an admin token), or the PAT lacks
        the required scope. All three collapse to `404` under the
        anti-enumeration policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceNotFoundOrNotOwned:
      description: >-
        The workspace does not exist or the caller may not see it: not its owner,
        not a member of its organization (on a private route, such as the
        workspace secrets and bound tokens, not even a member), not an admin
        token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeBadRequest:
      description: >-
        `target` is not `origin` or `upstream`, or `target=upstream` is asked of
        a workspace that is not a `carry_patch` fork with an `upstream_url`
        (`error_type: workspace_mode_mismatch`), or `n` or a query parameter is
        invalid. The message names the parameter. Nothing was sent to the forge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeWriteBadRequest:
      description: >-
        The workspace is not active (`workspace is not active`), or `target` is
        not `origin` or `upstream`, or `target=upstream` is asked of a workspace
        that is not a `carry_patch` fork with an `upstream_url`
        (`error_type: workspace_mode_mismatch`), or `n` is not a positive
        integer, or the JSON body is malformed or breaks a rule of the route
        (the message names the field, or says `nothing to update`). Nothing was
        sent to the forge and no event was recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeBodyTooLarge:
      description: >-
        A body-like field (an issue, pull-request or comment body, or the comment
        of a close) is longer than the forge accepts, counted in Unicode code
        points: 65,536 on GitHub, 1,000,000 on GitLab
        (`error_type: body_too_large`). The message names the field, its length,
        the forge and the limit, for example `body is 70000 characters; github
        accepts at most 65536`. Nothing was sent to the forge and no event was
        recorded. A request body larger than the server's `max_body_size` is
        refused earlier with the server's own `413`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeNotFound:
      description: >-
        The workspace does not exist or the caller may not see it
        (`workspace not found`), or the forge answered 404
        (`error_type: forge_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeUnprocessable:
      description: >-
        `forge_api_url` (`upstream_forge_api_url` for the upstream) is invalid
        (`error_type: forge_api_url_invalid`; the message names the setting and
        the rule, not the value); or the forge cannot be told from the host or
        an API URL setting, or the remote URL names no repository
        (`error_type: forge_unknown`); or the forge answered another 4xx
        (`error_type: forge_rejected`). Nothing is sent to the forge in the
        first two cases.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeRateLimited:
      description: >-
        A rate limit issuex could not wait out (`error_type: forge_rate_limited`).
        `Retry-After` is set, in whole seconds rounded up, when issuex knows how
        long to wait.
      headers:
        Retry-After:
          description: Whole seconds, rounded up; absent when the forge gave none.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeBadGateway:
      description: >-
        The forge failed: it answered 401 (`error_type: forge_unauthenticated`),
        403 that is not a rate limit (`forge_forbidden`), 5xx, a response that
        cannot be read or a redirect to another host (`forge_error`), or the
        connection failed at DNS, TCP or TLS level (`forge_unreachable`). The
        message is the forge's, with the token replaced by `[redacted]`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ForgeGatewayTimeout:
      description: >-
        The forge did not answer within 30 seconds, issuex's retries included
        (`error_type: forge_timeout`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    OrgNotFound:
      description: No organization with this identifier exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    OrgNotFoundOrNotMember:
      description: The organization does not exist, or the caller is not a member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UserNotFound:
      description: No user with this identifier exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PatchNotFound:
      description: No patch with this identifier exists for the given workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    JobNotFound:
      description: The job does not exist, or it belongs to a different workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EntryNotFound:
      description: No entry with this key exists in the scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DuplicateKey:
      description: An entry with this key already exists in the scope (case-insensitive).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    MissingValueField:
      description: The request body does not contain a `value` field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EntryValidationError:
      description: >-
        `entries` is empty, a key has an invalid format or is too long, a value
        exceeds 256 KB, or the 100-entry per-scope limit would be exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InvalidQueryParams:
      description: The cursor is invalid, or `since` or `until` is not a valid RFC 3339 timestamp.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    AuditWriteForbidden:
      description: >-
        The caller has no write access to the workspace
        (`error_type: workspace_access_denied`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    WorkspaceArchived:
      description: "The workspace is archived and rejects ingestion (`error_type: workspace_archived`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SecretEntry:
      description: A secret entry. The value is never included.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecretEntry"

    SecretEntryList:
      description: Secret entries. Values are never included.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SecretEntry"

    VariableEntry:
      description: A variable entry, including its decoded value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VariableEntry"

    VariableEntryList:
      description: Variable entries, including their decoded values.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VariableEntry"

    UserProfile:
      description: The user profile.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    TokenPermissions:
      description: The token's metadata, including its permissions after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PersonalAccessToken"

    TokenNotFound:
      description: The token does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TokenPermissionForbidden:
      description: >-
        The caller lacks `tokens:write` or `tokens:manage`, or a PAT tried to
        grant a permission it does not itself hold.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    # -- Shared primitives -----------------------------------------------------

    BoundTokenCreated:
      type: object
      description: A token minted and bound to a workspace. The only place the token is shown.
      required: [token_id, token, name, permissions, workspace, expires_at, created_at]
      properties:
        token_id:
          type: string
        token:
          type: string
          description: The plaintext token, shown once.
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        workspace:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    BoundToken:
      type: object
      description: A token bound to a workspace, without any secret.
      required: [token_id, name, permissions, workspace, expires_at, revoked_at, created_at]
      properties:
        token_id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        workspace:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      description: The apikit error envelope used by every error response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: The HTTP status code, repeated in the body.
            message:
              type: string
              description: A human-readable description of the failure.
            error_type:
              type: string
              description: >-
                Machine-readable classification. Present only on the handlers
                that set it.
              enum:
                - duplicate_merge
                - workspace_mode_mismatch
                - no_active_patches
                - concurrent_rebuild
                - sandboxes_disabled
                - sandbox_capacity
                - secret_missing
                - workspace_access_denied
                - forbidden
                - token_bound
                - forge_api_url_invalid
                - forge_unknown
                - forge_not_found
                - forge_unauthenticated
                - forge_forbidden
                - forge_rate_limited
                - forge_rejected
                - forge_error
                - forge_unreachable
                - forge_timeout
                - workspace_busy
                - branch_not_found
                - integration_branch
                - patch_branch
                - protected_branch
                - non_fast_forward
                - body_too_large
                - workspace_archived
                - unknown_schema_version
                - postmortem_not_found
      examples:
        - error:
            code: 400
            message: slug is required
        - error:
            code: 409
            message: a rebuild job is already queued or running for this workspace
            error_type: concurrent_rebuild

    Slug:
      type: string
      description: |
        A URL-safe identifier: 3-64 characters, starting with a lowercase
        letter, ending with a lowercase letter or digit, containing only
        lowercase letters, digits, and hyphens, with no consecutive hyphens.
      minLength: 3
      maxLength: 64
      pattern: "^[a-z](?:[a-z0-9]|-(?!-))*[a-z0-9]$"
      examples: [my-project]

    EntryKeyName:
      type: string
      description: >-
        A secret or variable key: alphanumeric characters and underscores only,
        not starting with a digit, at most 255 characters. Lookup is
        case-insensitive.
      maxLength: 255
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      examples: [MY_SECRET]

    RunId:
      type: string
      description: An agent run identifier, formatted `YYYYMMDD_HHMMSS_<6 hex chars>`.
      pattern: "^[0-9]{8}_[0-9]{6}_[0-9a-f]{6}$"
      examples: ["20260704_143022_a1b2c3"]

    Sha:
      type: string
      description: A 40-character lowercase hex git object SHA.
      pattern: "^[0-9a-f]{40}$"

    Severity:
      type: string
      enum: [info, warning, error, critical]

    JobStatus:
      type: string
      description: Durable job queue lifecycle state.
      enum: [queued, running, completed, failed, dead_letter, cancelled]

    SessionStatus:
      type: string
      description: >-
        Agent session state. `terminated` is set only by the server when a
        workspace is archived or deleted; clients cannot set it.
      enum: [active, completed, failed, timeout, terminated]

    PatchStatus:
      type: string
      enum: [active, merged_upstream, conflict, disabled, deleted]

    # -- Workspaces ------------------------------------------------------------

    Workspace:
      type: object
      description: |
        A unit of work with its own clone, branch, and agents. Every field is
        always present in the response; nullable fields are emitted as `null`
        rather than omitted.
      required:
        - slug
        - git_url
        - hub_url
        - branch
        - owner_id
        - org_id
        - org_slug
        - access
        - status
        - display_name
        - description
        - clone_status
        - head_sha
        - clone_error
        - created_at
        - settings
        - updated_at
        - sync_mode
        - sync_status
        - upstream_head_sha
        - last_sync_at
        - sync_error
        - workspace_mode
        - upstream_url
        - integration_branch
      properties:
        slug:
          allOf:
            - $ref: "#/components/schemas/Slug"
          description: Immutable, globally unique identifier.
        git_url:
          type: string
          description: HTTPS or SSH URL of the git repository. Immutable after creation.
        hub_url:
          type: [string, "null"]
          description: >-
            Clone URL on the built-in git server. Null when `server.external_url`
            is unconfigured or the workspace has no organization.
          examples: ["http://localhost:8080/git/org-slug/my-project.git"]
        branch:
          type: [string, "null"]
          description: Git ref associated with the workspace. Immutable after creation.
        owner_id:
          type: string
          format: uuid
          description: The user who owns the workspace.
        org_id:
          type: [string, "null"]
          format: uuid
          description: The organization the workspace belongs to.
        org_slug:
          type: [string, "null"]
          description: >-
            Slug of the workspace's organization; null when `org_id` is null or
            names no organization.
        access:
          type: string
          enum: [admin, owner, member]
          description: >-
            The caller's access to the workspace: an admin token, its owner, or a
            member of its organization (read-only). It describes the caller, not
            a PAT's scopes; the create response always says `owner`.
        status:
          type: string
          enum: [active, archived]
        display_name:
          type: string
          description: >-
            Human-readable label. Defaults to the slug when unset; never null or
            empty.
          maxLength: 128
        description:
          type: string
          description: Free-form text. Defaults to an empty string; never null.
          maxLength: 1024
        clone_status:
          type: string
          enum: [pending, cloning, ready, failed, archived]
        head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: >-
            HEAD commit of the local clone. Set when `clone_status` is `ready`
            or `archived`.
        clone_error:
          type: [string, "null"]
          description: Failure detail when `clone_status` is `failed`.
        sync_mode:
          type: string
          enum: [pull_only, disabled]
          default: pull_only
        sync_status:
          type: string
          enum: [idle, syncing, error]
          default: idle
        upstream_head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Upstream HEAD at the last fetch. Null until the first sync.
        last_sync_at:
          type: [string, "null"]
          format: date-time
          description: Timestamp of the last successful sync.
        sync_error:
          type: [string, "null"]
          description: Failure detail from the most recent failed sync.
        workspace_mode:
          type: string
          enum: [standard, carry_patch]
          default: standard
          description: >-
            `standard` is single-remote; `carry_patch` is dual-remote with a
            patch list. Immutable after creation.
        upstream_url:
          type: [string, "null"]
          description: >-
            Upstream repository for carry-patch workspaces. Null for standard
            workspaces; immutable after creation.
        integration_branch:
          type: [string, "null"]
          description: >-
            The mechanically rebuilt branch combining the upstream base with all
            carried patches. Defaults to `deploy` for carry-patch workspaces and
            is null for standard ones; immutable after creation.
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWorkspaceRequest:
      type: object
      required: [slug, git_url]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        git_url:
          type: string
          description: A valid HTTPS or SSH git URL.
        branch:
          type: [string, "null"]
        org_id:
          type: [string, "null"]
          description: >-
            Must reference an organization the owner belongs to (by UUID or slug).
            When omitted or empty, the caller's personal organization is assigned.
        display_name:
          type: [string, "null"]
          maxLength: 128
          description: Defaults to the slug when omitted or empty.
        description:
          type: [string, "null"]
          maxLength: 1024
          description: Defaults to an empty string.
        sync_mode:
          type: [string, "null"]
          enum: [pull_only, disabled, null]
          default: pull_only
        workspace_mode:
          type: [string, "null"]
          enum: [standard, carry_patch, null]
          default: standard
        upstream_url:
          type: [string, "null"]
          description: >-
            Required when `workspace_mode` is `carry_patch`; rejected for
            standard workspaces.
        integration_branch:
          type: [string, "null"]
          description: >-
            Defaults to `deploy` for carry-patch workspaces; rejected for
            standard workspaces.
        settings:
          allOf: [{ $ref: "#/components/schemas/WorkspaceSettings" }]
          description: The behaviour switches to set; keys not given have their defaults.
        git_pat:
          type: string
          format: password
          description: >-
            Personal access token for a private repository. Mutually exclusive
            with `git_username`/`git_password` and requires an HTTPS `git_url`.
        git_username:
          type: string
          description: >-
            HTTP basic auth username. Must be paired with `git_password`,
            mutually exclusive with `git_pat`, and requires an HTTPS `git_url`.
        git_password:
          type: string
          format: password
          description: HTTP basic auth password. Must be paired with `git_username`.

    UpdateWorkspaceRequest:
      type: object
      description: >-
        Partial update. Only the properties present in the body are modified;
        at least one must be supplied. Sending an immutable field is rejected.
      minProperties: 1
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 128
          description: "`null` resets the display name to the workspace slug."
        description:
          type: [string, "null"]
          maxLength: 1024
          description: "`null` clears the description to an empty string."
        org_id:
          type: [string, "null"]
          description: >-
            Must reference an organization the owner belongs to (by UUID or slug).
            `null` removes the association.
        sync_mode:
          type: string
          enum: [pull_only, disabled]
          description: "`null` is rejected with `400`."
        settings:
          allOf: [{ $ref: "#/components/schemas/WorkspaceSettings" }]
          description: >-
            Keys given take their value, a key given as `null` returns to its
            default, keys not given are kept; the whole object as `null`
            resets every setting.
      additionalProperties: false

    CarryPatchSyncResponse:
      type: object
      description: |
        Returned by `POST /api/v1/workspaces/{slug}/sync` when the workspace is
        in `carry_patch` mode: the full workspace object plus the carry-patch
        fields as additional top-level keys (16-REQ-5.1).
      allOf:
        - $ref: "#/components/schemas/Workspace"
      required: [patches_merged, rebuild_triggered, force_push_detected, origin_fetched]
      properties:
        patches_merged:
          type: array
          description: >-
            Branch names of patches detected as merged upstream, via ancestry
            check, content-based `git cherry` detection, or PR-number scanning.
          items:
            type: string
        rebuild_triggered:
          type: boolean
          description: Whether this sync enqueued a rebuild job.
        rebuild_job_id:
          type: string
          format: uuid
          description: >-
            The enqueued rebuild job. Omitted entirely when no rebuild was
            enqueued -- it is never sent as null.
        force_push_detected:
          type: boolean
          description: >-
            Whether the new upstream HEAD is not a descendant of the previously
            stored one, indicating a history rewrite. Informational only -- the
            sync still proceeds.
        origin_fetched:
          type: boolean
          description: >-
            Always present. `true` when the fork (`origin`) was fetched in this
            sync (`patch_branch_source=origin`), `false` otherwise.
        patches_synced:
          type: array
          description: >-
            Present only when `patch_branch_source` is `origin` (empty `[]`
            when there are no candidates). Each element describes the
            per-branch outcome.
          items:
            $ref: "#/components/schemas/PatchSyncedElement"
        patches_diverged:
          type: array
          description: >-
            Present only when `patch_branch_source` is `origin`. Branch names
            whose state is `diverged`. Always `[]` under the `replace` policy.
          items:
            type: string

    PatchSyncedElement:
      type: object
      description: Per-branch outcome of an origin-mode patch sync.
      required: [branch_name, action, state]
      properties:
        branch_name:
          type: string
        action:
          type: string
          enum: [none, created, fast_forwarded, replaced]
          description: What sync did to the local patch branch.
        state:
          type: string
          enum: [in_sync, diverged, missing_on_origin]
          description: Relationship between the local branch and the fork after the sync.
        local_sha:
          type: string
          description: Local tip after the refresh. Omitted when there is no local branch.
        origin_sha:
          type: string
          description: Fork tip SHA. Omitted when the fork has no such branch.
        replaced_sha:
          type: string
          description: The hub-side tip that was discarded. Present only for `replaced`.

    # -- Patches ---------------------------------------------------------------

    Patch:
      type: object
      description: A patch branch carried on top of the upstream base.
      required:
        - id
        - workspace_slug
        - branch_name
        - position
        - status
        - upstream_pr_url
        - description
        - deleted_at
        - added_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_slug:
          type: string
        branch_name:
          type: string
          description: The git branch backing this patch. Immutable after creation.
        position:
          type: integer
          minimum: 1
          description: 1-based application order; lower positions are applied first.
        status:
          $ref: "#/components/schemas/PatchStatus"
        conflict_files:
          type: array
          description: >-
            Conflicting file paths. Omitted entirely when the patch has no
            recorded conflicts.
          items:
            type: string
        upstream_pr_url:
          type: [string, "null"]
        description:
          type: [string, "null"]
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Soft-deletion timestamp; null for live patches.
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        origin_sync_state:
          type: [string, "null"]
          enum: [in_sync, diverged, missing_on_origin, null]
          description: >-
            Relationship between the local patch branch and the fork after the
            last sync. Null in hub mode or when the patch has not been synced.
            Omitted when null.
        origin_sha:
          type: [string, "null"]
          description: >-
            SHA of the fork tip for this patch branch at the last sync. Null
            when the fork has no such branch or in hub mode. Omitted when null.
        origin_synced_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Timestamp of the last origin sync for this patch. Null in hub mode.
            Omitted when null.

    AddPatchRequest:
      type: object
      required: [branch_name]
      properties:
        branch_name:
          type: string
          description: >-
            Must be non-empty, must differ from the workspace
            `integration_branch`, and must not already be registered.
        position:
          type: integer
          minimum: 1
          description: >-
            1-based insertion position. Values above `max(position) + 1` are
            clamped to an append. Omitted means append.
        upstream_pr_url:
          type: string
        description:
          type: string
        skip_branch_check:
          type: boolean
          default: false
          description: >-
            When true, skip all branch resolution: no ref lookup, no fetch,
            no local branch creation and no workspace lock is taken for this
            element.
        if_not_exists:
          type: boolean
          default: false
          description: >-
            When the branch is already registered, return `200` with the
            existing record instead of `409`.

    UpdatePatchRequest:
      type: object
      description: >-
        Partial update. `branch_name` is immutable and is silently ignored if
        present.
      properties:
        position:
          type: integer
          minimum: 1
          description: Must not exceed the workspace's total patch count.
        status:
          $ref: "#/components/schemas/PatchStatus"
        description:
          type: string
        upstream_pr_url:
          type: string

    ReorderPatchesRequest:
      type: object
      required: [patch_ids]
      properties:
        patch_ids:
          type: array
          description: >-
            Exactly the workspace's patch IDs in the desired order -- no
            missing, extra, or duplicated entries.
          items:
            type: string
            format: uuid

    # -- Rerere ----------------------------------------------------------------

    SandboxLeaseRequest:
      type: object
      description: >-
        The POST body. Every field is optional, an empty body counts as `{}`, and
        any other field is refused.
      additionalProperties: false
      properties:
        profile:
          type: string
          description: Profile name, exact and case-sensitive. Defaults to the configured default profile.
        purpose:
          type: string
          description: At most 64 characters, no control character. Defaults to an empty string.
          maxLength: 64
        ttl:
          type: string
          description: >-
            A Go duration such as `30m`, from `1m` up to the profile's TTL.
            Defaults to the profile's TTL. Fractions of a second are cut off.
          example: 30m
        labels:
          type: object
          description: >-
            At most 16 pairs. A key is 1 to 63 characters from `A-Za-z0-9._-`,
            starts and ends with a letter or digit, and is not `lease` or
            `workspace` in any case. A value has at most 256 bytes and no
            control character.
          maxProperties: 16
          additionalProperties:
            type: string
            maxLength: 256

    SandboxLease:
      type: object
      description: >-
        A caller's right to one sandbox, with the profile copied at issue. It
        never carries the token, the token's hash or an environment value.
      required:
        - id
        - workspace
        - profile
        - purpose
        - state
        - gateway_url
        - expires_at
        - lease_expires_at
        - image
        - network
        - resources
        - require_landlock
        - secrets
        - optional_secrets
        - labels
        - created_by
        - created_at
        - updated_at
        - sandbox_id
        - error
        - ended_at
        - end_reason
      properties:
        id:
          type: string
          pattern: "^sbx_[0-9a-f]{32}$"
        workspace:
          type: string
        profile:
          type: string
        purpose:
          type: string
        state:
          type: string
          description: >-
            `leased` (issued, no sandbox yet), `active` (the sandbox was created),
            `destroyed`, `expired` (no `Create` before `lease_expires_at`, or the
            lease's time ran out) or `failed` (the sandbox could not be created).
            `destroyed`, `expired` and `failed` are terminal: such a lease stays
            readable for 24 hours after `ended_at` and is then removed.
          enum: [leased, active, destroyed, expired, failed]
        gateway_url:
          type: string
          description: >-
            Where the holder dials the sandbox gateway with the lease's token:
            `[sandbox].external_url` when set, otherwise `http://` or `https://`
            and the address the gateway listens on. The same on every lease, in
            every state.
        expires_at:
          type: string
          format: date-time
          description: >-
            `created_at` plus the lease TTL; the sandbox lifetime ends here, and
            the lease's token is refused from this moment in every state.
        lease_expires_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The deadline for the lease's `Create`: the earlier of `created_at`
            plus `[sandbox].lease_timeout` and `expires_at`. It never changes.
            A lease still `leased` at this moment lapses to `expired`. `null`
            for a lease issued before the field existed, which lapses at
            `expires_at`.
        image:
          type: string
        network:
          type: string
        resources:
          $ref: "#/components/schemas/SandboxResources"
        require_landlock:
          type: boolean
        secrets:
          type: array
          items:
            type: string
        optional_secrets:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        created_by:
          type: string
          description: The caller's user ID, or `admin` for an admin token.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sandbox_id:
          type: [string, "null"]
          description: The id of the sandbox once the lease is `active`.
        error:
          type: [string, "null"]
          description: >-
            Why a `failed` lease failed. A message that comes from the provider
            has secret values, fixed environment values and URL user information
            removed and is cut to 1024 bytes.
        ended_at:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          description: >-
            Why the lease ended: `client` (its holder closed its sandbox through
            the gateway), `api` (DELETE), `expired` (time: a lease that got no
            `Create` in time, or an `active` lease whose sandbox was destroyed at
            `expires_at`; `state` tells the two apart), `shutdown` (the hub shut
            down: the shutdown itself ended the lease, or DELETE or the holder's
            close did while it was shutting down) or `restart`
            (the hub found the lease `active` after a crash). `null` while the
            lease is live and for a `failed` lease.

    SandboxLeaseIssued:
      description: The lease and its token. Only the POST that issued the lease returns the token.
      allOf:
        - $ref: "#/components/schemas/SandboxLease"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: '`sbl_` and 44 characters of unpadded URL-safe base64 (33 random bytes). Shown once; hub keeps its SHA-256.'
              pattern: "^sbl_[A-Za-z0-9_-]{44}$"

    SandboxProfileListResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          description: Every profile, sorted by name.
          items:
            $ref: "#/components/schemas/SandboxProfile"

    ForgeCreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Must not be blank.
        body:
          type: string
          description: May be empty. At most 65,536 characters on GitHub, 1,000,000 on GitLab.
        labels:
          type: array
          maxItems: 100
          items:
            type: string
          description: Names, none blank.
        assignees:
          type: array
          maxItems: 100
          items:
            type: string
          description: User names, none blank. Not sent to GitLab.

    ForgeUpdateIssueRequest:
      type: object
      description: >-
        At least one field must be set and not `null`. A field that is absent or
        `null` is left as it is.
      properties:
        title:
          type: string
          description: Must not be blank.
        body:
          type: string
          description: "`\"\"` clears the body."
        state:
          type: string
          enum: [open, closed]
        labels:
          type: array
          maxItems: 100
          items:
            type: string
          description: Replaces the issue's whole set of labels; `[]` removes every label.
        assignees:
          type: array
          maxItems: 100
          items:
            type: string
          description: Replaces the issue's whole set of assignees; `[]` removes every one. Not sent to GitLab.

    ForgeCloseIssueRequest:
      type: object
      properties:
        comment:
          type: string
          description: >-
            Posted on the issue before it is closed when it is not blank. At most
            65,536 characters on GitHub, 1,000,000 on GitLab.

    ForgeCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Must not be blank. At most 65,536 characters on GitHub, 1,000,000 on GitLab.

    ForgeCommentCreated:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The URL of the comment the forge created.

    ForgeLabelNames:
      type: array
      minItems: 1
      maxItems: 100
      description: A bare array of label names, none blank.
      items:
        type: string

    ForgeEnsureLabelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Must not be blank.
        color:
          type: string
          pattern: "^#?[0-9a-fA-F]{6}$"
          description: Six hex digits, with or without a leading `#`. Default `ededed`.
        description:
          type: string

    ForgeLabel:
      type: object
      description: >-
        A label as the forge holds it. GitHub gives the color without a `#`,
        GitLab with one.
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string
        description:
          type: string

    ForgeCreatePullRequestRequest:
      type: object
      required: [title, head, base]
      properties:
        title:
          type: string
          description: Must not be blank.
        body:
          type: string
          description: At most 65,536 characters on GitHub, 1,000,000 on GitLab.
        head:
          type: string
          description: >-
            The branch with the changes, sent to the forge as given; GitHub's
            `owner:branch` opens a pull request from a fork. Must not be blank.
        base:
          type: string
          description: The branch to merge into. Must not be blank.
        draft:
          type: boolean
          default: false

    ForgeDiagnostic:
      type: object
      description: >-
        How the hub reaches the forge of a workspace's origin (the top-level
        fields) and, on a `carry_patch` workspace with an `upstream_url`, of its
        upstream. Nothing is sent to the forge to compute it.
      required: [forge, api_url, repository, credential, upstream, webhook]
      properties:
        forge:
          type: string
          enum: [github, gitlab, unknown]
        api_url:
          type: [string, "null"]
          description: >-
            The API URL the hub sends its requests under (for GitLab with
            `/api/v4`, which issuex appends to a value that lacks it); null when
            the forge is `unknown`. The variable's value or the default for the
            host: a `GITHUB_API_URL` or `GITLAB_API_URL` in the hub's own
            environment is not shown.
          example: https://api.github.com
        repository:
          oneOf:
            - $ref: "#/components/schemas/ForgeRepositoryRef"
            - type: "null"
          description: Null when the remote URL names no repository.
        credential:
          $ref: "#/components/schemas/ForgeCredentialKind"
        upstream:
          oneOf:
            - $ref: "#/components/schemas/ForgeRemote"
            - type: "null"
          description: Null unless the workspace is `carry_patch` with a non-empty `upstream_url`.
        webhook:
          $ref: "#/components/schemas/ForgeWebhookInfo"

    ForgeWebhookInfo:
      type: object
      description: The state of the workspace's webhook. It never holds the secret.
      required: [configured, url, last_delivery_at]
      properties:
        configured:
          type: boolean
          description: True when the workspace has the secret `FORGE_WEBHOOK_SECRET`.
        url:
          type: [string, "null"]
          description: >-
            The URL the forge posts to: `server.external_url` without its trailing
            `/`, then `/hooks/forge/<slug>`; null when `external_url` is not set.
          example: https://hub.example.com/hooks/forge/widgets
        last_delivery_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the latest delivery of any outcome was received; null when there
            is none.

    ForgeWebhookSetRequest:
      type: object
      description: The body of the `PUT`; it may be left out altogether.
      properties:
        secret:
          type: [string, "null"]
          minLength: 16
          maxLength: 255
          pattern: "^[!-~]+$"
          description: >-
            The secret to set. Absent or null: the hub generates one.

    ForgeWebhookState:
      type: object
      required: [configured, url]
      properties:
        configured:
          type: boolean
          const: true
        url:
          type: [string, "null"]
          description: The URL to enter in the forge's webhook settings; null when `server.external_url` is not set.
          example: https://hub.example.com/hooks/forge/widgets
        secret:
          type: string
          description: >-
            The generated secret, 64 lowercase hex characters. Present only when the
            hub generated it, and in this answer only.
          pattern: "^[0-9a-f]{64}$"

    ForgeDelivery:
      type: object
      description: A row of the delivery log.
      required: [delivery_id, forge, event, action, target, outcome, relayed, received_at]
      properties:
        delivery_id:
          type: string
        forge:
          type: string
          enum: [github, gitlab]
        event:
          type: string
          description: The forge's event name, cut to 64 bytes.
        action:
          type: string
          description: The action in the payload; empty when it has none.
        target:
          type: [string, "null"]
          enum: [origin, upstream, null]
          description: The repository of the workspace the delivery is about; null when it is about neither.
        outcome:
          type: string
          enum: [relayed, ignored, repository_mismatch, malformed]
        relayed:
          type: array
          items:
            type: string
          description: The event types handed to the emitter, in order.
        received_at:
          type: string
          format: date-time

    ForgeDeliveryAnswer:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [relayed, ignored, repository_mismatch, duplicate]

    ForgeRemote:
      type: object
      description: The four fields that describe one remote.
      required: [forge, api_url, repository, credential]
      properties:
        forge:
          type: string
          enum: [github, gitlab, unknown]
        api_url:
          type: [string, "null"]
        repository:
          oneOf:
            - $ref: "#/components/schemas/ForgeRepositoryRef"
            - type: "null"
        credential:
          $ref: "#/components/schemas/ForgeCredentialKind"

    ForgeCredentialKind:
      type: string
      description: >-
        How the hub authenticates to the forge: `pat` (a `GIT_PAT`, username
        `x-token-auth`), `basic` (any other username; the password is sent as the
        token) or `none`. Never a value.
      enum: [pat, basic, none]

    ForgeRepositoryRef:
      type: object
      required: [host, owner, name]
      properties:
        host:
          type: string
          example: gitlab.example.com
        owner:
          type: string
          description: The full namespace path, `group/subgroup` on GitLab.
          example: group/subgroup
        name:
          type: string
          example: widgets

    ForgeUser:
      type: object
      required: [login]
      properties:
        login:
          type: string

    ForgeRepository:
      type: object
      description: A repository as issuex encodes it.
      required: [full_name, default_branch, private, archived, permissions]
      properties:
        full_name:
          type: string
        default_branch:
          type: string
        private:
          type: boolean
        archived:
          type: boolean
        permissions:
          type: object
          required: [push, pull, admin]
          properties:
            push:
              type: boolean
            pull:
              type: boolean
            admin:
              type: boolean
        allow_merge_commit:
          type: boolean
          description: Omitted when false.
        allow_squash_merge:
          type: boolean
          description: Omitted when false.
        allow_rebase_merge:
          type: boolean
          description: Omitted when false.

    ForgeIssue:
      type: object
      required: [number, title, body, state, author, created_at, updated_at, is_pr]
      properties:
        number:
          type: integer
        title:
          type: string
        body:
          type: string
        state:
          type: string
        url:
          type: string
        html_url:
          type: string
        author:
          $ref: "#/components/schemas/ForgeUser"
        labels:
          type: array
          items:
            type: string
          description: Omitted when the issue has none.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        is_pr:
          type: boolean

    ForgeComment:
      type: object
      required: [body, user, created_at]
      properties:
        id:
          type: integer
          format: int64
        body:
          type: string
        user:
          $ref: "#/components/schemas/ForgeUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        url:
          type: string
        html_url:
          type: string

    ForgeIssueThread:
      type: object
      description: An issue with its comments.
      required: [issue, comments, truncated]
      properties:
        issue:
          $ref: "#/components/schemas/ForgeIssue"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/ForgeComment"
        truncated:
          type: boolean
          description: More comments exist than issuex read.
        comments_err:
          type: object
          description: >-
            Present when the issue was read and its comments could not be. The
            error as issuex has it (an empty object for a wrapped error), with
            the token and URL userinfo taken out of its text.

    ForgePullRequest:
      type: object
      required: [number, title, body, state, draft, merged, head_sha, head_branch, base_branch, author, created_at, updated_at]
      properties:
        number:
          type: integer
        title:
          type: string
        body:
          type: string
        state:
          type: string
        url:
          type: string
        html_url:
          type: string
        draft:
          type: boolean
        merged:
          type: boolean
        head_sha:
          type: string
        head_branch:
          type: string
        base_branch:
          type: string
        author:
          $ref: "#/components/schemas/ForgeUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time

    ForgePRState:
      type: object
      required: [number, state, merged, head_sha]
      properties:
        number:
          type: integer
        state:
          type: string
          description: "`open`, `closed` or `merged`."
        merged:
          type: boolean
        head_sha:
          type: string

    ForgeChangedFile:
      type: object
      required: [filename, status, additions, deletions]
      properties:
        filename:
          type: string
        status:
          type: string
        additions:
          type: integer
        deletions:
          type: integer

    ForgeCheckRun:
      type: object
      required: [name, status, conclusion]
      properties:
        name:
          type: string
        status:
          type: string
        conclusion:
          type: string
        summary:
          type: string
        url:
          type: string

    ForgeReview:
      type: object
      required: [author, state, body, submitted_at]
      properties:
        author:
          $ref: "#/components/schemas/ForgeUser"
        state:
          type: string
        body:
          type: string
        submitted_at:
          type: string
          format: date-time

    SandboxProfile:
      type: object
      description: >-
        A sandbox shape. It names the secrets and the environment keys and
        carries no value.
      required:
        - name
        - default
        - image
        - network
        - ttl_seconds
        - resources
        - secrets
        - optional_secrets
        - env_keys
        - require_landlock
      properties:
        name:
          type: string
          description: The profile name a caller chooses.
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
        default:
          type: boolean
          description: True for the one profile marked as the default. No profile need be.
        image:
          type: string
          description: The container image.
        network:
          type: string
          description: >-
            The network mode of a sandbox, one of the deployment's allowed
            modes: `none`, `allowlist` or `unrestricted`.
        ttl_seconds:
          type: integer
          description: The profile's lifetime in whole seconds, rounded down.
        resources:
          $ref: "#/components/schemas/SandboxResources"
        secrets:
          type: array
          description: Names of the secrets the profile injects, sorted ascending.
          items:
            type: string
        optional_secrets:
          type: array
          description: Names of the secrets injected when they exist, sorted ascending.
          items:
            type: string
        env_keys:
          type: array
          description: Keys of the profile's fixed environment, sorted ascending. Values are never returned.
          items:
            type: string
        require_landlock:
          type: boolean
          description: Whether a sandbox of this profile must confine its agent with Landlock.
      example:
        name: agent
        default: true
        image: registry.example.com/agent:1.4
        network: none
        ttl_seconds: 1200
        resources: {cpus: 2, memory_mb: 4096, pids: 512, disk_mb: 0}
        secrets: [ANTHROPIC_API_KEY, GIT_PAT]
        optional_secrets: [GH_TOKEN]
        env_keys: [LANG, TZ]
        require_landlock: true

    SandboxResources:
      type: object
      description: A profile's resource bounds. Zero means the provider's default.
      required: [cpus, memory_mb, pids, disk_mb]
      properties:
        cpus:
          type: number
        memory_mb:
          type: integer
        pids:
          type: integer
        disk_mb:
          type: integer

    RerereListResponse:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/RerereResolution"

    RerereResolution:
      type: object
      required: [id, path, recorded_at, resolved]
      properties:
        id:
          type: string
          description: rr-cache entry name (git's conflict hash); use it with DELETE.
        path:
          type: [string, "null"]
          description: >-
            File path of the conflict. Only known while the conflict is in
            progress (MERGE_RR), otherwise null.
        recorded_at:
          type: [string, "null"]
          format: date-time
          description: Derived from the modification time of the rr-cache entry.
        resolved:
          type: boolean
          description: True when a postimage (replayable resolution) is recorded.

    # -- Rebuilds --------------------------------------------------------------

    SubmitRebuildRequest:
      type: object
      description: >-
        Both fields are optional; each overrides the corresponding workspace
        variable for this run only.
      properties:
        strategy:
          type: string
          enum: [rebase, merge]
          description: >-
            `rebase` cherry-picks each unique commit; `merge` uses
            `git merge --no-ff`. Overrides `rebuild_strategy`.
        fail_mode:
          type: string
          enum: [fail_fast, continue]
          description: >-
            `fail_fast` aborts on the first unresolved conflict; `continue`
            marks the patch as `conflict`, resets to the pre-patch state, and
            proceeds. Overrides `rebuild_fail_mode`.

    RebuildJobEnqueued:
      type: object
      description: The durable job queue record returned when a rebuild is accepted.
      required: [id, type, key, group_key, status, payload]
      properties:
        id:
          type: string
          format: uuid
        type:
          const: rebuild
        key:
          type: string
          description: The deduplication key -- the workspace slug.
        group_key:
          type: string
          description: >-
            The serialization key, `<workspace-slug>:<integration-branch>`. At
            most one job per group runs at a time.
        status:
          $ref: "#/components/schemas/JobStatus"
        payload:
          $ref: "#/components/schemas/RebuildPayload"

    RebuildPayload:
      type: object
      properties:
        workspace_slug:
          type: string
        strategy:
          type: string
          enum: [rebase, merge]
        submitted_by:
          type: string
        integration_branch:
          type: string
        fail_mode:
          type: string
          enum: [fail_fast, continue]

    RebuildListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RebuildJob"

    RebuildJob:
      type: object
      description: |
        A rebuild of the integration branch. Fields carrying `omitempty` in the
        Go struct (`strategy`, `error`, `patch_results`,
        `integration_head_sha`, `previous_integration_head_sha`) are omitted
        when empty rather than serialised as null.
      required: [id, status, created_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        strategy:
          type: string
          enum: [rebase, merge]
        error:
          type: string
          description: Failure detail for failed jobs.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
          description: Null while the job is in a non-terminal state.
        patch_results:
          type: array
          description: >-
            Per-patch outcomes. Present for completed jobs, and for running jobs
            as intermediate progress that clients can poll.
          items:
            $ref: "#/components/schemas/RebuildPatchResult"
        integration_head_sha:
          type: string
          description: Integration branch HEAD after the rebuild.
        previous_integration_head_sha:
          type: string
          description: >-
            Integration branch HEAD before the rebuild. Empty on the first-ever
            rebuild.

    RebuildPatchResult:
      type: object
      required: [patch_id, branch_name, position, status, new_head_sha]
      properties:
        patch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [success, conflict, skipped]
        skipped_reason:
          type: string
          enum: [merged_upstream, disabled, deleted, branch_not_found]
          description: Present only when `status` is `skipped`.
        new_head_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Null on conflict or skip.
        conflict_files:
          type: array
          description: Present only when `status` is `conflict`.
          items:
            type: string
        source_sha:
          $ref: "#/components/schemas/Sha"
          description: >-
            The commit `refs/heads/<branch_name>` resolved to when patch
            application began; the tip the rebuild applied. Omitted for patches
            that were not attempted (skipped by status or `branch_not_found`).
            Addressed as `patch_results[].source_sha` in rebuild job objects.

    RollbackResponse:
      type: object
      required: [rolled_back_to]
      properties:
        rolled_back_to:
          $ref: "#/components/schemas/Sha"

    RebuildPreviewResponse:
      type: object
      required: [patch_results]
      properties:
        patch_results:
          type: array
          items:
            $ref: "#/components/schemas/RebuildPreviewPatchResult"

    RebuildPreviewPatchResult:
      type: object
      required: [patch_id, branch_name, position, status, conflict_files]
      properties:
        patch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [would_succeed, would_conflict]
        tree_sha:
          type: string
          description: The resulting tree SHA. Omitted when the patch would conflict.
        conflict_files:
          type: array
          description: Empty when the patch would succeed.
          items:
            type: string

    PatchStatusResponse:
      type: object
      description: |
        Health dashboard for a carry-patch stack.

        Invariants: `summary.total_patches == len(patches)` and
        `summary.active + summary.merged_upstream + summary.conflict +
        summary.disabled == summary.total_patches`.
      required:
        - workspace_slug
        - workspace_mode
        - status
        - clone_status
        - sync_status
        - sync_mode
        - head_sha
        - git_url
        - upstream_url
        - upstream_head_sha
        - integration_branch
        - integration_head_sha
        - last_sync_at
        - last_rebuild
        - patches
        - summary
      properties:
        workspace_slug:
          type: string
        workspace_mode:
          const: carry_patch
        status:
          type: string
        clone_status:
          type: string
        clone_error:
          type: string
          description: Omitted when empty.
        sync_status:
          type: string
        sync_error:
          type: string
          description: Omitted when empty.
        sync_mode:
          type: string
        head_sha:
          type: string
          description: Empty when the workspace has not been cloned yet.
        git_url:
          type: string
        upstream_url:
          type: string
        upstream_head_sha:
          type: string
        integration_branch:
          type: string
        integration_head_sha:
          type: string
          description: >-
            Derived from the latest rebuild result; empty when no rebuild has
            been attempted.
        last_sync_at:
          type: [string, "null"]
          format: date-time
        last_rebuild:
          oneOf:
            - $ref: "#/components/schemas/PatchStatusRebuild"
            - type: "null"
          description: Null when no rebuild has been attempted.
        patches:
          type: array
          description: All non-deleted patches, ordered by position.
          items:
            $ref: "#/components/schemas/PatchStatusEntry"
        summary:
          $ref: "#/components/schemas/PatchStatusSummary"

    PatchStatusRebuild:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"

    PatchStatusEntry:
      type: object
      required: [id, branch_name, position, status, last_rebuild_result]
      properties:
        id:
          type: string
        branch_name:
          type: string
        position:
          type: integer
        status:
          $ref: "#/components/schemas/PatchStatus"
        last_rebuild_result:
          type: [string, "null"]
          enum: [success, conflict, skipped, null]
          description: Null when no rebuild has been attempted.
        conflict_files:
          type: array
          description: Present only when `last_rebuild_result` is `conflict`.
          items:
            type: string
        origin_sync_state:
          type: [string, "null"]
          enum: [in_sync, diverged, missing_on_origin, null]
          description: >-
            Relationship between the local patch branch and the fork after the
            last sync. Null in hub mode. Omitted when null.
        origin_sha:
          type: [string, "null"]
          description: >-
            SHA of the fork tip at the last sync. Null when the fork has no
            such branch or in hub mode. Omitted when null.
        origin_synced_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Timestamp of the last origin sync. Null in hub mode. Omitted when
            null.

    PatchStatusSummary:
      type: object
      required:
        - total_patches
        - active
        - merged_upstream
        - conflict
        - disabled
        - total_rerere_resolutions
        - patches_diverged
        - patches_missing_on_origin
      properties:
        total_patches:
          type: integer
        active:
          type: integer
        merged_upstream:
          type: integer
        conflict:
          type: integer
        disabled:
          type: integer
        total_rerere_resolutions:
          type: integer
          description: Reported as 0 when the rr-cache is inaccessible.
        patches_diverged:
          type: integer
          description: >-
            Count of patches whose origin_sync_state is diverged. Always
            present; 0 in hub mode.
        patches_missing_on_origin:
          type: integer
          description: >-
            Count of patches whose origin_sync_state is missing_on_origin.
            Always present; 0 in hub mode.

    # -- Merges ----------------------------------------------------------------

    SubmitMergeRequest:
      type: object
      required: [target_branch, source_ref]
      properties:
        target_branch:
          type: string
          description: The branch being merged into.
        source_ref:
          type: string
          description: The branch being merged from.

    MergeJob:
      type: object
      required:
        - id
        - workspace_slug
        - target_branch
        - source_ref
        - status
        - base_sha
        - merged_sha
        - conflict_files
        - error
        - retry_count
        - submitted_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_slug:
          type: string
        target_branch:
          type: string
        source_ref:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        base_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Target HEAD before the merge; null until the job completes.
        merged_sha:
          oneOf:
            - $ref: "#/components/schemas/Sha"
            - type: "null"
          description: Target HEAD after the merge; null until the job completes.
        conflict_files:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]
        retry_count:
          type: integer
        submitted_by:
          type: string
          description: The authenticated identity that submitted the job.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BatchRebaseRequest:
      type: object
      required: [target_ref, branches]
      properties:
        target_ref:
          type: string
        branches:
          type: array
          minItems: 1
          items:
            type: string

    BatchRebaseResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/RebaseResult"

    RebaseResult:
      type: object
      required: [branch, status]
      properties:
        branch:
          type: string
        status:
          type: string
          enum: [ok, conflict, error]
        new_head:
          allOf:
            - $ref: "#/components/schemas/Sha"
          description: Omitted on conflict or error.
        conflict_files:
          type: array
          description: Omitted on success.
          items:
            type: string

    CancelledAck:
      type: object
      properties:
        status:
          const: cancelled

    # -- Secrets and variables -------------------------------------------------

    CreateEntriesRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EntryInput"

    EntryInput:
      type: object
      required: [key, value]
      properties:
        key:
          $ref: "#/components/schemas/EntryKeyName"
        value:
          type: string
          description: At most 256 KB (262144 bytes) once encoded.

    UpdateValueRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    SecretEntry:
      type: object
      description: A secret. The value is never returned by the API.
      required: [key, created_at, updated_at]
      properties:
        key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    VariableEntry:
      type: object
      required: [key, value, created_at, updated_at]
      properties:
        key:
          type: string
        value:
          type: string
          description: Stored base64-encoded internally and returned decoded.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResolvedVariableEntry:
      type: object
      required: [key, value, origin, created_at, updated_at]
      properties:
        key:
          type: string
        value:
          type: string
        origin:
          type: string
          enum: [user, org, workspace]
          description: Which tier supplied the winning value.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceSettings:
      type: object
      description: |
        A workspace's behaviour switches. Every key is present in a response
        with its effective value. In a request every key is optional; a key
        given as `null` returns to its default. An unknown key or a value a
        setting cannot take is rejected with `400`.
      properties:
        patch_branch_source:
          type: string
          enum: [hub, origin]
          default: hub
          description: >-
            The authority for patch branches. `hub`: the hub's clone. `origin`:
            the fork is fetched during sync and every registered patch branch
            follows the fork's tip.
        patch_divergence_policy:
          type: string
          enum: [replace, report]
          default: replace
          description: >-
            In `origin` mode, what happens when the hub's and the fork's copy
            of a patch branch diverged: `replace` the hub's copy (the old tip
            is kept under `refs/hub/replaced/<branch>`) or `report` it.
        push_patches_to_origin:
          type: boolean
          default: false
          description: >-
            Forward (origin mode) or mirror (hub mode) a push to a registered
            patch branch to the fork. In origin mode a push is rejected when
            this is off.
        auto_rebuild_after_push:
          type: boolean
          default: true
          description: A push to a registered patch branch enqueues a rebuild.
        auto_rebuild_after_sync:
          type: boolean
          default: true
          description: >-
            A carry-patch sync that observes upstream advancement or a patch
            branch change enqueues a rebuild.
        rebuild_strategy:
          type: string
          enum: [rebase, merge]
          default: rebase
          description: >-
            Strategy used to apply patches during a rebuild. Overridable
            per-rebuild via the `strategy` request field.
        rebuild_fail_mode:
          type: string
          enum: [fail_fast, continue]
          default: fail_fast
          description: >-
            Whether a rebuild aborts on the first conflict or skips the
            conflicting patch and continues. Overridable per-rebuild via the
            `fail_mode` request field.
        rebuild_push_integration_branch:
          type: boolean
          default: false
          description: >-
            Every successful rebuild force-pushes the integration branch to
            the fork with the workspace's credentials.
        squash_merge_detection:
          type: string
          enum: [ancestry_only, content_based, both]
          default: both
          description: >-
            Which strategies detect upstream merges during a carry-patch sync.
            `ancestry_only` uses `git merge-base --is-ancestor`;
            `content_based` uses `git cherry` plus PR-number scanning; `both`
            uses all of them and treats either signal as sufficient.
        forge_api_url:
          type: string
          default: ""
          description: >-
            The API URL of the forge behind `git_url`: an absolute `https://`
            URL with a host, without userinfo, query or fragment, or empty to
            find the API from the host.
        upstream_forge_api_url:
          type: string
          default: ""
          description: >-
            The same for the `upstream_url` of a `carry_patch` workspace; it
            does not fall back to `forge_api_url`.

    # -- Sessions --------------------------------------------------------------

    CreateSessionRequest:
      type: object
      required: [workspace_slug]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted. Makes the call idempotent.
        workspace_slug:
          type: string
        run_id:
          type: string
          description: Groups sessions belonging to the same run.
        node_id:
          type: string
          description: Task-graph node identifier.
        archetype:
          type: string
          description: Agent archetype label.
        model:
          type: string
        metadata:
          description: Arbitrary JSON metadata.

    CompleteSessionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, failed, timeout]
          description: "`terminated` is server-only and is rejected here."
        error_message:
          type: string
        duration_ms:
          type: [integer, "null"]
          format: int64
        cache_creation_input_tokens:
          type: integer
          format: int64

    ReportUsageRequest:
      type: object
      required: [model]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted.
        model:
          type: string
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        cache_read_tokens:
          type: integer
          format: int64
          minimum: 0

    Session:
      type: object
      required: [id, workspace_slug, status, credential_id, credential_type, started_at]
      properties:
        id:
          type: string
        workspace_slug:
          type: string
        run_id:
          type: string
        node_id:
          type: string
        archetype:
          type: string
        model:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        credential_id:
          type: string
          description: Identifier of the credential that opened the session.
        credential_type:
          type: string
          enum: [admin_token, api_key, pat]
        error_message:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]
          format: int64
        cache_creation_input_tokens:
          type: integer
          format: int64
        metadata: {}
        token_summary:
          $ref: "#/components/schemas/TokenSummary"

    TokenSummary:
      type: object
      required: [total_input_tokens, total_output_tokens, total_cache_read_tokens, models_used]
      properties:
        total_input_tokens:
          type: integer
          format: int64
        total_output_tokens:
          type: integer
          format: int64
        total_cache_read_tokens:
          type: integer
          format: int64
        models_used:
          type: array
          items:
            type: string

    TokenUsage:
      type: object
      required:
        - id
        - session_id
        - workspace_slug
        - model
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - reported_at
      properties:
        id:
          type: string
        session_id:
          type: string
        workspace_slug:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        reported_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required: [sessions, next_cursor, has_more]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    UsageListResponse:
      type: object
      required: [session_id, records, totals, next_cursor, has_more]
      properties:
        session_id:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/TokenUsage"
        totals:
          allOf:
            - $ref: "#/components/schemas/TokenSummary"
          description: Aggregates every record for the session, not just this page.
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    CostResponse:
      type: object
      required: [workspace, period, totals, breakdown]
      properties:
        workspace:
          type: string
        period:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
        totals:
          type: object
          required: [input_tokens, output_tokens, cache_read_tokens, sessions]
          properties:
            input_tokens:
              type: integer
              format: int64
            output_tokens:
              type: integer
              format: int64
            cache_read_tokens:
              type: integer
              format: int64
            sessions:
              type: integer
              format: int64
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/CostBreakdownEntry"

    CostBreakdownEntry:
      type: object
      description: >-
        Exactly one of `date`, `session_id`, or `model` is populated, matching
        the requested `group_by`.
      required: [input_tokens, output_tokens, cache_read_tokens, sessions]
      properties:
        date:
          type: string
          description: Present when `group_by=day`.
        session_id:
          type: string
          description: Present when `group_by=session`.
        model:
          type: string
          description: Present when `group_by=model`.
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64

    # -- Audit ingestion -------------------------------------------------------

    PostEventRequest:
      type: object
      required: [event_type]
      properties:
        id:
          type: string
          description: Client-provided identifier; generated when omitted. Makes ingestion idempotent.
        run_id:
          type: string
          description: >-
            When present it must match the `run_id` in the URL, otherwise the
            request is rejected with `400`.
        event_type:
          type: string
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: Defaults to a per-event-type value chosen by the server.
        node_id:
          type: string
        session_id:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Defaults to the current UTC time.
        payload:
          type: object
          additionalProperties: true

    PostEventResponse:
      type: object
      required: [id, run_id, event_type, severity, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type: { type: string }
        severity: { type: string }
        created_at: { type: string, format: date-time }

    PostSessionOutcomeRequest:
      type: object
      required: [session_id, status]
      properties:
        id: { type: string }
        run_id: { type: string }
        session_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        token_usage:
          type: object
          additionalProperties: true

    PostSessionOutcomeResponse:
      type: object
      required: [id, run_id, node_id, status, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }

    PostToolCallRequest:
      type: object
      required: [tool_name]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true

    PostToolCallResponse:
      type: object
      required: [id, run_id, tool_name, called_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        called_at: { type: string, format: date-time }

    PostToolErrorRequest:
      type: object
      required: [tool_name, error_msg]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        error_code: { type: string }
        error_msg: { type: string }
        timestamp: { type: string, format: date-time }

    PostToolErrorResponse:
      type: object
      required: [id, run_id, tool_name, failed_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        tool_name: { type: string }
        failed_at: { type: string, format: date-time }

    PostTraceRequest:
      type: object
      required: [event_type]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type:
          type: string
          enum: [session.init, assistant.message, tool.use, tool.error, session.result]
        node_id: { type: string }
        session_id: { type: string }
        sequence: { type: integer }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true

    PostTraceResponse:
      type: object
      required: [id, run_id, event_type, timestamp]
      properties:
        id: { type: string }
        run_id: { type: string }
        event_type: { type: string }
        timestamp: { type: string, format: date-time }

    PostPostmortemRequest:
      type: object
      required: [run_status, started_at, completed_at, task_summary, cost_summary]
      properties:
        schema_version:
          type: integer
          const: 1
          description: Rejected with `422` when present and not 1.
        run_status:
          type: string
          enum: [stalled, block_limit, cost_limit, session_limit]
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        task_summary:
          type: object
          description: Must contain a `total` field.
          required: [total]
          additionalProperties: true
          properties:
            total: { type: integer }
        cost_summary:
          type: object
          description: Aggregated token and cost totals.
          additionalProperties: true
        blocked_tasks:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string }
              reason: { type: string }
            additionalProperties: true
        session_history:
          type: array
          description: Opaque JSON array, stored as-is.
          items: {}

    PostPostmortemResponse:
      type: object
      required: [run_id, run_status, created_at]
      properties:
        run_id: { type: string }
        run_status: { type: string }
        created_at: { type: string, format: date-time }

    Postmortem:
      type: object
      required:
        - run_id
        - workspace
        - schema_version
        - run_status
        - started_at
        - completed_at
        - task_summary
        - cost_summary
        - blocked_tasks
        - session_history
        - ingested_at
      properties:
        run_id: { type: string }
        workspace: { type: string }
        schema_version: { type: integer }
        run_status: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        task_summary: {}
        cost_summary: {}
        blocked_tasks: {}
        session_history: {}
        ingested_at: { type: string, format: date-time }

    BatchIngestResponse:
      type: object
      required: [accepted, duplicates, errors]
      properties:
        accepted:
          type: integer
          description: Rows written.
        duplicates:
          type: integer
          description: Rows skipped because the identifier already existed.
        errors:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: Zero-based position of the failing item in the request array.
              id: { type: string }
              message: { type: string }

    # -- Audit query -----------------------------------------------------------

    AgentAuditEvent:
      type: object
      description: An agent-submitted audit event as returned by the per-run query.
      required: [id, run_id, workspace, event_type, severity, node_id, session_id, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        event_type: { type: string }
        severity: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        payload:
          description: >-
            The stored payload, decoded from JSON. Falls back to the raw string
            when it cannot be parsed.
        ingested_at: { type: string, format: date-time }

    AgentSessionOutcome:
      type: object
      required: [id, run_id, workspace, session_id, node_id, status, timestamp, duration_ms, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        session_id: { type: string }
        node_id: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer }
        token_usage: {}
        ingested_at: { type: string, format: date-time }

    AgentToolCall:
      type: object
      required: [id, run_id, workspace, tool_name, node_id, session_id, timestamp, duration_ms, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        timestamp: { type: string, format: date-time }
        duration_ms: { type: integer }
        input: {}
        output: {}
        ingested_at: { type: string, format: date-time }

    AgentToolError:
      type: object
      required: [id, run_id, workspace, tool_name, node_id, session_id, error_code, error_msg, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        tool_name: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        error_code: { type: string }
        error_msg: { type: string }
        timestamp: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }

    AgentTrace:
      type: object
      required: [id, run_id, workspace, event_type, node_id, session_id, sequence, timestamp, ingested_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        workspace: { type: string }
        event_type: { type: string }
        node_id: { type: string }
        session_id: { type: string }
        sequence: { type: integer }
        timestamp: { type: string, format: date-time }
        data: {}
        ingested_at: { type: string, format: date-time }

    CursorPage:
      type: object
      description: Fields shared by every cursor-paginated audit response.
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque token for the next page, or null when this is the last one.
        has_more:
          type: boolean

    RunEventListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/AgentAuditEvent"

    RunOutcomeListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [outcomes]
          properties:
            outcomes:
              type: array
              items:
                $ref: "#/components/schemas/AgentSessionOutcome"

    RunToolCallListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [calls]
          properties:
            calls:
              type: array
              items:
                $ref: "#/components/schemas/AgentToolCall"

    RunToolErrorListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/AgentToolError"

    RunTraceListResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [traces]
          properties:
            traces:
              type: array
              items:
                $ref: "#/components/schemas/AgentTrace"

    UnifiedAuditQueryResponse:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              description: Merged hub and agent events, newest first.
              items:
                $ref: "#/components/schemas/UnifiedAuditEvent"

    UnifiedAuditEvent:
      type: object
      description: >-
        A hub or agent audit event. The hub-only fields (`actor_id`,
        `actor_type`, `resource_type`, `resource_id`, `action`) are null on
        agent events, and the agent-only fields (`run_id`, `node_id`,
        `session_id`, `archetype`) are null on hub events.
      required:
        - id
        - event_type
        - source
        - timestamp
        - severity
        - workspace
        - actor_id
        - actor_type
        - resource_type
        - resource_id
        - action
        - run_id
        - node_id
        - session_id
        - archetype
      properties:
        id:
          type: string
        event_type:
          type: string
          description: Dot-notation type, for example `hub.workspace.create`.
        source:
          type: string
          enum: [hub, agent]
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
        workspace:
          type: string
        actor_id:
          type: [string, "null"]
        actor_type:
          type: [string, "null"]
        resource_type:
          type: [string, "null"]
        resource_id:
          type: [string, "null"]
        action:
          type: [string, "null"]
        run_id:
          type: [string, "null"]
        node_id:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        archetype:
          type: [string, "null"]

    TranscriptResponse:
      type: object
      required: [run_id, node_id, messages]
      properties:
        run_id:
          type: string
        node_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptMessage"

    TranscriptMessage:
      type: object
      required: [role, content, tool_name, timestamp]
      properties:
        role:
          type: string
          enum: [system, assistant, tool_use, tool_error]
        content:
          type: string
        tool_name:
          type: [string, "null"]
        timestamp:
          type: string
          format: date-time

    # -- Identity (apikit) -----------------------------------------------------

    User:
      type: object
      description: A user account.
      required:
        - id
        - username
        - email
        - full_name
        - role
        - status
        - provider
        - provider_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
          description: >-
            An `admin` role grants access to the administration endpoints when
            the credential is an API key. It confers no cross-tenant workspace
            or git access -- those check for an admin token directly.
        status:
          type: string
          description: >-
            `blocked` disables every API key the user owns at authentication
            time, without revoking them.
        provider:
          type: string
          description: The OAuth provider that authenticated this identity.
          examples: [github]
        provider_id:
          type: string
          description: The user's identifier at the OAuth provider.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, email, provider, provider_id]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        provider:
          type: string
        provider_id:
          type: string

    UpdateUserRequest:
      type: object
      description: >-
        `full_name` is the only mutable profile field. It is required: a
        missing or null value is rejected with `400`.
      required: [full_name]
      properties:
        full_name:
          type: string

    Organization:
      type: object
      required: [id, name, slug, url, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        url:
          type: string
        owner_id:
          type: [string, "null"]
          format: uuid
          description: Omitted when the organization has no owner.
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrgMember:
      type: object
      required: [org_id, user_id, username, email, role, created_at]
      properties:
        org_id:
          type: string
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrgRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Validated against the server's slug format.
        url:
          type: string
        owner_id:
          type: string
          format: uuid

    UpdateOrgRequest:
      type: object
      description: At least one field must be supplied.
      minProperties: 1
      properties:
        name:
          type: string
          description: Rejected when set to an empty string.
        url:
          type: string

    ApiKeyMeta:
      type: object
      description: >-
        API key metadata. The secret hash, the configured lifetime in days, and
        the plaintext secret are never exposed.
      required: [key_id, created_at, expires_at, revoked_at]
      properties:
        key_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null for a non-expiring key.
        revoked_at:
          type: [string, "null"]
          format: date-time

    ApiKeyMetaWithOwner:
      allOf:
        - $ref: "#/components/schemas/ApiKeyMeta"
        - type: object
          required: [user_id]
          properties:
            user_id:
              type: string
              format: uuid

    ApiKeyFull:
      type: object
      description: >-
        An API key including its plaintext value. Returned only by the OAuth
        callback and the refresh endpoint; the server persists only the
        SHA-256 hash.
      required: [key, key_id, expires_at]
      properties:
        key:
          type: string
          format: password
          description: The full `af_<key_id>_<secret>` value.
        key_id:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time

    PersonalAccessToken:
      type: object
      description: PAT metadata, never including the plaintext secret.
      required: [token_id, name, permissions, expires_at, created_at, revoked_at]
      properties:
        token_id:
          type: string
        name:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    PersonalAccessTokenWithOwner:
      allOf:
        - $ref: "#/components/schemas/PersonalAccessToken"
        - type: object
          required: [user_id]
          properties:
            user_id:
              type: string
              format: uuid

    PersonalAccessTokenWithSecret:
      type: object
      description: A newly created PAT, including its one-time plaintext value.
      required: [token_id, name, token, permissions, expires_at, created_at]
      properties:
        token_id:
          type: string
        name:
          type: string
        token:
          type: string
          format: password
          description: >-
            The full `af_pat_<token_id>_<secret>` value. Returned once at
            creation and never again.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
        permissions:
          type: array
          minItems: 1
          description: >-
            Every entry must be a registered scope. A PAT creating another PAT
            may only grant permissions it already holds.
          items:
            $ref: "#/components/schemas/PermissionScope"
        expires:
          type: integer
          enum: [0, 30, 60, 90]
          description: Token lifetime in days. `0` means no expiry.

    PermissionsRequest:
      type: object
      description: >-
        On `PUT`, an explicit empty array clears every permission and
        auto-revokes the token. On `PATCH` and `DELETE` an empty array is an
        error. An absent or null `permissions` field is always an error.
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"

    OAuthProvider:
      type: object
      required: [name, authorize_url]
      properties:
        name:
          type: string
          examples: [github]
        authorize_url:
          type: string
          description: The URL to send the user to in order to begin the OAuth flow.

    OAuthCallbackRequest:
      type: object
      required: [provider, code]
      properties:
        provider:
          type: string
          description: The provider name, as listed by `GET /api/v1/auth/providers`.
          examples: [github]
        code:
          type: string
          description: The authorization code returned by the OAuth provider.
        redirect_uri:
          type: string
          description: Validated against the provider's redirect allowlist.
        expires:
          type: [integer, "null"]
          enum: [0, 30, 60, 90, null]
          default: 90
          description: Requested API key lifetime in days. `0` means no expiry.

    OAuthCallbackResponse:
      type: object
      required: [user, api_key]
      properties:
        user:
          type: object
          required: [id, username, email, full_name, status, role, provider, provider_id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            email: { type: string, format: email }
            full_name: { type: [string, "null"] }
            status: { type: string }
            role: { type: string }
            provider: { type: string }
            provider_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        api_key:
          $ref: "#/components/schemas/ApiKeyFull"

    VersionResponse:
      type: object
      required: [go_version, build_time, commit, mount_point]
      properties:
        go_version:
          type: string
          description: The server version stamped at build time.
        build_time:
          type: string
        commit:
          type: string
        mount_point:
          type: string
          description: The prefix the API group is mounted at.
          default: /api/v1

    PermissionScope:
      type: string
      description: |
        A `resource:action` permission scope. Both halves match `^[a-z0-9_]+$`.
        The registry holds 30 scopes: 8 built into apikit and 22 registered by
        hub modules at startup, one `read` and one `write` scope per resource.
        PAT creation rejects unknown scopes with `400`.

        `resource:write` implies `resource:read` for every hub resource;
        `resource:read` never implies `resource:write`. The scopes the hub
        registered before (`workspaces:create`, `workspaces:delete`,
        `workspaces:sync`, `secrets:list`, `secrets:manage`, `secrets:delete`,
        `vars:manage`, `vars:delete`) are rewritten on stored tokens at hub
        start and are no longer accepted.
      pattern: "^[a-z0-9_]+:[a-z0-9_]+$"
      enum:
        - audit:read
        - audit:write
        - forge:read
        - forge:write
        - git:read
        - git:write
        - keys:manage
        - keys:read
        - merges:read
        - merges:write
        - orgs:read
        - orgs:write
        - patches:read
        - patches:write
        - rebuilds:read
        - rebuilds:write
        - sandboxes:read
        - sandboxes:write
        - secrets:read
        - secrets:write
        - sessions:read
        - sessions:write
        - tokens:manage
        - tokens:read
        - tokens:write
        - users:read
        - vars:read
        - vars:write
        - workspaces:read
        - workspaces:write
