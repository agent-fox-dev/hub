name: build the hub containers

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  build-hub-container:
    uses: ./.github/workflows/build.yaml
    with:
      container_name: hub
    secrets: inherit
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
